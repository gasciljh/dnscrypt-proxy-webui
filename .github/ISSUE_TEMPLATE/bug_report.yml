# ============================================================
# DNSCrypt Smart Filter — Bug Report Template
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-19
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# GitHub Issue Forms (YAML-based)
# Reference: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
# ============================================================
# Cross-references:
#   • docs/GUIDE.md §10                 — FAQ
#   • docs/GUIDE.md §7                  — troubleshooting
#   • docs/REFERENCE.md §4              — backup system
#   • docs/GUIDE.md §8                  — emergency recovery
#   • docs/REFERENCE.md §2              — HTTP API
#   • docs/REFERENCE.md §3              — v1.3.0 SNAP-*/ROT-*
#   • docs/REFERENCE.md §1.4            — Layered Bootstrap (v1.5.0)
#   • docs/REFERENCE.md §3.12           — install_app.sh contract (v1.5.0)
#   • docs/REFERENCE.md §5              — device/ROM matrix
#   • docs/adr/0002-external-dependency.md (v1.5.0)
#   • docs/adr/0003-layered-bootstrap.md   (v1.5.0)
#   • .github/workflows/ci.yml          — companion app metadata step
#   • CHANGELOG.md                      — version history
# ============================================================
# v1.5.0 additions:
#   • "Latest version" checkbox references v1.5.0.
#   • New optional section "📲 v1.5.0 — Companion Install
#     Diagnostics" with five fields:
#       - Install-token issuance status (60 s TTL, one-shot)
#       - 5-level cascade outcome (strategy 1..5)
#       - HTTP status from /api/install_companion_app
#       - SELinux staging state (/data/local/tmp/dnscrypt-companion.apk)
#       - Play Protect verifier restore state
#   • New optional section "🧩 v1.5.0 — Layered Bootstrap"
#     with two fields.
#   • Updated WebUI install-button hint (install-method modal,
#     IDX-24).
#   • New ADR references: ADR-0002 (external dependency) and
#     ADR-0003 (Layered Bootstrap).
#   • No new audit corrections — v1.5.0 is a feature release.
#     Audit Corrections Registry remains at #33.
# ============================================================
# v1.5.0 — POST-AUDIT FIXES:
#   🔧 IHV-1 — Added v1.5.0 Companion Install Diagnostics section.
#   🔧 IHV-2 — Added v1.5.0 Layered Bootstrap section.
#   🔧 IHV-3 — Updated "Audit Corrections Registry" note.
# ============================================================

name: 🐛 Bug Report
description: Report a bug or unexpected behavior in DNSCrypt Smart Filter
title: "[Bug] "
labels: ["bug", "triage"]
assignees:
  - gasciljh

body:
# ============================================================
# [1] Initial warning
# ============================================================
  - type: markdown
    attributes:
      value: |
        ## 🐛 Thank you for reporting a bug!

        Before you continue, make sure that you:

        - Read [docs/GUIDE.md §10 (FAQ)](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/GUIDE.md#10-faq)
        - Checked [docs/GUIDE.md §7 (Troubleshooting)](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/GUIDE.md#7-troubleshooting)
        - Checked [docs/REFERENCE.md §4 (Backup)](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/REFERENCE.md#4-backup-system)
        - Checked [docs/GUIDE.md §8 (Emergency Recovery)](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/GUIDE.md#8-emergency-recovery)
        - Searched [existing Issues](https://github.com/gasciljh/dnscrypt-proxy-webui/issues?q=is%3Aissue)
        - Are running the **latest version** of the module (v1.5.0)

        ---

        > **Security notice**: if the issue is a **security vulnerability**, do not open a public Issue.
        > Use [GitHub Private Vulnerability Reporting](https://github.com/gasciljh/dnscrypt-proxy-webui/security/advisories/new) instead.

# ============================================================
# [2] Pre-flight checks
# ============================================================
  - type: checkboxes
    id: preflight
    attributes:
      label: ✅ Pre-flight checks
      description: All items must be confirmed to continue
      options:
        - label: I have read FAQ.md, TROUBLESHOOTING.md, BACKUP.md, and EMERGENCY.md
          required: true
        - label: I searched existing Issues and did not find the same problem
          required: true
        - label: I am running the latest version of the module (v1.5.0)
          required: true
        - label: This is not a security vulnerability (otherwise I would use Private Reporting)
          required: true
        - label: I have taken a manual backup of my config (recommended before any destructive test)
          required: false

# ============================================================
# [3] Problem description
# ============================================================
  - type: textarea
    id: description
    attributes:
      label: 📝 Problem description
      description: A clear and concise description of the problem. What happened? What did you expect?
      placeholder: |
        Example:
        After updating the module to v1.5.0, the WebUI stopped working.
        When opening http://127.0.0.1:9090, a blank page appears.
        I expected the main interface with the service status.
    validations:
      required: true

# ============================================================
# [4] Reproduction steps
# ============================================================
  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to reproduce
      description: How can the problem be reproduced? Be as specific as possible.
      placeholder: |
        1. Install the module v1.5.0 from Magisk
        2. Reboot the device
        3. Open the WebUI from the Action button
        4. Click "Install App" in the header
        5. Choose "Install locally"
        6. ...
      value: |
        1.
        2.
        3.
    validations:
      required: true

# ============================================================
# [5] Expected behavior
# ============================================================
  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected behavior
      description: What should happen?
      placeholder: 'Example: the companion app should be installed via the 5-level cascade and the button should show "✅ Installed"'
    validations:
      required: true

# ============================================================
# [6] Actual behavior
# ============================================================
  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual behavior
      description: What actually happens? (attach error messages if any)
      placeholder: 'Example: the button shows "❌ Install failed" and the log says "all strategies failed"'
    validations:
      required: true

# ============================================================
# [7] Frequency
# ============================================================
  - type: dropdown
    id: frequency
    attributes:
      label: 🔄 Frequency
      description: Does the problem happen intermittently or always?
      options:
        - 🔴 Always (100%)
        - 🟡 Often (50-99%)
        - 🟠 Sometimes (10-49%)
        - 🟢 Rarely (<10%)
        - ❓ Not sure
    validations:
      required: true

# ============================================================
# [8] Device environment
# ============================================================
  - type: markdown
    attributes:
      value: |
        ## 📱 Environment information

        > 💡 You can obtain most of this information with:
        > ```bash
        > su -c "sh /data/adb/modules/dnscrypt-proxy-webui/status.sh --json"
        > ```

  - type: input
    id: module_version
    attributes:
      label: 🏷️ Module version
      description: 'From `module.prop` or `status.sh` — example: v1.5.0'
      placeholder: 'v1.5.0'
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: 🤖 Android version
      description: 'Example: Android 14 (API 34) — from `getprop ro.build.version.release`'
      placeholder: 'Android 14 (API 34)'
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 📱 Device
      description: 'Full model — example: Pixel 6 Pro, Xiaomi 13, Samsung S23'
      placeholder: 'Pixel 6 Pro'
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: 💿 ROM
      description: 'Example: Stock, LineageOS 21, Pixel Experience, MIUI 14'
      placeholder: 'LineageOS 21'
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: ⚙️ Kernel
      description: 'From `uname -r` — example: 5.15.94-lineageos'
      placeholder: '5.15.94-lineageos'
    validations:
      required: true

  - type: dropdown
    id: root_solution
    attributes:
      label: 🔓 Root solution
      description: Which Root tool are you using?
      options:
        - Magisk
        - Magisk Delta
        - Magisk Canary
        - KernelSU
        - APatch
        - Other
    validations:
      required: true

  - type: input
    id: root_version
    attributes:
      label: 🔢 Root version
      description: 'Example: Magisk 27.0, KernelSU 0.9.5'
      placeholder: 'Magisk 27.0'
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: 🏗️ CPU architecture
      description: 'From `getprop ro.product.cpu.abi`'
      options:
        - arm64-v8a (ARM64)
        - armeabi-v7a (ARMv7)
        - x86_64 (x64)
        - x86
        - ❓ Not sure
    validations:
      required: true

  - type: input
    id: soc
    attributes:
      label: 🔧 SoC
      description: 'Optional — example: Snapdragon 8 Gen 2, Exynos 2200, Dimensity 9000'
      placeholder: 'Snapdragon 8 Gen 2'
    validations:
      required: false

# ============================================================
# [9] v1.1.0 — Memory limit diagnostics
# ============================================================
  - type: markdown
    attributes:
      value: |
        ## 🧠 v1.1.0 — Memory limit diagnostics

        > **Since v1.1.0**: `main.go` adjusts the Go runtime soft memory
        > limit based on the active blocklist profile. If your issue
        > relates to **performance**, **RAM usage**, or **crashes**
        > (especially with the `ultimate` profile), please fill in
        > the two fields below.
        >
        > ```bash
        > su -c "sh /data/adb/modules/dnscrypt-proxy-webui/status.sh --json" | jq '.profile'
        > ```
        >
        > ⚠️ The HTTP endpoint (`/api?action=runtime_info`) requires
        > credentials. If you prefer to query it directly, use:
        > ```bash
        > CREDS=/data/local/tmp/dnscrypt_credentials.txt
        > USER=$(grep '^Username:' "$CREDS" | awk '{print $2}')
        > PASS=$(grep '^Password:' "$CREDS" | awk '{print $2}')
        > curl -s -u "$USER:$PASS" \
        >   'http://127.0.0.1:9090/api?action=runtime_info' | \
        >   jq '{profile_key, memory_limit_mb}'
        > ```

  - type: input
    id: active_profile
    attributes:
      label: 📋 Active profile
      description: 'From `runtime_info` → `profile_key` — one of: light, normal, pro, proplus, ultimate'
      placeholder: 'pro'
    validations:
      required: false

  - type: input
    id: memory_limit_mb
    attributes:
      label: 🧠 Memory limit (MB)
      description: 'From `runtime_info` → `memory_limit_mb` — expected values: 80 / 100 / 120 / 160 / 220'
      placeholder: '120'
    validations:
      required: false

# ============================================================
# [10] v1.2.0 — Data preservation diagnostics
# ============================================================
  - type: markdown
    attributes:
      value: |
        ## 💾 v1.2.0 — Data Preservation Diagnostics

        > **Since v1.2.0**: The installer uses a 10-layer
        > data-preservation architecture. If your issue relates to
        > **lost settings**, **restore failures**, **upgrade
        > problems**, **recovery mode**, or **orphan transactions**,
        > please fill in the fields below.
        >
        > ```bash
        > su -c "sh /data/adb/modules/dnscrypt-proxy-webui/status.sh --diagnose"
        > ```
        >
        > **⚠️ v1.3.0 semantics apply**: `backups.available` counts
        > directories that contain a `.manifest.json` (SNAP-MANIFEST);
        > `backups.last_backup_name` is selected by mtime (SNAP-MTIME).
        > The `.last_stable` target and the newest install snapshot are
        > protected from pruning (ROT-PROTECT).

  - type: input
    id: backup_count
    attributes:
      label: 💾 Persistent backup count
      description: 'From `status.sh --diagnose` → "N snapshot(s) available". Count is manifest-based (SNAP-MANIFEST).'
      placeholder: '7'
    validations:
      required: false

  - type: input
    id: last_stable
    attributes:
      label: 🎯 Last stable snapshot
      description: 'From `cat /sdcard/dnscrypt-webui-backup/.last_stable` — protected from pruning by ROT-PROTECT.'
      placeholder: '20261013-095826-v1.5.0-12345'
    validations:
      required: false

  - type: dropdown
    id: recovery_mode_active
    attributes:
      label: 🚨 Recovery mode trigger
      description: 'Is `/data/adb/modules/dnscrypt-proxy-webui/recovery` present?'
      options:
        - 'No — trigger file is NOT present'
        - 'Yes — trigger file IS present'
        - '❓ Not sure — did not check'
    validations:
      required: false

  - type: input
    id: orphan_txn_count
    attributes:
      label: 🗃️ Orphan transactions
      description: 'From `ls /sdcard/dnscrypt-webui-backup/orphan-txn-* 2>/dev/null | wc -l`'
      placeholder: '0'
    validations:
      required: false

  - type: textarea
    id: upgrade_history
    attributes:
      label: 📜 Upgrade history (optional)
      description: 'Excerpt from `/sdcard/dnscrypt-webui-backup/.upgrade_history.json` (or `.txt` fallback)'
      placeholder: |
        ```json
        {
          "upgrades": [
            {
              "from": "v1.4.0",
              "to": "v1.5.0",
              "date": "2026-10-13T10:30:00Z",
              "source": "/data/adb/modules/dnscrypt-proxy-webui/proxy",
              "files": 5
            }
          ]
        }
        ```
      render: json
    validations:
      required: false

# ============================================================
# [10b] v1.5.0 — Layered Bootstrap diagnostics
# ============================================================
  - type: markdown
    attributes:
      value: |
        ## 🧩 v1.5.0 — Layered Bootstrap (Layer 0 / Layer 1)

        > **Since v1.5.0 (Phase 0)**: the module's shell library is
        > split into **Layer 0** (`proxy/boot-mini.sh` — 5 primitives
        > + `_MONITORING_UI_PORT`) and **Layer 1** (`proxy/functions.sh`
        > — every other helper). Layer 1 sources Layer 0 at load time.
        > See [ADR-0003](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/adr/0003-layered-bootstrap.md).
        >
        > If your issue relates to **shell scripts**, **status.sh**,
        > **action.sh**, **watchdog.sh**, or **boot-time failures**,
        > fill in the two fields below.

  - type: dropdown
    id: layer0_present
    attributes:
      label: 🧩 Layer 0 file present?
      description: 'Run: `su -c "test -f /data/adb/modules/dnscrypt-proxy-webui/boot-mini.sh && echo present || echo missing"`'
      options:
        - 'Yes — boot-mini.sh is present'
        - 'No — boot-mini.sh is missing'
        - '❓ Not sure — did not check'
    validations:
      required: false

  - type: input
    id: layer1_sources_layer0
    attributes:
      label: 🧩 Layer 1 sources Layer 0?
      description: 'Run: `su -c "grep -c boot-mini.sh /data/adb/modules/dnscrypt-proxy-webui/functions.sh"` — expected: ≥ 1'
      placeholder: '1'
    validations:
      required: false

# ============================================================
# [11] v1.4.0 — Companion APK route diagnostics
# ============================================================
  - type: markdown
    attributes:
      value: |
        ## 📱 v1.4.0 — Companion APK Route

        > **Since v1.4.0**: the companion Android app
        > (`web/app-debug.apk`) is served at `GET /app-debug.apk`.
        > This route remains reachable as a **fallback** when the
        > v1.5.0 local install cascade fails.
        >
        > ⚠️ The APK is **optional**: local developer builds may omit
        > it; the installer succeeds with or without it; a missing
        > APK produces a 404 on `/app-debug.apk`.

  - type: dropdown
    id: companion_apk_installed
    attributes:
      label: 📲 Companion app installed on this device?
      options:
        - 'Yes — installed and working'
        - 'Yes — installed but not working'
        - 'No — using the WebUI in a browser'
        - '❓ Not sure'
    validations:
      required: false

  - type: input
    id: companion_apk_route_status
    attributes:
      label: 🌐 `/app-debug.apk` route status
      description: 'Run: `curl -sI http://127.0.0.1:9090/app-debug.apk | head -1` — expected: 200 (APK present) or 404 (OPTIONAL)'
      placeholder: 'HTTP/1.1 200 OK'
    validations:
      required: false

  - type: input
    id: companion_app_version
    attributes:
      label: 🏷️ Companion app version (if present)
      description: 'From `cat /data/adb/modules/dnscrypt-proxy-webui/proxy/app-apk.version` — expected: X.Y.Z'
      placeholder: '1.0.0'
    validations:
      required: false

# ============================================================
# [11b] v1.5.0 — Companion Install Diagnostics
# ============================================================
  - type: markdown
    attributes:
      value: |
        ## 📲 v1.5.0 — Companion Install Diagnostics

        > **Since v1.5.0**: the WebUI install button opens an
        > install-method modal (IDX-24) offering three actions:
        > local root install (via `POST /api/install_companion_app`
        > + `install_app.sh` — 5-level `pm install` cascade), plus
        > two GitHub fallbacks (open page / direct download).
        >
        > **Failure modes** specific to this flow:
        >   • **HTTP 401** — one-shot CSRF token expired (60 s TTL).
        >     Try again.
        >   • **HTTP 403** — non-localhost request (install is
        >     localhost-only).
        >   • **HTTP 429** — 5 failed attempts in 15 min (per-IP
        >     lockout). Wait 15 minutes.
        >   • **HTTP 200 / `status: "error"`** — all 5 cascade
        >     levels failed. Check the failing reason and hint
        >     fields (AR/EN).
        >
        > See `SECURITY.md §5.36` for the full model.

  - type: input
    id: install_http_status
    attributes:
      label: 🌐 Install HTTP status
      description: 'From the WebUI Network tab or `install_app.sh` output — one of: 200 (success), 200 (failure), 401, 403, 429'
      placeholder: '200'
    validations:
      required: false

  - type: dropdown
    id: install_strategy_used
    attributes:
      label: 🎯 Cascade strategy used (if success)
      description: 'From the JSON response `strategy` field — 1..5'
      options:
        - 'Strategy 1 — pm install -r --user 0'
        - 'Strategy 2 — pm install -r -i com.android.shell'
        - 'Strategy 3 — Session-based (install-create + install-write + install-commit)'
        - 'Strategy 4 — magisk su -c "pm install -r"'
        - 'Strategy 5 — cmd package install -r'
        - '❌ All strategies failed'
        - '❓ N/A — did not attempt local install'
    validations:
      required: false

  - type: textarea
    id: install_failure_details
    attributes:
      label: ❌ Install failure details
      description: 'If the install failed, paste the JSON response body (message_en, message_ar, hint_en, hint_ar)'
      placeholder: |
        ```json
        {
          "status": "error",
          "action": "install",
          "message_en": "All install strategies failed — try the manual download",
          "hint_en": "Check that the device is not protected by Play Protect."
        }
        ```
      render: json
    validations:
      required: false

  - type: input
    id: install_token_status
    attributes:
      label: 🔑 Install token status
      description: 'Did `GET /api?action=install_token` succeed? (60 s TTL, one-shot, localhost-only)'
      placeholder: 'Yes — token issued and consumed on first use'
    validations:
      required: false

  - type: dropdown
    id: selinux_staging_state
    attributes:
      label: 🔒 SELinux staging state
      description: 'Did `/data/local/tmp/dnscrypt-companion.apk` exist during the install and disappear afterwards?'
      options:
        - 'Yes — staging file appeared then disappeared'
        - 'No — staging file never appeared'
        - 'Staging file remained after the install (unexpected)'
        - '❓ Not sure — did not check'
    validations:
      required: false

  - type: dropdown
    id: play_protect_restored
    attributes:
      label: 🛡️ Play Protect verifier restored?
      description: 'Did `settings get global package_verifier_enable` return the original value after the install?'
      options:
        - 'Yes — value was restored to its original state'
        - 'No — value was left disabled (rare; Play Protect self-heals on next scan)'
        - '❓ Not sure — did not check'
    validations:
      required: false

# ============================================================
# [12] Logs (optional but very useful)
# ============================================================
  - type: markdown
    attributes:
      value: |
        ## 📋 Logs and diagnostics

        > 💡 All fields below are **optional** but greatly speed up diagnostics.
        > **Do not upload logs as images** — paste the text directly.
        >
        > **⚠️ Two distinct `backups` objects**:
        > The `backups` object returned by `/api?action=runtime_info`
        > has **SEVEN fields**.
        > The `backups` object returned by `status.sh --json` has
        > **NINE fields** — the same seven plus `status` and
        > `last_backup_age_seconds`.
        >
        > ⚠️ `curl` against any `/api` endpoint requires authentication.
        > Prefer `status.sh --json`, which reads files directly:
        > ```bash
        > su -c "sh /data/adb/modules/dnscrypt-proxy-webui/status.sh --json" | jq '.backups'
        > ```

  - type: textarea
    id: log_main
    attributes:
      label: 📜 WebUI log (`dnscrypt_main.log`)
      description: 'Last 50 lines from `/data/local/tmp/dnscrypt_main.log`'
      placeholder: |
        ```
        [2026-10-13T10:30:00Z] 🚀 Starting DNSCrypt WebUI v1.5.0
        [2026-10-13T10:30:00Z] 🧠 v1.1.0: dynamic memory limit — profile=pro, limit=120 MB
        [2026-10-13T10:30:00Z] 🆕 v1.2.0: data-preservation layers active
        [2026-10-13T10:30:00Z] 💾 v1.2.0: persistent backup dir = /sdcard/dnscrypt-webui-backup
        [2026-10-13T10:30:00Z] 🆕 v1.3.0: buildBackupInfo — SNAP-MANIFEST + SNAP-MTIME
        [2026-10-13T10:30:00Z] 🆕 v1.3.0: service.sh — boot-path DNS auto-start
        [2026-10-13T10:30:00Z] 🔧 v1.4.0: currentLogLevel loaded right after initPaths (MAIN-01)
        [2026-10-13T10:30:00Z] 🆕 v1.4.0: CodeQL path-injection fix in removeModule
        [2026-10-13T10:30:00Z] 🆕 v1.4.0: iOS PWA logic removed
        [2026-10-13T10:30:00Z] 🧩 v1.5.0: Layer 0 loaded (boot-mini.sh — 5 primitives + constant)
        [2026-10-13T10:30:00Z] 🧩 v1.5.0: Layer 1 loaded (functions.sh — sources boot-mini.sh)
        [2026-10-13T10:30:00Z] 📱 v1.5.0: companion install endpoints registered (4)
        [2026-10-13T10:30:00Z] 🔐 v1.5.0: install token TTL = 60s (one-shot, localhost-only)
        [2026-10-13T10:30:00Z] 🌐 v1.5.0: HTTP_WRITE_TIMEOUT = 150s (> INSTALL_TIMEOUT 90s)
        [2026-10-13T10:30:00Z] 🔧 v1.5.0: MAIN-REENT-01 — logger three-layer split
        [2026-10-13T10:30:00Z] 🔧 v1.5.0: MAIN-PORTCACHE-01 — port cache (30s TTL)
        [2026-10-13T10:30:01Z] 📋 LOG_LEVEL=info
        ...
        ```
      render: shell
    validations:
      required: false

  - type: textarea
    id: status_json
    attributes:
      label: 📊 `status.sh --json` output (NINE-field `.backups`)
      description: 'Run: `su -c "sh /data/adb/modules/dnscrypt-proxy-webui/status.sh --json"`'
      placeholder: |
        ```json
        {
          "version": "v1.5.0",
          "dns_engine": {"running": true, "port": 5354},
          "webui": {"running": true, "port": 9090},
          "profile": {"key": "pro", "name": "PRO", "memory_limit_mb": 120},
          "backups": {
            "status": "ok",
            "available": 7,
            "in_flight_txn": 0,
            "orphan_txn": 0,
            "last_backup": "2026-10-13 15:00:00",
            "last_backup_name": "20261013-150000-manual-12345",
            "last_backup_age_seconds": 3600,
