# ============================================================
# DNSCrypt Smart Filter – Issue Templates Configuration
# Version: v1.2.0 (Global Edition)
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Customizes the "New Issue" page on GitHub:
#   • Disables "Open a blank issue" (forces the user to pick a template)
#   • Adds quick links (Discussions, Security, Docs)
#   • Routes questions to the correct channels
#
# Reference:
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
# ============================================================
# v1.1.0 additions (kept):
#   • Added three new contact links covering the workflow docs
#     added during the v1.0.0 cycle:
#       - docs/BRANCHING.md        (Git workflow)
#       - docs/RELEASE_PROCESS.md  (Release process)
#       - docs/adr/README.md       (Architecture Decision Records)
#     These are essential for contributors who want to submit
#     PRs but are unsure about branch/PR policy.
#   • Reordered contact links so the most commonly-needed ones
#     appear first.
#   • Expanded the documentation for each field so a future
#     maintainer can understand the intent without cross-checking
#     multiple GitHub pages.
#
# ============================================================
# v1.2.0 additions:
#   • Version bumped from v1.1.0 to v1.2.0.
#   • Added three new v1.2.0-specific contact links, placed
#     immediately after the troubleshooting link:
#       - docs/BACKUP.md      — Backup system reference
#       - docs/EMERGENCY.md   — Emergency recovery guide
#       - docs/UPGRADE.md     — Version upgrade guide
#     These are the first things a user should read if they
#     suspect data loss, restore failure, or an upgrade problem.
#   • Reordered the full contact list to reflect the v1.2.0
#     priorities (FAQ → Troubleshooting → Backup → Emergency →
#     Upgrade → Discussions → Security → Install → Branching →
#     Release Process → ADRs → Compatibility → Changelog →
#     Roadmap).
#   • Expanded the "about" text for the backup and emergency
#     links to explain the recovery trigger (`recovery` file)
#     and the persistent backup directory
#     (`/sdcard/dnscrypt-webui-backup/`).
#   • All text is English-only (global edition). No Arabic
#     strings exist in this file.
#
# ============================================================
# v1.2.0 — POST-AUDIT FIXES (this file, still v1.2.0)
# ============================================================
# A pre-release audit of this file identified the following
# issues. All of them are addressed in-place; no version bump.
#
#   🔧 ISS-4 — Every `about:` field was a multi-line block
#     scalar (`|`) containing 3–6 lines of text. GitHub renders
#     the `about` string in a small card next to the link name,
#     with a very limited vertical budget (roughly two lines).
#     A block scalar that long is either visually truncated or
#     forces the card to scroll — neither of which is what the
#     reader expects. All `about:` values have been rewritten as
#     two-line summaries. The detail that was removed from each
#     card still lives in the linked document itself, which is
#     where a reader who follows the link will see it.
#
# Cross-references (v1.2.0):
#   • docs/BACKUP.md      — backup system reference
#   • docs/EMERGENCY.md   — emergency recovery guide
#   • docs/UPGRADE.md §3.1 — v1.1.0 → v1.2.0 upgrade path
# ============================================================

# ============================================================
# [1] Prevent empty Issues
# ============================================================
# Disabling "Open a blank issue" forces the user to choose a
# template, which automatically ensures the required information
# is collected (version, device, logs, etc.).
#
# When to enable this?
#   • Yes: projects that need structured information (like ours).
#     A blank issue would bypass the preflight checks and
#     environment fields, making bug reports much harder to act on.
#   • No: flexible projects that allow full freedom.
#
# Our choice: false (strict) — the project receives bug reports
# from a wide range of devices/ROMs/kernels, and unstructured
# reports would slow down triage significantly.
#
# v1.2.0 note: the strictness is even more important now, because
# data-loss reports REQUIRE the v1.2.0 diagnostic block
# (backup count, last_stable, recovery mode, orphan txn). A blank
# issue would silently lose that context.
# ============================================================
blank_issues_enabled: false

# ============================================================
# [2] Quick contact links
# ============================================================
# Appear below "New Issue" — guide the user to the correct channel.
#
# Ordering rationale (v1.2.0):
#   Links are listed in decreasing order of how often they are
#   needed by first-time visitors:
#     1. FAQ                 — before asking anything
#     2. Troubleshooting     — before opening a bug
#     3. Backup reference    — for data-loss / restore questions
#     4. Emergency recovery  — for bootloop / lost-data scenarios
#     5. Upgrade guide       — for version-to-version questions
#     6. Discussions         — general questions
#     7. Security            — private vulnerability reports
#     8. Install             — installation questions
#     9. Branching           — before opening a PR
#    10. Release Process     — how releases are cut
#    11. ADRs                — architectural decisions
#    12. Compatibility       — "will it work on my device?"
#    13. Changelog           — "what's new?"
#    14. Roadmap             — "will feature X be added?"
#
# ISS-4 fix: all `about` values below are two-line summaries.
# GitHub renders them in a narrow card; multi-line block scalars
# (used previously) were visually truncated or forced scroll.
# ============================================================
