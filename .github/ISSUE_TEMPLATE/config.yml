# ============================================================
# [1] Prevent empty Issues
# ============================================================
# Disabling "Open a blank issue" forces the user to choose a
# template, which automatically ensures the required information
# is collected (version, device, logs, etc.).
#
# v1.5.0 note: the strictness is more important than ever. The
# v1.5.0 companion-install flow introduces new failure modes
# (token expiry, localhost gate, rate limit, cascade exhaustion,
# SELinux staging, Play Protect) and the Layer 0/1 split
# introduces new shell failure modes. Both diagnostics blocks
# are only reachable through the bug report template — a blank
# issue would silently lose all that context.
# ============================================================
blank_issues_enabled: false

# ============================================================
# [2] Quick contact links
# ============================================================
# Appear below "New Issue" — guide the user to the correct
# channel.
#
# Ordering:
#   1. FAQ                 — before asking anything
#   2. Troubleshooting     — before opening a bug
#   3. Backup reference    — data-loss / restore questions
#   4. Emergency recovery  — bootloop / lost-data scenarios
#   5. Upgrade guide       — version-to-version questions
#   6. Discussions         — general questions
#   7. Security            — private vulnerability reports
#   8. Install             — installation questions
#   9. Branching           — before opening a PR
#  10. Release Process     — how releases are cut
#  11. ADRs                — architectural decisions
#  12. Compatibility       — "will it work on my device?"
#  13. Changelog           — "what's new?"
#  14. Roadmap             — "will feature X be added?"
#
# `about:` values are two-line summaries. GitHub renders them
# in a narrow card with a very limited vertical budget.
# ============================================================
