# ============================================================
# DNSCrypt Smart Filter – Feature Request Template
# Version: v1.4.0 (Global Edition)
# Last updated: 2026-10-08
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# GitHub Issue Forms (YAML-based) — the modern standard
# Reference: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
# ============================================================
# Cross-references:
# ============================================================
#   • .github/ISSUE_TEMPLATE/bug_report.yml        — bug report form
#   • .github/ISSUE_TEMPLATE/config.yml            — templates config
#   • .github/PULL_REQUEST_TEMPLATE.md             — PR template
#   • .github/PULL_REQUEST_TEMPLATE/release.md     — release PR template
#   • docs/ROADMAP.md                              — v1.5.0 + v2.0.0
#   • docs/BACKUP.md                               — backup system (v1.2.0)
#   • docs/EMERGENCY.md                            — recovery (v1.2.0)
#   • docs/UPGRADE.md §3.x                         — upgrade paths
#   • docs/ARCHITECTURE.md §4.13                   — v1.3.0 refinements
#   • docs/adr/README.md                           — ADR system
#   • docs/HALL_OF_FAME.md                         — badges
#   • docs/COMPATIBILITY.md                        — device matrix
#   • CHANGELOG.md                                 — version history
#   • gasciljh/dnscrypt-proxy-app                  — companion repo (v1.4.0)
# ============================================================
# v1.4.0 additions:
#   • Pre-flight checklist now also references v1.4.0 concepts:
#     companion Android app, iOS removal, and CodeQL hardening.
#   • New request_type option:
#       - "📱 Companion app / native client (v1.4.0)"
#   • New request_type option:
#       - "📲 PWA / install experience (v1.3.0)"
#   • New "willing_to_contribute" option:
#       - "📱 I can help with the companion app (v1.4.0)"
#   • ROADMAP reference updated: v1.5.0 and v2.0.0 are now the
#     currently-tracked future versions (v1.3.0 and v1.4.0 have
#     shipped).
#   • References section extended with the companion app repo.
#   • MAIN-01 (v1.4.0, source-level): `main.go` now loads
#     `LOG_LEVEL` immediately after `initPaths()`. This is
#     transparent to feature requests, but any proposal that
#     depends on the WebUI's startup log ordering should be
#     aware of the fix.
#
# ============================================================
# v1.3.0 additions (extended in this revision):
# ============================================================
#   • Pre-flight checklist now references docs/BRANCHING.md and
#     docs/RELEASE_PROCESS.md for process-related ideas.
#   • ROADMAP reference updated to mention v1.4.0 and v2.0.0 as
#     the currently-tracked future versions (this was the state
#     at the time of the v1.3.0 release).
#
#   Server-side refinements (backup layer):
#     The v1.3.0 release ALSO refined snapshot-detection and
#     rotation semantics that underpin the persistent backup
#     system. Three identifiers (used in CHANGELOG.md [v1.3.0]
#     and docs/ARCHITECTURE.md §4.13):
#
#       🔧 SNAP-MANIFEST — `main.go:buildBackupInfo()` detects
#         a snapshot by `.manifest.json` presence, not by name
#         pattern.
#
#       🔧 SNAP-MTIME — `last_backup_name` is selected by
#         mtime, descending (with a name-based fallback).
#
#       🔧 ROT-MANIFEST + ROT-MTIME + ROT-PROTECT —
#         `functions.sh:rotate_backups()` uses the same
#         detection + sort, plus two protected targets
#         (`.last_stable` + newest install snapshot).
#
#   ⚠️ Impact on THIS file:
#     The v1.3.0 release did NOT add or remove any request_type
#     option. But proposals that **touch the backup layer** (the
#     "💾 Backup / data preservation improvement (v1.2.0)"
#     option) now need to be aware of the v1.3.0 semantics:
#       • Any new snapshot-producing path MUST write a
#         `.manifest.json` file (SNAP-MANIFEST).
#       • Any new rotation logic MUST sort by mtime
#         (SNAP-MTIME / ROT-MTIME), not by name.
#       • The `.last_stable` target and the newest install
#         snapshot MUST be protected from pruning (ROT-PROTECT).
#     The "Data-preservation impact" section below is the right
#     place to discuss this.
#
# ============================================================
# v1.2.0 additions (carried forward):
#   • Version bumped to v1.2.0.
#   • Pre-flight checklist now also requires checking:
#       - docs/BACKUP.md      (backup system reference)
#       - docs/EMERGENCY.md   (emergency recovery guide)
#     Any feature that touches user data, backups, or
#     restoration MUST be discussed in light of these two
#     documents first.
#   • Added a new "Data-preservation impact" section with four
#     options to declare how the proposal interacts with the
#     10 defensive layers:
#       - No interaction
#       - Extends existing layer(s)
#       - Adds a new layer (11th)
#       - Changes existing behavior (needs a migration path)
#   • Added "Data Guardian (v1.2.0)" to the "willing to
#     contribute" options.
#   • The "Request type" dropdown gained a new option:
#       - "💾 Backup / data preservation improvement (v1.2.0)"
#   • All text is English-only (global edition).
#
# ============================================================
# v1.2.0 — POST-AUDIT FIXES (still applies):
# ============================================================
#   🔧 ISS-5 — The last item of the "Pre-flight checks" section
#     asked the proposer to confirm that their idea "aligns with
#     the project philosophy (Zero-Telemetry, Localhost-Only,
#     Data-Preservation-First)". The first two terms are defined
#     in README.md and ARCHITECTURE.md §1.2. The third —
#     "Data-Preservation-First" — appears nowhere else in the
#     project. A proposer who searches for it would find no
#     definition, which makes the checkbox effectively
#     un-answerable.
#
#     The term has been replaced with a lowercase descriptive
#     phrase — "user-data preservation" — which conveys the same
#     intent (respect for the 10 defensive layers) without
#     inventing a capitalized proper noun.
# ============================================================

name: ✨ Feature Request
description: Suggest a new feature or improvement for DNSCrypt Smart Filter
title: "[Feature] "
labels: ["enhancement", "triage"]
assignees:
  - gasciljh

body:
  # ============================================================
  # [1] Initial warning
  # ============================================================
  - type: markdown
    attributes:
      value: |
        ## ✨ Thank you for contributing a new idea!

        Before you continue, make sure that you:

        - Read [docs/ROADMAP.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/ROADMAP.md)
        - Read [docs/FAQ.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/FAQ.md)
        - Read [docs/BACKUP.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/BACKUP.md) (v1.2.0)
        - Read [docs/EMERGENCY.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/EMERGENCY.md) (v1.2.0)
        - Checked [docs/adr/](https://github.com/gasciljh/dnscrypt-proxy-webui/tree/main/docs/adr) for existing architectural decisions
        - Searched [existing Issues](https://github.com/gasciljh/dnscrypt-proxy-webui/issues?q=is%3Aissue) and [Discussions](https://github.com/gasciljh/dnscrypt-proxy-webui/discussions)
        - The feature aligns with the [project philosophy](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/README.md)

        ---

        > 💡 **Tips for a successful request**:
        > - Focus on the **problem** first, then the **proposed solution**.
        > - Mention the **benefits** and **use cases**.
        > - Mention the **alternatives** you considered.
        > - Avoid vague requests ("improve performance").
        > - If your idea **changes** an existing architectural decision,
        >   consider proposing it as an **ADR** (see request type below).
        > - If your idea **touches user data, backups, or restoration**,
        >   fill in the "Data-preservation impact" section below.
        >   v1.2.0 encodes a strict contract here — see
        >   [docs/BACKUP.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/BACKUP.md).
        > - If your idea **touches the companion Android app** (v1.4.0),
        >   note that it lives in a **separate repository**
        >   ([gasciljh/dnscrypt-proxy-app](https://github.com/gasciljh/dnscrypt-proxy-app)).

  # ============================================================
  # [2] Pre-flight checks
  # ============================================================
  - type: checkboxes
    id: preflight
    attributes:
      label: ✅ Pre-flight checks
      description: All items must be confirmed to continue
      options:
        - label: I have read ROADMAP.md and FAQ.md
          required: true
        - label: I have read BACKUP.md and EMERGENCY.md (v1.2.0)
          required: true
        - label: I checked docs/adr/ for existing architectural decisions on this topic
          required: true
        - label: I searched Issues and Discussions and did not find the same idea
          required: true
        - label: This feature has not been rejected before (I checked closed Issues)
          required: true
        - label: This idea aligns with the project philosophy (Zero-Telemetry, Localhost-Only, user-data preservation)
          required: true

  # ============================================================
  # [3] Request type
  # ============================================================
  - type: dropdown
    id: request_type
    attributes:
      label: 🎯 Request type
      description: What kind of feature do you want to suggest?
      options:
        - ✨ New feature
        - ⚡ Performance improvement
        - 🎨 UI/UX improvement
        - 🔒 Security improvement
        - 📖 Documentation improvement
        - 🌐 New translation
        - 🔧 Compatibility improvement
        - 🛠️ Dev tooling
        - ♻️ Refactor
        - 🐳 Deployment / Docker
        - 💾 Backup / data preservation improvement (v1.2.0)
        - 📲 PWA / install experience (v1.3.0)
        - 📱 Companion app / native client (v1.4.0)
        - 📋 ADR proposal (reverses or amends an existing decision)
        - 🔄 Other
    validations:
      required: true

  # ============================================================
  # [4] Problem statement
  # ============================================================
  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problem the feature solves
      description: |
        What bothers you currently? What does not work the way you want?
        Write from a user perspective — not a technical one.
      placeholder: |
        Example:
        I cannot export my custom rules (Allowlist/Denylist) as a backup.
        When I reinstall the module, I lose all my manual rules.
        I have to rewrite them by hand after every major upgrade.
    validations:
      required: true

  # ============================================================
  # [5] Proposed solution
  # ============================================================
  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed solution
      description: |
        How do you imagine the feature? Be as specific as possible.
        You can attach sketches or mockups (even hand-drawn).
      placeholder: |
        Example:
        Add an "Export" button in the custom rules section:
        - Produces a downloadable JSON file
        - Contains allowlist.txt + denylist.txt
        - Can be imported later via an "Import" button

        Proposed design:
        ┌──────────────────────────────┐
        │  [Export]  [Import]          │
        └──────────────────────────────┘
    validations:
      required: true

  # ============================================================
  # [6] Alternatives considered
  # ============================================================
  - type: textarea
    id: alternatives
    attributes:
      label: ⚖️ Alternatives considered
      description: |
        What alternatives did you try? Why did they not work?
        This helps us understand why the proposed solution is the best.
      placeholder: |
        Example:
        1. Manual copy via ADB from /data/adb/modules/.../proxy/
           - ❌ Complex for the average user
           - ❌ Requires adb + root permissions

        2. Write the lines manually in an external text file
           - ❌ Prone to errors
           - ❌ Does not save automatically
    validations:
      required: true

  # ============================================================
  # [7] Benefits
  # ============================================================
  - type: textarea
    id: benefits
    attributes:
      label: 🎁 Expected benefits
      description: How will this feature improve the project? (quantify if possible)
      placeholder: |
        Example:
        - ✅ Time saved: 5–10 minutes per recovery operation
        - ✅ Fewer errors: no need for manual retyping
        - ✅ Encourages customization: lowers the entry barrier for custom rules
        - ✅ Serves 30–40% of users (based on survey X)
    validations:
      required: true

  # ============================================================
  # [8] Use cases
  # ============================================================
  - type: textarea
    id: use_cases
    attributes:
      label: 🎬 Use cases
      description: List real-world scenarios for the feature
      placeholder: |
        Example:
        **UC-1: Major upgrade**
        - User wants to upgrade the module from v1.3.0 to v1.4.0
        - Exports the rules first
        - Updates the module
        - Imports the rules immediately

        **UC-2: Transfer settings to a new device**
        - User buys a new phone
        - Exports the rules from the old one
        - Imports them on the new one
      value: |
        **UC-1:**
        -

        **UC-2:**
        -
    validations:
      required: false

  # ============================================================
  # [9] Suggested priority
  # ============================================================
  - type: dropdown
    id: priority
    attributes:
      label: 📊 Priority from your perspective
      description: How important is this feature to you? (helps us prioritize the ROADMAP)
      options:
        - 🔴 Critical — I use it daily
        - 🟠 Important — greatly enhances my experience
        - 🟡 Useful — nice to have
        - 🟢 Low — minor improvement
        - ⚪ Idea — for future generations
    validations:
      required: true

  # ============================================================
  # [10] Data-preservation impact (v1.2.0)
  # ============================================================
  - type: markdown
    attributes:
      value: |
        ## 💾 Data-preservation impact (v1.2.0)

        > **New in v1.2.0**: The installer uses a 10-layer
        > data-preservation architecture. If your proposal
        > touches user data, backups, restoration, upgrade
        > behavior, or uninstall behavior, please fill in the
        > section below.
        >
        > This is not a gate — it is a **planning aid**. It
        > ensures the discussion starts with the right context.
        >
        > **⚠️ v1.3.0 semantics apply** (SNAP-MANIFEST,
        > SNAP-MTIME, ROT-MANIFEST, ROT-MTIME, ROT-PROTECT).
        > If your proposal adds or modifies a snapshot-producing
        > path, or changes how rotation selects candidates, you
        > must align with these rules — see
        > [docs/ARCHITECTURE.md §4.13](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/ARCHITECTURE.md).
        >
        > See [docs/BACKUP.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/BACKUP.md)
        > for the full reference.

  - type: dropdown
    id: data_preservation_impact
    attributes:
      label: 💾 How does this proposal interact with the 10 defensive layers?
      description: |
        The 10 layers are documented in docs/BACKUP.md §1.3.
        Choose the option that best describes your proposal.
      options:
        - 'No interaction — the proposal does not touch user data, backups, or restore logic'
        - 'Extends an existing layer — adds a new case to an existing layer (e.g. a new candidate source path)'
        - 'Adds a new layer (11th) — introduces a new defensive mechanism'
        - 'Changes existing behavior — modifies how a layer works today (needs a migration path)'
        - '❓ Not sure — I need guidance on how this interacts'
    validations:
      required: false

  - type: textarea
    id: data_preservation_details
    attributes:
      label: 💾 Data-preservation details (optional)
      description: |
        If your proposal touches data preservation, describe:
        - Which of the 5 preserved files are affected
          (webui.conf, dnscrypt-proxy.toml, selected_profile.txt,
           allowlist.txt, denylist.txt)
        - Whether a new file should be added to the preserved set
        - Whether the .manifest.json schema needs to change
        - Whether existing backups would still be valid
        - Whether a migration is needed for users upgrading from v1.1.0
        - (v1.3.0) Whether the proposal respects the
          SNAP-MANIFEST / SNAP-MTIME / ROT-* semantics
      placeholder: |
        Example:
        - Affected file: allowlist.txt (extension of Layer 2)
        - No schema change to .manifest.json
        - Existing backups remain valid
        - Migration: none needed; v1.2.0 already handles 5 files
        - Uninstall behavior: unchanged (backup dir preserved)
        - (v1.3.0) Snapshot-producing path writes a manifest
          (.manifest.json). Rotation sorts by mtime.
    validations:
      required: false

  # ============================================================
  # [11] Willing to contribute?
  # ============================================================
  - type: dropdown
    id: willing_to_contribute
    attributes:
      label: 🤝 Are you willing to contribute to the implementation?
      description: |
        This is completely optional — it does not affect feature acceptance.
        But it helps us estimate the timeline.
      options:
        - 💪 Yes, I can send a PR
        - 🤝 Yes, but I need guidance
        - 🧪 I can help with testing
        - 📖 I can help with documentation
        - 💾 I can help with backup testing across devices (v1.2.0)
        - 📱 I can help with the companion app (v1.4.0)
        - 👀 Sadly no — I leave it to the maintainer
    validations:
      required: false

  # ============================================================
  # [12] Mockups / Screenshots
  # ============================================================
  - type: textarea
    id: mockups
    attributes:
      label: 🎨 Mockups / Screenshots (optional)
      description: |
        If you have a visual concept, upload it here.
        Accepts: PNG, JPG, GIF, SVG, even hand-drawn sketches.
      placeholder: 'Drag images here or paste with Ctrl+V'
    validations:
      required: false

  # ============================================================
  # [13] Examples from other projects (optional)
  # ============================================================
  - type: textarea
    id: examples
    attributes:
      label: 🔗 Examples from other projects
      description: |
        Have you seen this feature in a similar project? (AdGuard, Pi-hole, NextDNS, etc.)
        List the links — saves research time.
      placeholder: |
        - AdGuard Home: https://github.com/AdguardTeam/AdGuardHome/issues/...
        - Pi-hole: feature X implemented with...
    validations:
      required: false

  # ============================================================
  # [14] ADR-related features
  # ============================================================
  - type: markdown
    attributes:
      value: |
        ## 📐 ADR-related features

        > If your proposal **changes** or **reverses** an existing
        > architecture decision, please fill in the section below.
        >
        > The project keeps all architectural decisions as ADRs in
        > [`docs/adr/`](https://github.com/gasciljh/dnscrypt-proxy-webui/tree/main/docs/adr).
        > Reversals are handled by creating a **new** ADR that
        > supersedes the old one — never by editing an accepted ADR.
        >
        > This section is optional. Skip it if your proposal does not
        > touch an existing decision.

  - type: input
    id: adr_reference
    attributes:
      label: 📐 Related ADR(s)
      description: 'ADR numbers this proposal relates to (e.g. "ADR-0001, ADR-0006") — or leave empty'
      placeholder: 'ADR-0001'
    validations:
      required: false

  - type: textarea
    id: adr_impact
    attributes:
      label: 📐 How does this affect the referenced decision?
      description: |
        Does it **amend** the decision (backward-compatible extension)
        or **reverse** it (contradicts the original rationale)?
      placeholder: |
        Example (amend):
        This extends ADR-0001 with a third permanent branch
        (`staging`) but does not change the two-branch rationale.

        Example (reverse):
        This reverses ADR-0004 (unified PR template). The new
        template would be split into 3 instead of 2.
    validations:
      required: false

  # ============================================================
  # [15] Technical considerations
  # ============================================================
  - type: textarea
    id: technical_notes
    attributes:
      label: 🏗️ Technical considerations (optional)
      description: |
        If you are a developer, share any architectural notes:
        - Potentially affected files
        - Required API changes
        - New dependencies
        - Compatibility constraints
        - Whether an ADR might be needed
      placeholder: |
        Example:
        - Requires a new endpoint: POST /api/export_rules
        - Must update main.go (new handler)
        - No new dependencies
        - Compatibility: works on all versions
        - May need an ADR if the endpoint shape is
          considered a public API commitment
    validations:
      required: false

  # ============================================================
  # [16] Additional context
  # ============================================================
  - type: textarea
    id: additional
    attributes:
      label: 📌 Additional context
      description: Anything else you want to share
      placeholder: |
        - Related links
        - Articles or discussions
        - Assumed timeline (aligned with which ROADMAP version —
          v1.5.0, v2.0.0, or later?)
        - Any other information
    validations:
      required: false

  # ============================================================
  # [17] Final confirmation
  # ============================================================
  - type: checkboxes
    id: final_confirmation
    attributes:
      label: 🤝 Final confirmation
      options:
        - label: I understand that not every feature request will be implemented
          required: true
        - label: I will follow up on replies and answer the maintainer's questions
          required: true
        - label: I am ready to accept rejection of the feature if it does not align with the project philosophy
          required: true

  # ============================================================
  # [18] References (footer)
  # ============================================================
  - type: markdown
    attributes:
      value: |
        ---

        ## 📚 References

        - [docs/ROADMAP.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/ROADMAP.md) — v1.5.0 and v2.0.0 are the currently-tracked future versions
        - [docs/BACKUP.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/BACKUP.md) — backup system reference (v1.2.0 + v1.3.0 rotation semantics)
        - [docs/EMERGENCY.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/EMERGENCY.md) — emergency recovery guide (v1.2.0)
        - [docs/UPGRADE.md §3.1](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/UPGRADE.md) — v1.1.0 → v1.2.0 upgrade path
        - [docs/ARCHITECTURE.md §4.13](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/ARCHITECTURE.md) — v1.3.0 server-side refinements (SNAP-*/ROT-*)
        - [docs/HALL_OF_FAME.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/HALL_OF_FAME.md) — Data Guardian badge (v1.2.0) + Memory Architect badge (v1.1.0)
        - [docs/adr/README.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/docs/adr/README.md) — ADR system and index
        - [Companion app repository](https://github.com/gasciljh/dnscrypt-proxy-app) — separate repo (v1.4.0)
        - [CHANGELOG.md](https://github.com/gasciljh/dnscrypt-proxy-webui/blob/main/CHANGELOG.md) — version history (v1.0.0 → v1.4.0)
