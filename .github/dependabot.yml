# ============================================================
# HARD-DEP-01 — Major-version guard for github-actions
# ============================================================
#   Dependabot repeatedly proposed major-version updates that
#   did NOT exist on GitHub (actions/checkout@v7,
#   actions/upload-artifact@v7, softprops/action-gh-release@v3,
#   github/codeql-action@v4). This matches the v1.1.0 incident
#   documented in release.yml as HARD-REL-13 and in ci.yml as
#   HARD-CI-01.
#
#   FIX: the github-actions ecosystem carries an `ignore:` block
#   that excludes `version-update:semver-major` for:
#
#     • actions/*                   (checkout, setup-go, ...)
#     • softprops/action-gh-release
#     • github/codeql-action
#     • nttld/setup-ndk
#
#   Patch and minor updates are still proposed.
#
#   Major-version bumps should be applied manually after
#   reviewing the upstream changelog.
# ============================================================
# What Dependabot does NOT track:
# ============================================================
# There are FIVE files in this repository that contain a
# "version" string (or a checksum) but are NOT dependency
# manifests. Dependabot will never open a PR against them.
# This is intentional.
#
#   1. proxy/dnscrypt-proxy.version
#      ─ The upstream dnscrypt-proxy version (e.g. "2.1.18").
#      ─ Managed by scripts/fetch_dns_binaries.sh.
#      ─ Updated manually when the upstream DNSCrypt project
#        ships a new release. See docs/REFERENCE.md §6.
#
#   2. proxy/app-apk.version
#      ─ The companion Android app version (e.g. "1.0.0").
#      ─ Managed by scripts/fetch_app_apk.sh.
#      ─ Updated manually when the companion app project
#        (gasciljh/dnscrypt-proxy-app) ships a new release.
#
#   3. VERSION
#      ─ The module version (e.g. "v1.5.0").
#      ─ Managed by scripts/release.sh (and release-patch.sh).
#      ─ Updated automatically at each release.
#
#   4. module.prop
#      ─ The Magisk / KernelSU module definition.
#      ─ Contains `version=v1.5.0` and `versionCode=1050000`.
#      ─ Both fields are updated together by scripts/release.sh.
#
#   5. proxy/go.sum  (v1.5.0 — DB-V15-02)
#      ─ The checksum manifest for the single external Go
#        dependency (filepath-securejoin v0.7.0) and its four
#        test-only transitive dependencies.
#      ─ Regenerated by `go mod tidy` whenever `go.mod` changes.
#      ─ Dependabot never edits `go.sum` directly — it edits
#        `go.mod`, and `go.sum` follows. Any manual edit is
#        rejected by `go mod verify`.
#
# If you ever see a Dependabot PR that touches one of these
# five files, it is a false positive. Close the PR and open an
# Issue — the .github/dependabot.yml configuration may need a
# `directory` / `package-ecosystem` adjustment.
#
# ============================================================

version: 2

# ============================================================
# [1] GitHub Actions
# ============================================================
# Most important for security: outdated Actions may contain
# known vulnerabilities.
#
# Covered files:
#   • .github/workflows/ci.yml
#   • .github/workflows/codeql.yml
#   • .github/workflows/release.yml
#   • .github/workflows/upgrade-test.yml
#   • any new workflow
#
# Example automatic PR:
#   "ci: bump actions/checkout from v4 to v5"
# ============================================================
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      # HARD-DEP-01: see the header block for the full rationale.
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "softprops/action-gh-release"
        update-types: ["version-update:semver-major"]
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nttld/setup-ndk"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "gasciljh"
    assignees:
      - "gasciljh"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: "scope"
    target-branch: "main"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# ============================================================
# [2] Go Modules (proxy/go.mod)
# ============================================================
# CORRECTED in v1.5.0 (DB-V15-01). The project has exactly
# ONE external Go dependency since v1.4.1 (stable since
# v1.5.0):
#
#   require github.com/cyphar/filepath-securejoin v0.7.0
#
# Pinned per ADR-0002. Introduced to close two CodeQL
# `go/path-injection` alerts in `removeModule`.
#
# Current state:
#   • go.mod: `module dnscrypt-webui`
#              + `go 1.22`
#              + `require github.com/cyphar/filepath-securejoin v0.7.0`
#   • go.sum: present — pins v0.7.0 + 4 test-only transitive deps
#             (testify, go-spew, go-difflib, yaml.v3).
#
# ADR-0002 compliance:
#   • A BUMP of this dependency (e.g. v0.7.0 → v0.8.0) does NOT
#     require a new ADR, but does require reading the upstream
#     changelog before merging the Dependabot PR.
#   • A NEW external dependency requires its own ADR before the
#     corresponding Dependabot PR can be merged.
#
# Example automatic PR:
#   "build(deps): bump filepath-securejoin from v0.7.0 to v0.7.1"
# ============================================================
  - package-ecosystem: "gomod"
    directory: "/proxy"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "gasciljh"
    assignees:
      - "gasciljh"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    target-branch: "main"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore major updates automatically — reviewed manually as
    # they may break compatibility.
    #
    # Example: filepath-securejoin v0.x → v1.x is a breaking
    # change and should be reviewed before merging. Per ADR-0002,
    # a significant version jump may also require a new ADR.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

# ============================================================
# [3] Dev Containers (devcontainer.json features)
# ============================================================
# File: .devcontainer/devcontainer.json
#
# Covered features:
#   • ghcr.io/devcontainers/features/go
#   • ghcr.io/devcontainers/features/github-cli
#   • ghcr.io/devcontainers/features/common-utils
#
# Example automatic PR:
#   "chore(devcontainer): bump devcontainers/features/go"
# ============================================================
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    reviewers:
      - "gasciljh"
    labels:
      - "dependencies"
      - "devcontainer"
    commit-message:
      prefix: "chore"
      include: "scope"
    target-branch: "main"

# ============================================================
# How Dependabot interacts with the release process
# ============================================================
#
# Dependabot PRs are merged into `main` directly (see
# target-branch above). They do NOT trigger a release by
# themselves — a release requires an explicit version bump via
# scripts/release.sh. However, merged Dependabot PRs are
# included in the next scheduled release's CHANGELOG.
#
# For CVE fixes specifically, the maintainer may choose to
# immediately cut a PATCH release with scripts/release-patch.sh
# rather than waiting for the next scheduled release. See
# docs/CONTRIBUTING.md §13 (Hotfix Flow) for the PATCH release flow.
#
# Cross-references:
#   • docs/adr/0002-external-dependency.md
#                              — external-dependency policy
#   • docs/REFERENCE.md §6     — DNS binaries (Level 4)
#   • docs/REFERENCE.md §4     — backup system reference
#   • docs/GUIDE.md §8         — emergency recovery guide
#   • docs/GUIDE.md §5         — upgrade paths
#
# ============================================================
# How to verify the configuration
# ============================================================
#
# 1. On GitHub:
#    Settings → Code security and analysis
#    → Dependabot version updates: Enabled
#
# 2. In the Dependabot tab:
#    Insights → Dependency graph → Dependabot
#    Shows: last scan, discovered dependencies, open PRs
#
# 3. Manual trigger:
#    Actions → Dependabot Updates → "Check for updates"
#
# 4. Validate the file locally:
#    python3 -c "import yaml; yaml.safe_load(open('.github/dependabot.yml'))"
#    → must complete without errors
#
# ============================================================