#
# ============================================================
# What Dependabot does NOT track:
# ============================================================
# There are three files in this repository that contain a
# "version" string but are NOT dependency manifests. Dependabot
# will never open a PR against them. This is intentional.
#
#   1. proxy/dnscrypt-proxy.version
#      ─ The upstream dnscrypt-proxy version (e.g. "2.1.18").
#      ─ Managed by scripts/fetch_dns_binaries.sh, which reads
#        it as the Single Source of Truth.
#      ─ Updated manually when the upstream DNSCrypt project
#        ships a new release. See docs/DNS_BINARIES.md §10.
#
#   2. VERSION
#      ─ The module version (e.g. "v1.2.0").
#      ─ Managed by scripts/release.sh (and release-patch.sh).
#      ─ Updated automatically at each release.
#
#   3. module.prop
#      ─ The Magisk / KernelSU module definition.
#      ─ Contains `version=v1.2.0` and `versionCode=1020000`.
#      ─ Both fields are updated together by scripts/release.sh.
#
# If you ever see a Dependabot PR that touches one of these
# three files, it is a false positive. Close the PR and open an
# Issue — the .github/dependabot.yml configuration may need a
# `directory` / `package-ecosystem` adjustment.
#
# ============================================================

version: 2

# ============================================================
# [1] GitHub Actions
# ============================================================
# Most important for security: outdated Actions may contain
# known vulnerabilities (e.g. arbitrary code execution via a
# compromised release, deprecated Node runtime).
#
# Covered files:
#   • .github/workflows/ci.yml
#   • .github/workflows/codeql.yml
#   • .github/workflows/release.yml
#   • .github/workflows/upgrade-test.yml   ← v1.2.0
#   • any new workflow
#
# Example automatic PR:
#   "ci: bump actions/checkout from v6 to v7"
# ============================================================
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "gasciljh"
    assignees:
      - "gasciljh"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: "scope"
    target-branch: "main"
    # Group all GitHub Actions updates into a single PR
    # (reduces noise, simplifies review)
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ============================================================
  # [2] Go Modules (proxy/go.mod)
  # ============================================================
  # The project currently uses stdlib only (no external
  # dependencies). This section is useful if dependencies are
  # added in the future.
  #
  # Current state:
  #   • go.mod: contains `module dnscrypt-webui` + `go 1.22`
  #   • go.sum: absent (no dependencies)
  #
  # v1.2.0 note:
  #   The v1.2.0 data-preservation release adds no new imports
  #   to main.go. All new code (createAutoBackup, notifications,
  #   cleanupOldTransactions) uses only the Go standard library
  #   (os, filepath, strings, fmt, time) — all already imported
  #   in v1.1.0. The dependency-free policy is preserved.
  #
  # Future benefit:
  #   • If a package is added (e.g. golang.org/x/sys), Dependabot
  #     keeps it up to date.
  #   • Detects CVEs in newly added dependencies.
  #
  # Example automatic PR:
  #   "build(deps): bump golang.org/x/sys from v0.5.0 to v0.6.0"
  # ============================================================
  - package-ecosystem: "gomod"
    directory: "/proxy"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "gasciljh"
    assignees:
      - "gasciljh"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    target-branch: "main"
    # Group all Go updates into one PR (monthly)
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore major updates automatically — reviewed manually as
    # they may break compatibility.
    #
    # Example: golang.org/x/sys v0.x → v1.x is a breaking change
    # and should be reviewed before merging.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ============================================================
  # [3] Dev Containers (devcontainer.json features)
  # ============================================================
  # File: .devcontainer/devcontainer.json
  #
  # Covered features:
  #   • ghcr.io/devcontainers/features/go
  #   • ghcr.io/devcontainers/features/github-cli
  #   • ghcr.io/devcontainers/features/common-utils
  #
  # Note:
  #   Dependabot has supported the `devcontainers` ecosystem
  #   since 2023. If issues arise, this section can be removed
  #   without affecting the other two.
  #
  # Example automatic PR:
  #   "chore(devcontainer): bump devcontainers/features/go"
  # ============================================================
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    reviewers:
      - "gasciljh"
    labels:
      - "dependencies"
      - "devcontainer"
    commit-message:
      prefix: "chore"
      include: "scope"
    target-branch: "main"

# ============================================================
# How Dependabot interacts with the release process
# ============================================================
#
# Dependabot PRs are merged into `main` directly (see
# target-branch above). They do NOT trigger a release by
# themselves — a release requires an explicit version bump via
# scripts/release.sh. However, merged Dependabot PRs are
# included in the next scheduled release's CHANGELOG.
#
# For CVE fixes specifically, the maintainer may choose to
# immediately cut a PATCH release with scripts/release-patch.sh
# rather than waiting for the next scheduled release. See
# docs/RELEASE_PROCESS.md §2.3 for the PATCH release flow.
#
# v1.2.0 cross-references:
#   • docs/BACKUP.md      — backup system reference
#   • docs/EMERGENCY.md   — emergency recovery guide
#   • docs/UPGRADE.md §3.1 — v1.1.0 → v1.2.0 upgrade path
#
# ============================================================
# How to verify the configuration
# ============================================================
#
# 1. On GitHub:
#    Settings → Code security and analysis
#    → Dependabot version updates: Enabled ✅
#
# 2. In the Dependabot tab:
#    Insights → Dependency graph → Dependabot
#    Shows:
#      • last scan
#      • discovered dependencies
#      • open PRs
#
# 3. Manual trigger:
#    Actions → Dependabot Updates → "Check for updates"
#    (available after the first scheduled run)
#
# 4. Validate the file locally:
#    python3 -c "import yaml; yaml.safe_load(open('.github/dependabot.yml'))"
#    → must complete without errors
#
# ============================================================