#      Dependabot via `go.mod`, and `go.sum` is regenerated by
#      `go mod tidy`. The explicit mention prevents a future
#      reader from expecting Dependabot to touch `go.sum`.
#
#   🆕 DB-V15-03 — ADR-0002 compliance note added to the
#      "target-branch decision" section and to the gomod
#      section. Every new external Go dependency requires its
#      own ADR before the corresponding Dependabot PR can be
#      merged.
#
#   🆕 DB-V15-04 — Cross-references extended with ADR-0002.
#      The "How Dependabot interacts with the release process"
#      section now also mentions ADR-0002 as the authoritative
#      source for the external-dependency policy.
#
#   ⚠️ No YAML body changes were necessary for v1.5.0 — the
#      three ecosystem entries, the schedules, the grouping
