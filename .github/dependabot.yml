# v1.5.0 — Global Edition
# ============================================================
#   🆕 DB-V15-01 — **Correction of a stale claim.** The
#      "Current state" comments under the gomod section
#      previously stated that `go.mod` contained "no external
#      dependencies" and that `go.sum` was "absent". Both
#      claims were accurate for v1.0.0 through v1.3.0, but
#      became FALSE in v1.4.1 (interim, unreleased, go.mod-only)
#      and have been false ever since.
#
#      Actual current state (v1.5.0):
#        • go.mod contains one external dependency:
#            require github.com/cyphar/filepath-securejoin v0.7.0
#        • go.sum is present and pins:
#            – filepath-securejoin v0.7.0
#            – 4 test-only transitive dependencies
#              (testify, go-spew, go-difflib, yaml.v3)
#
#      See ADR-0002 for the rationale and the compliance rule
#      that governs future additions.
#
#   🆕 DB-V15-02 — Added `go.sum` to the "What Dependabot does
#      NOT track" section. `go.sum` is a checksum manifest, not
