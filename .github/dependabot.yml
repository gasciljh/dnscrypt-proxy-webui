# ============================================================
# DNSCrypt Smart Filter – Dependabot Configuration
# Version: v1.2.0 (Global Edition)
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Reference:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Purpose:
#   Automatically updates dependencies and opens PRs for upgrades.
#
# Benefits:
#   • Immediate security updates (CVEs in GitHub Actions)
#   • Periodic updates (weekly for Actions, monthly for Go)
#   • Automatic PRs with changelog + release notes
#   • Fully customizable
#
# Important:
#   Dependabot works for free only on public repositories.
#   For private repositories: GitHub Advanced Security is required.
#
# Ecosystem coverage:
#   ┌───────────────┬──────────────┬───────────────────┐
#   │ Ecosystem        │ Directory      │ Schedule             │
#   ├───────────────┼──────────────┼───────────────────┤
#   │ github-actions   │ /              │ weekly Mon 06:00 UTC │
#   │ gomod            │ /proxy         │ monthly Mon 06:00    │
#   │ devcontainers    │ /              │ monthly Mon 06:00    │
#   └───────────────┴──────────────┴───────────────────┘
#
# Schedule rationale:
#   • github-actions → weekly. Actions are frequently updated for
#     security reasons (e.g. actions/checkout deprecates old Node
#     runtimes). Weekly keeps the repository current without
#     excessive noise.
#
#   • gomod → monthly. Go rarely needs updates — the project uses
#     only the standard library, so go.mod has no dependencies.
#     This section is forward-looking: if a package is added in
#     the future (e.g. golang.org/x/sys), Dependabot will handle
#     it automatically.
#
#   • devcontainers → monthly. Dev container features change
#     infrequently. Monthly is more than enough.
#
#   Why not daily?
#     • Too much review noise.
#     • ~90% of updates are not urgent.
#     • Weekly / monthly is the right balance for a solo
#       maintainer with a small codebase.
#
# Grouped updates:
#   Each ecosystem groups its minor/patch updates into a single
#   PR. Example: instead of 5 separate PRs (one per Action), you
#   get one PR titled "Bump 5 github-actions dependencies".
#
#   Benefits:
#     • Less review noise.
#     • Faster merge cycle.
#     • Easier to track in the PR list.
#
#   Caveat: if one update in the group has a problem, it must be
#   isolated manually (edit the PR or revert the group and re-run).
#
# open-pull-requests-limit:
#   • Actions: 5 PRs max
#   • Go: 3 PRs
#   • Devcontainers: 2 PRs
#
#   When the limit is reached, Dependabot stops opening new PRs
#   until some are merged or closed. This prevents the PR list
#   from being flooded during a burst of updates.
#
# target-branch decision:
#   All three ecosystems target `main` directly (not `develop`).
#
#   Rationale:
#     • The project is maintained by a single author.
#     • Small codebase — no need for a development branch for
#       dependency updates.
#     • Dependency PRs are small and low-risk; they can go
#       straight to the stable branch.
#
#   ⚠️ Policy note: this is an EXPLICIT EXCEPTION to the general
#      rule in README.md §Development ("Never commit to `main`
#      directly — open a PR against `develop`"). The exception
#      is scoped to automation only — human contributors must
#      still open PRs against `develop`.
#
#      If the README is updated in a future release, its
#      "Branching" paragraph should mention this exception
#      explicitly, so that a reader does not see a contradiction
#      between the two files.
#
#   This is also consistent with the branch model in
#   docs/adr/0001-two-branch-model.md, which allows
#   non-feature PRs (like dependency bumps) to target `main`.
#
# ⚠️ If the project grows to multiple maintainers or the
#    codebase expands significantly, consider switching the
#    target-branch to `develop` for consistency with the
#    feature/fix workflow.
#
# Labels applied to each PR:
#   • "dependencies"  — always
#   • Ecosystem label — "github-actions" / "go" / "devcontainer"
#   • "ci"            — Actions only (since they affect CI)
#
# Commit message prefixes:
#   • ci(scope)    — for Actions
#   • build(scope) — for Go modules
#   • chore(scope) — for dev containers
#
#   This aligns with Conventional Commits and keeps the commit
#   log scannable.
#
# ============================================================
