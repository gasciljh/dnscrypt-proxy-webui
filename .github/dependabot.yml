# ============================================================
# DNSCrypt Smart Filter — Dependabot Configuration
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-18
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Reference:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Purpose:
#   Automatically updates dependencies and opens PRs for upgrades.
#
# Benefits:
#   • Immediate security updates (CVEs in GitHub Actions and
#     the single external Go dependency)
#   • Periodic updates (weekly for Actions, monthly for Go)
#   • Automatic PRs with changelog + release notes
#   • Fully customizable
#
# Important:
#   Dependabot works for free only on public repositories.
#   For private repositories: GitHub Advanced Security is required.
#
# ============================================================
# Ecosystem coverage:
# ============================================================
#   ┌──────────────────┬──────────────┬──────────────────────┐
#   │ Ecosystem        │ Directory    │ Schedule             │
#   ├──────────────────┼──────────────┼──────────────────────┤
#   │ github-actions   │ /            │ weekly  Mon 06:00 UTC│
#   │ gomod            │ /proxy       │ monthly Mon 06:00    │
#   │ devcontainers    │ /            │ monthly Mon 06:00    │
#   └──────────────────┴──────────────┴──────────────────────┘
#
# ============================================================
# Schedule rationale:
# ============================================================
#   • github-actions → weekly. Actions are frequently updated
#     for security reasons (e.g. actions/checkout deprecates
#     old Node runtimes). Weekly keeps the repository current
#     without excessive noise.
#
#   • gomod → monthly. The project has exactly ONE external Go
#     dependency since v1.4.1 (stable since v1.5.0):
#       github.com/cyphar/filepath-securejoin v0.7.0
#     Pinned per ADR-0002. Monthly is more than sufficient.
#     If the pin is ever bumped, Dependabot opens a PR; the
#     maintainer must review it before merging (upgrades to
#     the dependency require re-reading the upstream changelog
#     and, per ADR-0002, may need a new ADR if the version
#     jump is significant).
#
#   • devcontainers → monthly. Dev container features change
#     infrequently.
#
#   Why not daily?
#     • Too much review noise.
#     • ~90% of updates are not urgent.
#     • Weekly / monthly is the right balance for a solo
#       maintainer with a small codebase.
#
# ============================================================
# Grouped updates:
# ============================================================
#   Each ecosystem groups its minor/patch updates into a single
#   PR. Example: instead of 5 separate PRs (one per Action),
#   you get one PR titled "Bump 5 github-actions dependencies".
#
#   Benefits:
#     • Less review noise.
#     • Faster merge cycle.
#     • Easier to track in the PR list.
#
#   Caveat: if one update in the group has a problem, it must
#   be isolated manually.
#
# ============================================================
# open-pull-requests-limit:
# ============================================================
#   • Actions: 5 PRs max
#   • Go: 3 PRs
#   • Devcontainers: 2 PRs
#
#   When the limit is reached, Dependabot stops opening new
#   PRs until some are merged or closed.
#
# ============================================================
# target-branch decision:
# ============================================================
#   All three ecosystems target `main` directly (not `develop`).
#
#   Rationale:
#     • The project is maintained by a single author.
#     • Small codebase — no need for a development branch for
#       dependency updates.
#     • Dependency PRs are small and low-risk; they can go
#       straight to the stable branch.
#
#   ⚠️ Policy note: this is an EXPLICIT EXCEPTION to the
#      general rule in README.md §Development ("Never commit
#      to `main` directly — open a PR against `develop`"). The
#      exception is scoped to automation only — human
#      contributors must still open PRs against `develop`.
#
#   This is also consistent with the branch model in
#   docs/adr/0001-release-workflow.md, which allows
#   non-feature PRs (like dependency bumps) to target `main`.
#
#   ⚠️ ADR-0002 compliance: any *new* external Go dependency
#      requires its own ADR before a Dependabot PR that adds
#      it can be merged. A bump of an existing dependency
#      (e.g. filepath-securejoin v0.7.0 → v0.8.0) does not
#      require an ADR, but does require reading the upstream
#      changelog.
#
# ============================================================
# Labels applied to each PR:
# ============================================================
#   • "dependencies"  — always
#   • Ecosystem label — "github-actions" / "go" / "devcontainer"
#   • "ci"            — Actions only (since they affect CI)
#
# ============================================================
# Commit message prefixes:
# ============================================================
#   • ci(scope)    — for Actions
#   • build(scope) — for Go modules
#   • chore(scope) — for dev containers
#
#   This aligns with Conventional Commits.
#
# ============================================================
