# ============================================================
# DNSCrypt Smart Filter – CI Workflow
# Version: v1.6.0 (Global Edition)
# Last updated: 2026-11-13
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Continuous Integration — builds the WebUI binaries for all
# 4 supported architectures on every push/PR to main or
# develop, and validates shell integration across 11 steps.
#
# Jobs:
#   1. build              — 4-arch build matrix
#   2. backup-smoke-test  — 11 validation steps
#
# Branch strategy:
#   • main    → stable releases (protected)
#   • develop → integration branch
#
# Paths ignored (push only): Markdown + docs. PRs always run.
#
# Module layout (v1.6.0):
#   • 10 root shell scripts + 6 lib/*.sh (Layer 0)
#   • proxy/ contains Go + configs only
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  NDK_VERSION: 'r26b'

jobs:
  # ============================================================
  # [1] Build matrix — 4 architectures
  # ============================================================
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, amd64, 386]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          PROJECT_URL: https://github.com/${{ github.repository }}
        run: |
          chmod +x proxy/build.sh
          cd proxy && ./build.sh --single ${{ matrix.arch }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: webui-${{ matrix.arch }}
          path: proxy/build/dnscrypt-webui-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  # ============================================================
  # [2] Backup smoke test — 11 validation steps
  # ============================================================
  backup-smoke-test:
    name: Backup Smoke Test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Step 1 — Shell syntax check (bash -n on 16 scripts)
      # ----------------------------------------------------------
      - name: Shell syntax check (bash -n)
        run: |
          set -euo pipefail
          echo "::group::bash -n on all module scripts (10 root + 6 lib = 16)"

          EXPECTED_SHEBANG='#!/system/bin/sh'

          ROOT_SCRIPTS="boot-mini.sh customize.sh functions.sh service.sh \
                        status.sh uninstall.sh action.sh post-fs-data.sh \
                        watchdog.sh install_app.sh"
          LIB_SCRIPTS="lib/constants.sh lib/fallbacks.sh lib/process.sh \
                       lib/http.sh lib/backup.sh lib/firewall.sh"

          for f in $ROOT_SCRIPTS $LIB_SCRIPTS; do

            if [ ! -s "$f" ]; then
              echo "::error::missing or empty: $f"
              exit 1
            fi

            if ! bash -n "$f"; then
              echo "::error::syntax error in $f"
              exit 1
            fi
            echo "  ✓ syntax OK: $f"

            SB="$(head -n1 "$f" || true)"
            case "$SB" in
              "$EXPECTED_SHEBANG") : ;;
              '') : ;;
              *)
                echo "::error::unexpected shebang in $f"
                echo "::error::  expected (exact): $EXPECTED_SHEBANG"
                echo "::error::  found:            $SB"
                exit 1
                ;;
            esac
          done

          echo "::endgroup::"
          echo "✅ All 16 shell scripts pass bash -n and shebang check"

      # ----------------------------------------------------------
      # Step 2 — Verify Layer 1-10 function presence
      # ----------------------------------------------------------
      - name: Verify Layer 1-10 function presence
        run: |
          set -euo pipefail
          echo "::group::Verifying v1.2.0 data-preservation layers"

          _check_required() {
            local file="$1" pattern="$2" label="$3"
            if [ ! -f "$file" ]; then
              echo "::error::$label — file missing: $file"
              exit 1
            fi
            if ! grep -q "$pattern" "$file"; then
              echo "::error::$label — pattern not found: '$pattern' in $file"
              exit 1
            fi
            echo "  ✅ $label"
          }

          # Layers 1-8: customize.sh (root)
          _check_required customize.sh 'CANDIDATE_SOURCES'    'Layer 1: multi-source detection'
          _check_required customize.sh 'PERSISTENT_BACKUP'    'Layer 2: persistent backup path'
          _check_required customize.sh 'verify_backup_integrity' 'Layer 3: integrity verification'
          _check_required customize.sh 'transaction_begin'    'Layer 4: transaction begin'
          _check_required customize.sh 'transaction_rollback' 'Layer 4: transaction rollback'
          _check_required customize.sh 'transaction_commit'   'Layer 4: transaction commit'
          _check_required customize.sh 'ROOT_SOLUTION'        'Layer 5: root-solution detection'
          _check_required customize.sh 'copy_with_context'    'Layer 6: SELinux context preservation'
          _check_required customize.sh 'recovery'             'Layer 7: recovery mode trigger'
          _check_required customize.sh 'v1.2.0 addition'      'Layer 8: config migrations'

          # Layer 9: functions.sh + service.sh + lib/backup.sh
          _check_required lib/backup.sh   'auto_backup_if_needed' 'Layer 9: auto-backup helper (lib/backup.sh)'
          _check_required lib/backup.sh   'rotate_backups'        'Layer 9: backup rotation (lib/backup.sh)'
          _check_required lib/backup.sh   'backup_user_files'     'Layer 9: backup_user_files helper'
          _check_required lib/backup.sh   'restore_user_files'    'Layer 9: restore_user_files helper'
          _check_required service.sh      'auto_backup_if_needed' 'Layer 9: service.sh calls auto-backup'

          # Layer 10: status.sh
          _check_required status.sh 'diagnose' 'Layer 10: diagnose mode in status.sh'
          _check_required status.sh 'backups'  'Layer 10: backups in status.sh JSON'

          # main.go additions
          _check_required proxy/main.go 'createAutoBackup'          'main.go: createAutoBackup'
          _check_required proxy/main.go 'checkPendingNotifications' 'main.go: checkPendingNotifications'
          _check_required proxy/main.go 'cleanupOldTransactions'    'main.go: cleanupOldTransactions'
          _check_required proxy/main.go 'buildBackupInfo'           'main.go: buildBackupInfo'
          _check_required proxy/main.go 'buildRuntimeInfo'          'main.go: buildRuntimeInfo'

          echo "::endgroup::"
          echo "✅ All v1.2.0 layer functions present"

      # ----------------------------------------------------------
      # Step 3 — Verify PERSISTENT_BACKUP path consistency
      # ----------------------------------------------------------
      # Two-tier check:
      #   1. SSOT files (lib/constants.sh + proxy/main.go) MUST
      #      contain the literal path.
      #   2. Downstream files MUST reference $PERSISTENT_BACKUP
      #      (the variable), inheriting the canonical value.
      #
      # This matches the v1.6.0 Layered Bootstrap design:
      # lib/constants.sh is the single source of truth; all
      # other files reference the variable.
      # ----------------------------------------------------------
      - name: Verify PERSISTENT_BACKUP path consistency
        run: |
          set -euo pipefail
          echo "::group::Verifying PERSISTENT_BACKUP path"

          EXPECTED="/sdcard/dnscrypt-webui-backup"

          # --- 1. SSOT files: literal path required ---
          echo ""
          echo "  Checking canonical definitions (literal path)..."
          for f in lib/constants.sh proxy/main.go; do
            if [ ! -s "$f" ]; then
              echo "::error::file missing or empty: $f"
              exit 1
            fi
            if grep -q "$EXPECTED" "$f"; then
              echo "    ✅ $f defines $EXPECTED"
            else
              echo "::error::$f does not contain '$EXPECTED'"
              exit 1
            fi
          done

          # --- 2. Downstream files: variable OR delegation required ---
          #
          # v1.6.0 (ADR-0003): backup logic moved from functions.sh (Layer 2)
          # to lib/backup.sh (Layer 0). functions.sh no longer performs any
          # backup operation — it is intentionally removed from this list.
          #
          # service.sh calls auto_backup_if_needed (delegation) without
          # touching $PERSISTENT_BACKUP directly — accept EITHER form.
          echo ""
          echo "  Checking downstream references (variable or delegation)..."
          for f in \
            lib/backup.sh \
            customize.sh \
            service.sh \
            status.sh \
            uninstall.sh; do

            if [ ! -s "$f" ]; then
              echo "::error::file missing or empty: $f"
              exit 1
            fi

            if grep -qE '\$\{?PERSISTENT_BACKUP' "$f"; then
              echo "    ✅ $f references \$PERSISTENT_BACKUP"
            elif grep -qE 'auto_backup_if_needed|restore_user_files|backup_create|rotate_backups|list_snapshots|count_snapshots' "$f"; then
              echo "    🔗 $f delegates to lib/backup.sh (v1.6.0)"
            else
              echo "::error::$f references neither \$PERSISTENT_BACKUP nor lib/backup.sh functions"
              exit 1
            fi
          done

          echo "::endgroup::"
          echo "✅ PERSISTENT_BACKUP path consistent (SSOT + 6 downstream)"

      # ----------------------------------------------------------
      # Step 4 — Verify consolidated documentation referenced
      # ----------------------------------------------------------
      - name: Verify consolidated docs referenced
        run: |
          set -euo pipefail
          echo "::group::Verifying consolidated documentation references"

          for f in docs/REFERENCE.md docs/GUIDE.md docs/CONTRIBUTING.md docs/MAP.md; do
            if [ ! -f "$f" ]; then
              echo "::error::$f missing"
              exit 1
            fi
            echo "  ✅ $f present"
          done

          if ! grep -q 'REFERENCE\.md' customize.sh; then
            echo "::error::customize.sh does not reference REFERENCE.md"
            exit 1
          fi
          echo "  ✅ customize.sh → REFERENCE.md"

          if ! grep -q 'GUIDE\.md' customize.sh; then
            echo "::error::customize.sh does not reference GUIDE.md"
            exit 1
          fi
          echo "  ✅ customize.sh → GUIDE.md"

          echo "::endgroup::"
          echo "✅ Consolidated documentation references verified"

      # ----------------------------------------------------------
      # Step 5 — Verify web asset files exist and have sane sizes
      # ----------------------------------------------------------
      - name: Verify web asset files exist and have sane sizes
        run: |
          set -euo pipefail
          echo "::group::Verifying web assets referenced by main.go"

          _require_min_size() {
            local path="$1" min="$2" label="$3"

            if [ ! -e "$path" ]; then
              echo "::error::${label}: missing — $path"
              exit 1
            fi

            local size
            size=$(stat -c%s "$path" 2>/dev/null || echo 0)

            if [ "$size" -eq 0 ]; then
              echo "::error::${label}: empty (0 bytes) — $path"
              exit 1
            fi

            if [ "$size" -lt "$min" ]; then
              echo "::error::${label}: suspiciously small (${size} < ${min} bytes) — $path"
              exit 1
            fi

            echo "  ✅ ${label} (${size} bytes)"
          }

          _require_min_size "web/index.html"      10240 "index.html"
          _require_min_size "web/dashboard.html"  10240 "dashboard.html"
          _require_min_size "web/manifest.json"     200 "manifest.json"
          _require_min_size "web/sw.js"            2048 "sw.js"
          _require_min_size "web/offline.html"     2048 "offline.html"
          _require_min_size "web/icon-192.svg"      500 "icon-192.svg"
          _require_min_size "web/icon-512.svg"      500 "icon-512.svg"
          _require_min_size "web/icon-192.png"      500 "icon-192.png"
          _require_min_size "web/icon-512.png"     1024 "icon-512.png"
          _require_min_size "web/apple-touch-icon.png" 500 "apple-touch-icon.png"
          _require_min_size "web/favicon-32x32.png" 200 "favicon-32x32.png"
          _require_min_size "web/favicon-16x16.png" 100 "favicon-16x16.png"
          _require_min_size "web/favicon.ico"       500 "favicon.ico"

          echo "::endgroup::"
          echo "✅ All web assets present and satisfy minimum size requirements"

      # ----------------------------------------------------------
      # Step 6 — Verify version consistency (10 checks)
      # ----------------------------------------------------------
      - name: Verify version consistency
        run: |
          set -euo pipefail
          echo "::group::Verifying version consistency"

          if [ ! -s VERSION ]; then
            echo "  ❌ VERSION file is missing or empty"
            exit 1
          fi
          V="$(tr -d '\r\n' < VERSION | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "  VERSION file:                   $V"
          V_NO_V="${V#v}"

          # 1. module.prop
          MP_V="$(grep '^version=' module.prop | head -n1 | cut -d= -f2- | tr -d '\r ')"
          if [ "$MP_V" = "$V" ]; then
            echo "  ✅ module.prop version:          $MP_V"
          else
            echo "  ❌ module.prop version mismatch: $MP_V != $V"
            exit 1
          fi

          # 2. update.json
          UJ_V="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]*"' update.json \
                  | head -n1 | sed -E 's/.*"([^"]*)"$/\1/')"
          if [ "$UJ_V" = "$V" ]; then
            echo "  ✅ update.json version:          $UJ_V"
          else
            echo "  ❌ update.json version mismatch: $UJ_V != $V"
            exit 1
          fi

          # 3. web/manifest.json (no v prefix)
          MF_V="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]*"' web/manifest.json \
                  | head -n1 | sed -E 's/.*"([^"]*)"$/\1/')"
          if [ "$MF_V" = "$V_NO_V" ]; then
            echo "  ✅ web/manifest.json version:    $MF_V"
          else
            echo "  ❌ web/manifest.json mismatch:   $MF_V != $V_NO_V"
            exit 1
          fi

          # 4. web/sw.js CACHE_VERSION
          SW_V="$(grep -oE "CACHE_VERSION[[:space:]]*=[[:space:]]*['\"][^'\"]*['\"]" web/sw.js \
                  | head -n1 | sed -E "s/.*['\"]([^'\"]*)['\"]$/\1/")"
          if [ "$SW_V" = "$V" ]; then
            echo "  ✅ web/sw.js CACHE_VERSION:      $SW_V"
          else
            echo "  ❌ web/sw.js CACHE_VERSION:      $SW_V != $V"
            exit 1
          fi

          # 5. web/index.html
          IDX_V="$(grep -oE "var VERSION[[:space:]]*=[[:space:]]*'[^']*'" web/index.html \
                   | head -n1 | cut -d"'" -f2)"
          if [ "$IDX_V" = "$V" ]; then
            echo "  ✅ web/index.html VERSION:       $IDX_V"
          else
            echo "  ❌ web/index.html VERSION:       $IDX_V != $V"
            exit 1
          fi

          # 6. web/dashboard.html
          DB_V="$(grep -oE "var VERSION[[:space:]]*=[[:space:]]*'[^']*'" web/dashboard.html \
                  | head -n1 | cut -d"'" -f2)"
          if [ "$DB_V" = "$V" ]; then
            echo "  ✅ web/dashboard.html VERSION:   $DB_V"
          else
            echo "  ❌ web/dashboard.html VERSION:   $DB_V != $V"
            exit 1
          fi

          # 7. proxy/app-apk.version
          APK_V="$(tr -d '\r\n' < proxy/app-apk.version | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if printf '%s' "$APK_V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "  ✅ proxy/app-apk.version:        $APK_V"
          else
            echo "  ❌ proxy/app-apk.version format invalid: $APK_V"
            exit 1
          fi

          # 8. proxy/dnscrypt-proxy.version
          DNS_V="$(tr -d '\r\n' < proxy/dnscrypt-proxy.version | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if printf '%s' "$DNS_V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "  ✅ proxy/dnscrypt-proxy.version: $DNS_V"
          else
            echo "  ❌ proxy/dnscrypt-proxy.version format invalid: $DNS_V"
            exit 1
          fi

          # 9. proxy/go.mod (ADR-0002 pin)
          if grep -qE '^\s*require\s+github\.com/cyphar/filepath-securejoin\s+v[0-9]+\.[0-9]+\.[0-9]+' proxy/go.mod; then
            GO_DEP="$(grep -oE 'filepath-securejoin[[:space:]]+v[0-9]+\.[0-9]+\.[0-9]+' proxy/go.mod | head -n1)"
            echo "  ✅ proxy/go.mod pin (ADR-0002):  $GO_DEP"
          else
            echo "  ❌ proxy/go.mod: filepath-securejoin pin missing (ADR-0002)"
            exit 1
          fi

          if [ -s proxy/go.sum ]; then
            echo "  ✅ proxy/go.sum present"
          else
            echo "  ❌ proxy/go.sum missing"
            exit 1
          fi

          # 10. proxy/main.go BuildVersion
          MAIN_V="$(grep -E '^\s*BuildVersion\s*=' proxy/main.go \
                    | head -n1 \
                    | sed -E 's/.*=\s*"([^"]*)".*/\1/' \
                    | tr -d '\r\n ')"
          if [ "$MAIN_V" = "$V" ]; then
            echo "  ✅ proxy/main.go BuildVersion:   $MAIN_V"
          else
            echo "  ❌ proxy/main.go BuildVersion:   $MAIN_V != $V"
            exit 1
          fi

          echo "::endgroup::"
          echo "✅ Version consistency verified across 10 files"

      # ----------------------------------------------------------
      # Step 7 — Verify companion app metadata
      # ----------------------------------------------------------
      - name: Verify companion app metadata
        run: |
          set -euo pipefail
          echo "::group::Verifying companion app metadata"

          if [ ! -s proxy/app-apk.version ]; then
            echo "  ⚠️  proxy/app-apk.version missing (companion app optional)"
          else
            APP_V="$(tr -d '\r\n' < proxy/app-apk.version | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if printf '%s' "$APP_V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "  ✅ proxy/app-apk.version:        $APP_V"
            else
              echo "  ❌ proxy/app-apk.version format invalid"
              exit 1
            fi
          fi

          if [ -s scripts/fetch_app_apk.sh ]; then
            echo "  ✅ scripts/fetch_app_apk.sh present"
          else
            echo "  ⚠️  scripts/fetch_app_apk.sh missing (companion app optional)"
          fi

          echo "::endgroup::"
          echo "✅ Companion app metadata verified"

      # ----------------------------------------------------------
      # Step 8 — Verify companion install script (v1.5.0)
      # ----------------------------------------------------------
      - name: Verify companion install script
        run: |
          set -euo pipefail
          echo "::group::Verifying install_app.sh (root)"

          if [ ! -s install_app.sh ]; then
            echo "::error::install_app.sh missing or empty at repo root"
            exit 1
          fi

          if [ ! -x install_app.sh ]; then
            echo "::warning::install_app.sh is not executable — fixing"
            chmod +x install_app.sh
          fi

          LINES="$(wc -l < install_app.sh | tr -d ' ')"
          echo "  ✓ present: install_app.sh (${LINES} lines)"

          # --- Cascade markers (5 levels) ---
          echo ""
          echo "  Verifying cascade-level markers..."
          MARKERS=(
            "pm install -r --user 0|level 1"
            "pm install -r --user 0 -i com.android.shell|level 2"
            "pm install-create|level 3"
            "magisk su|level 4"
            "cmd package install|level 5"
          )
          MISSING=0
          for entry in "${MARKERS[@]}"; do
            pattern="${entry%%|*}"
            label="${entry##*|}"
            if grep -q "$pattern" install_app.sh; then
              echo "    ✓ ${label}: ${pattern}"
            else
              echo "    ❌ ${label} missing: ${pattern}"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} cascade-level marker(s) missing"
            exit 1
          fi

          # --- Cascade deadline ---
          echo ""
          if grep -q 'CASCADE_DEADLINE_SECONDS' install_app.sh; then
            echo "  ✓ cascade deadline: CASCADE_DEADLINE_SECONDS"
          else
            echo "::error::CASCADE_DEADLINE_SECONDS missing"
            exit 1
          fi

          # --- Play Protect trap ---
          if grep -q 'package_verifier_enable' install_app.sh; then
            echo "  ✓ Play Protect trap: package_verifier_enable"
          else
            echo "::error::package_verifier_enable missing"
            exit 1
          fi

          if grep -q '_VERIFIER_ORIG' install_app.sh; then
            echo "  ✓ Play Protect restore: _VERIFIER_ORIG"
          else
            echo "::error::_VERIFIER_ORIG missing"
            exit 1
          fi

          # --- SELinux staging path ---
          if grep -q '/data/local/tmp/dnscrypt-companion.apk' install_app.sh; then
            echo "  ✓ SELinux staging: /data/local/tmp/dnscrypt-companion.apk"
          else
            echo "::error::SELinux staging path missing"
            exit 1
          fi

          # --- SELinux posture ---
          if grep -v '^[[:space:]]*#' install_app.sh \
               | grep -qE 'setenforce[[:space:]]+0'; then
            echo "::error::'setenforce 0' found in executable code"
            exit 1
          fi
          echo "  ✓ SELinux posture: no active 'setenforce 0'"

          # --- Three-way trap split ---
          echo ""
          if grep -q "trap '_cleanup_app' EXIT" install_app.sh; then
            echo "  ✓ trap: EXIT"
          else
            echo "::error::EXIT trap missing"
            exit 1
          fi
          if grep -q "trap '_cleanup_app; exit 130' INT" install_app.sh; then
            echo "  ✓ trap: INT exits 130"
          else
            echo "::error::INT trap (exit 130) missing"
            exit 1
          fi
          if grep -q "trap '_cleanup_app; exit 143' TERM" install_app.sh; then
            echo "  ✓ trap: TERM exits 143"
          else
            echo "::error::TERM trap (exit 143) missing"
            exit 1
          fi
          if grep -q '_CLEANED_UP=1' install_app.sh; then
            echo "  ✓ trap: re-entry guard"
          else
            echo "::error::_CLEANED_UP re-entry guard missing"
            exit 1
          fi

          # --- CSH-22 integration ---
          echo ""
          echo "  Verifying CSH-22 integration..."

          if grep -q 'install_app.sh' customize.sh; then
            echo "    ✓ customize.sh references install_app.sh"
          else
            echo "::error::customize.sh does NOT reference install_app.sh"
            exit 1
          fi

          if grep -q 'INSTALL_SCRIPT_REL' proxy/main.go; then
            echo "    ✓ main.go declares INSTALL_SCRIPT_REL"
          else
            echo "::error::main.go does NOT declare INSTALL_SCRIPT_REL"
            exit 1
          fi

          echo "::endgroup::"
          echo "✅ Companion install script verified"

      # ----------------------------------------------------------
      # Step 9 — Verify Layered Bootstrap (v1.6.0 — 3-layer model)
      # ----------------------------------------------------------
      - name: Verify Layered Bootstrap (lib/ + boot-mini + functions)
        run: |
          set -euo pipefail
          echo "::group::Verifying Layered Bootstrap (3-layer model)"

          # --- 1. All 6 lib/*.sh modules present ---
          echo "  Checking lib/*.sh modules..."
          for M in constants fallbacks process http backup firewall; do
            if [ -s "lib/$M.sh" ]; then
              echo "    ✓ lib/$M.sh"
            else
              echo "::error::lib/$M.sh missing or empty"
              exit 1
            fi
          done

          # --- 2. boot-mini.sh present ---
          if [ ! -s boot-mini.sh ]; then
            echo "::error::boot-mini.sh missing or empty"
            exit 1
          fi
          echo "  ✓ boot-mini.sh present"

          # --- 3. boot-mini.sh sources lib/*.sh via _LIB_BASE ---
          if grep -q '_LIB_BASE' boot-mini.sh; then
            echo "  ✓ boot-mini.sh uses _LIB_BASE discovery pattern"
          else
            echo "::error::boot-mini.sh does not use _LIB_BASE"
            exit 1
          fi

          # --- 4. boot-mini.sh defines the 5 primitives ---
          for fn in log_msg get_run_dir read_conf is_port_open get_webui_port; do
            if grep -qE "^[[:space:]]*${fn}[[:space:]]*\(\)" boot-mini.sh; then
              echo "    ✓ primitive: $fn"
            else
              echo "::error::boot-mini.sh missing primitive: $fn"
              exit 1
            fi
          done

          # --- 5. functions.sh sources boot-mini.sh ---
          if grep -q 'boot-mini.sh' functions.sh; then
            echo "  ✓ functions.sh sources boot-mini.sh"
          else
            echo "::error::functions.sh does not source boot-mini.sh"
            exit 1
          fi

          # --- 6. functions.sh does not redefine Layer-0 primitives ---
          for fn in get_run_dir read_conf is_port_open get_webui_port; do
            if grep -qE "^${fn}[[:space:]]*\(\)" functions.sh; then
              echo "::error::functions.sh redefines Layer-0 primitive: $fn"
              exit 1
            fi
          done
          echo "  ✓ functions.sh does not redefine Layer-0 primitives"

          # --- 7. _MONITORING_UI_PORT canonical in lib/constants.sh ---
          if grep -qE '^_MONITORING_UI_PORT="8080"' lib/constants.sh; then
            echo "  ✓ _MONITORING_UI_PORT canonical in lib/constants.sh"
          else
            echo "::error::_MONITORING_UI_PORT canonical missing from lib/constants.sh"
            exit 1
          fi

          # --- 8. _MONITORING_UI_PORT fallback in boot-mini.sh §[4] ---
          if grep -qE '^_MONITORING_UI_PORT="\$\{_MONITORING_UI_PORT:-' boot-mini.sh; then
            echo "  ✓ _MONITORING_UI_PORT fallback in boot-mini.sh §[4]"
          else
            echo "::error::boot-mini.sh §[4] fallback not found"
            exit 1
          fi

          # --- 9. customize.sh does NOT set _MONITORING_UI_PORT directly ---
          if grep -qE '^_MONITORING_UI_PORT=' customize.sh; then
            echo "::error::customize.sh sets _MONITORING_UI_PORT directly (not allowed)"
            exit 1
          fi
          echo "  ✓ customize.sh does not set _MONITORING_UI_PORT directly"

          echo "::endgroup::"
          echo "✅ Layered Bootstrap verified (3-layer model)"

      # ----------------------------------------------------------
      # Step 10 — Verify reserved-port constant sync
      # ----------------------------------------------------------
      - name: Verify reserved-port constant sync
        run: |
          set -euo pipefail
          echo "::group::Verifying reserved-port constant sync"

          # --- 1. lib/constants.sh: canonical value ---
          CONST_VAL="$(grep '^_MONITORING_UI_PORT=' lib/constants.sh \
                       | head -n1 \
                       | sed -E 's/^_MONITORING_UI_PORT="([^"]*)"$/\1/' \
                       | tr -d '\r\n ')"
          if [ "$CONST_VAL" = "8080" ]; then
            echo "  ✓ lib/constants.sh: _MONITORING_UI_PORT=\"8080\""
          else
            echo "::error::lib/constants.sh defines '$CONST_VAL' (expected '8080')"
            exit 1
          fi

          # --- 2. boot-mini.sh §[4]: fallback pattern ---
          BOOT_LINE="$(grep '^_MONITORING_UI_PORT=' boot-mini.sh | head -n1 || true)"
          case "$BOOT_LINE" in
            '_MONITORING_UI_PORT="${_MONITORING_UI_PORT:-'*'}')
              echo "  ✓ boot-mini.sh §[4]: fallback pattern OK"
              ;;
            *)
              echo "::error::boot-mini.sh §[4] must use the fallback pattern"
              echo "::error::  got: $BOOT_LINE"
              exit 1
              ;;
          esac

          # --- 3. proxy/main.go: Go constant ---
          GO_VAL="$(grep -E '^\s*MONITORING_UI_PORT\s*=' proxy/main.go \
                    | head -n1 \
                    | sed -E 's/.*=\s*"([^"]*)".*/\1/' \
                    | tr -d '\r\n ')"
          if [ "$GO_VAL" = "8080" ]; then
            echo "  ✓ proxy/main.go: MONITORING_UI_PORT = \"8080\""
          else
            echo "::error::proxy/main.go defines '$GO_VAL' (expected '8080')"
            exit 1
          fi

          # --- 4. No other shell script may set the constant ---
          echo ""
          echo "  Checking other shell scripts for hardcoded literals..."

          for f in \
            customize.sh functions.sh service.sh action.sh \
            status.sh uninstall.sh post-fs-data.sh \
            watchdog.sh install_app.sh; do

            [ -f "$f" ] || continue

            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                '_MONITORING_UI_PORT=""')
                  echo "    ✓ $f — empty (finalized via boot-mini)"
                  ;;
                *)
                  echo "::error::$f has an unsafe _MONITORING_UI_PORT definition:"
                  echo "::error::  $line"
                  exit 1
                  ;;
              esac
            done < <(grep -E '^_MONITORING_UI_PORT=' "$f" 2>/dev/null || true)
          done

          echo "::endgroup::"
          echo "✅ Reserved-port constant sync verified"

      # ----------------------------------------------------------
      # Step 11 — v1.6.0 additions (timezone + mtime sort + Makefile)
      # ----------------------------------------------------------
      - name: Verify v1.6.0 additions (timezone + mtime sort + consistency)
        run: |
          set -euo pipefail
          echo "::group::Verifying v1.6.0 additions"

          # --- 1. Timezone: backend field present ---
          if awk '/func buildProfileResponse/,/^}/' proxy/main.go \
               | grep -q 'last_update_unix'; then
            echo "  ✅ backend: buildProfileResponse → last_update_unix"
          else
            echo "::error::buildProfileResponse does not emit last_update_unix"
            exit 1
          fi

          if grep -q 'lastUpdateUnixCache' proxy/main.go; then
            echo "  ✅ backend: lastUpdateUnixCache field"
          else
            echo "::error::lastUpdateUnixCache missing"
            exit 1
          fi

          # --- 2. Timezone: frontend helper present ---
          if grep -q 'formatUnixTimestamp' web/index.html; then
            echo "  ✅ frontend: formatUnixTimestamp() defined"
          else
            echo "::error::formatUnixTimestamp() missing from web/index.html"
            exit 1
          fi

          if awk '/function renderProfileData/,/^}/' web/index.html \
               | grep -q 'last_update_unix'; then
            echo "  ✅ frontend: renderProfileData prefers last_update_unix"
          else
            echo "::error::renderProfileData does not use last_update_unix"
            exit 1
          fi

          # --- 3. buildBackupInfo sorts by ModTime (v1.6.0 fix) ---
          if awk '/func buildBackupInfo/,/^}/' proxy/main.go \
               | grep -q 'ModTime().Before'; then
            echo "  ✅ buildBackupInfo sorts by mtime (aligned with rotate_backups)"
          else
            echo "::error::buildBackupInfo does not sort by ModTime — SNAP-MTIME violated"
            exit 1
          fi

          # --- 4. Makefile target: check-consistency ---
          if [ -f Makefile ] && grep -qE '^check-consistency' Makefile; then
            echo "  ✅ Makefile: check-consistency target present"
          else
            echo "::warning::Makefile: check-consistency target missing (optional)"
          fi

          # --- 5. If check-consistency target exists, run it ---
          if make -n check-consistency >/dev/null 2>&1; then
            echo "  → Running make check-consistency..."
            if make check-consistency; then
              echo "  ✅ make check-consistency passed"
            else
              echo "::error::make check-consistency failed — documentation drift"
              exit 1
            fi
          else
            echo "  ⚠️  make check-consistency not runnable (target missing or not configured)"
          fi

          echo "::endgroup::"
          echo "✅ v1.6.0 additions verified"