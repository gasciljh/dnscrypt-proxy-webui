# ============================================================
# DNSCrypt Smart Filter – CI Workflow
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-15
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Continuous Integration — builds the WebUI binaries for all
# 4 supported architectures on every push/PR to main or
# develop, and validates the shell integration.
#
# Jobs:
#   1. build              — 4-arch build matrix
#   2. backup-smoke-test  — shell syntax + integration checks
#
# Branch strategy:
#   • main    → stable releases (protected)
#   • develop → integration branch (features merged here first)
#
# Paths ignored (push only):
#   • Markdown files (**/*.md)
#   • docs/** directory
#
#   Documentation-only changes should not consume CI minutes.
#   CodeQL runs on ALL changes (see codeql.yml), so docs PRs
#   still get a security review. PRs always run CI regardless
#   of paths — a PR can never merge without a green build.
#
#   .github/workflows/** is deliberately NOT in the ignore
#   list — a workflow change MUST be validated by running it.
#
# Concurrency:
#   One CI run per branch. A new push cancels the older run.
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  NDK_VERSION: 'r26b'

jobs:
  # ============================================================
  # [1] Build matrix — 4 architectures
  # ============================================================
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, amd64, 386]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          PROJECT_URL: https://github.com/${{ github.repository }}
        run: |
          chmod +x proxy/build.sh
          cd proxy && ./build.sh --single ${{ matrix.arch }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: webui-${{ matrix.arch }}
          path: proxy/build/dnscrypt-webui-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  # ============================================================
  # [2] Backup smoke test
  # ============================================================
  # Validates the shell scripts and the cross-file invariants
  # that are not exercised by the build matrix.
  #
  # Catches:
  #   • Shell syntax errors in module scripts
  #   • Lost shebangs
  #   • Missing function names that other scripts depend on
  #   • Missing constants
  #   • Inconsistent paths across scripts AND main.go
  #   • Version drift across 5 files
  #   • Companion install-script regressions
  #   • Layered Bootstrap drift (Phase 0)
  #   • Reserved-port constant drift (shell ↔ Go)
  #   • Truncated or placeholder web assets (Step 5)
  #
  # This is NOT a full data-preservation test — that runs on a
  # real device via .github/workflows/upgrade-test.yml.
  backup-smoke-test:
    name: Backup Smoke Test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # Step 1 — Shell syntax check (bash -n on 10 scripts)
      # ============================================================
      - name: Shell syntax check (bash -n)
        run: |
          set -euo pipefail
          echo "::group::bash -n on all module scripts (10)"

          EXPECTED_SHEBANG='#!/system/bin/sh'

          for f in \
            proxy/boot-mini.sh \
            proxy/customize.sh \
            proxy/functions.sh \
            proxy/service.sh \
            proxy/status.sh \
            proxy/uninstall.sh \
            proxy/action.sh \
            proxy/post-fs-data.sh \
            proxy/watchdog.sh \
            proxy/install_app.sh; do

            if [ ! -s "$f" ]; then
              echo "::error::missing or empty: $f"
              exit 1
            fi

            if ! bash -n "$f"; then
              echo "::error::syntax error in $f"
              exit 1
            fi
            echo "  ✓ syntax OK: $f"

            SB="$(head -n1 "$f" || true)"
            case "$SB" in
              "$EXPECTED_SHEBANG"*) : ;;
              '') : ;;
              *)
                echo "::error::unexpected shebang in $f"
                echo "::error::  expected: $EXPECTED_SHEBANG"
                echo "::error::  found:    $SB"
                exit 1
                ;;
            esac
          done

          echo "::endgroup::"
          echo "✅ All 10 shell scripts pass bash -n and shebang check"

      # ============================================================
      # Step 2 — Verify Layer 1-10 function presence
      # ============================================================
      # Each check is a hard failure. The pre-fix revision used
      # `grep -q PATTERN file && echo "✅"`, which is silently
      # exempt from `set -e` (Bash exempts any command that
      # precedes the last `&&`/`||` in an AND-OR list). The step
      # exited 0 even when every required function was missing.
      #
      # The helper below converts each check into an unconditional
      # assertion: file missing or pattern absent → exit 1.
      - name: Verify Layer 1-10 function presence
        run: |
          set -euo pipefail
          echo "::group::Verifying v1.2.0 data-preservation layers"

          _check_required() {
            local file="$1" pattern="$2" label="$3"
            if [ ! -f "$file" ]; then
              echo "::error::$label — file missing: $file"
              exit 1
            fi
            if ! grep -q "$pattern" "$file"; then
              echo "::error::$label — pattern not found: '$pattern' in $file"
              exit 1
            fi
            echo "  ✅ $label"
          }

          # Layers 1-8: customize.sh
          _check_required proxy/customize.sh 'CANDIDATE_SOURCES'    'Layer 1: multi-source detection'
          _check_required proxy/customize.sh 'PERSISTENT_BACKUP'    'Layer 2: persistent backup path'
          _check_required proxy/customize.sh 'verify_backup_integrity' 'Layer 3: integrity verification'
          _check_required proxy/customize.sh 'begin_transaction'    'Layer 4: transaction begin'
          _check_required proxy/customize.sh 'rollback_transaction' 'Layer 4: transaction rollback'
          _check_required proxy/customize.sh 'commit_transaction'   'Layer 4: transaction commit'
          _check_required proxy/customize.sh 'detect_root_solution' 'Layer 5: root-solution detection'
          _check_required proxy/customize.sh 'copy_with_context'    'Layer 6: SELinux context preservation'
          _check_required proxy/customize.sh 'recovery'             'Layer 7: recovery mode trigger'
          _check_required proxy/customize.sh 'migrate_config'       'Layer 8: config migrations'

          # Layer 9: functions.sh + service.sh
          _check_required proxy/functions.sh 'auto_backup_if_needed' 'Layer 9: auto-backup helper'
          _check_required proxy/functions.sh 'rotate_backups'        'Layer 9: backup rotation'
          _check_required proxy/functions.sh 'backup_user_files'     'Layer 9: backup_user_files helper'
          _check_required proxy/functions.sh 'restore_user_files'    'Layer 9: restore_user_files helper'
          _check_required proxy/service.sh   'auto_backup_if_needed' 'Layer 9: service.sh calls auto-backup'

          # Layer 10: status.sh
          _check_required proxy/status.sh 'diagnose' 'Layer 10: diagnose mode in status.sh'
          _check_required proxy/status.sh 'backups'  'Layer 10: backups in status.sh JSON'

          # main.go additions
          _check_required proxy/main.go 'createAutoBackup'          'main.go: createAutoBackup'
          _check_required proxy/main.go 'checkPendingNotifications' 'main.go: checkPendingNotifications'
          _check_required proxy/main.go 'cleanupOldTransactions'    'main.go: cleanupOldTransactions'
          _check_required proxy/main.go 'buildBackupInfo'           'main.go: buildBackupInfo'
          _check_required proxy/main.go 'buildRuntimeInfo'          'main.go: buildRuntimeInfo'

          echo "::endgroup::"
          echo "✅ All v1.2.0 layer functions present"

      # ============================================================
      # Step 3 — Verify PERSISTENT_BACKUP path consistency
      # ============================================================
      - name: Verify PERSISTENT_BACKUP path consistency
        run: |
          set -euo pipefail
          echo "::group::Verifying PERSISTENT_BACKUP path"

          EXPECTED="/sdcard/dnscrypt-webui-backup"

          for f in \
            proxy/customize.sh \
            proxy/functions.sh \
            proxy/service.sh \
            proxy/status.sh \
            proxy/uninstall.sh \
            proxy/main.go; do

            if [ ! -s "$f" ]; then
              echo "  ❌ file missing or empty: $f"
              exit 1
            fi

            if grep -q "$EXPECTED" "$f"; then
              echo "  ✅ $f references $EXPECTED"
            else
              echo "  ❌ $f does not contain '$EXPECTED'"
              exit 1
            fi
          done

          echo "::endgroup::"
          echo "✅ PERSISTENT_BACKUP path consistent"

      # ============================================================
      # Step 4 — Verify v1.2.0 documentation references
      # ============================================================
      # Converted from `test -f ... && echo "✅"` (silent under
      # `set -e`) to hard assertions.
      - name: Verify v1.2.0 docs referenced
        run: |
          set -euo pipefail
          echo "::group::Verifying v1.2.0 documentation references"

          if [ ! -f docs/BACKUP.md ]; then
            echo "::error::docs/BACKUP.md missing"
            exit 1
          fi
          echo "  ✅ docs/BACKUP.md present"

          if [ ! -f docs/EMERGENCY.md ]; then
            echo "::error::docs/EMERGENCY.md missing"
            exit 1
          fi
          echo "  ✅ docs/EMERGENCY.md present"

          if ! grep -q 'BACKUP.md' proxy/customize.sh; then
            echo "::error::customize.sh does not reference BACKUP.md"
            exit 1
          fi
          echo "  ✅ customize.sh → BACKUP.md"

          if ! grep -q 'EMERGENCY.md' proxy/customize.sh; then
            echo "::error::customize.sh does not reference EMERGENCY.md"
            exit 1
          fi
          echo "  ✅ customize.sh → EMERGENCY.md"

          echo "::endgroup::"
          echo "✅ v1.2.0 documentation references verified"

      # ============================================================
      # Step 5 — Verify web asset files exist and have sane sizes
      # ============================================================
      # A `-s` check (non-empty) alone is insufficient: a
      # truncated download, a placeholder stub, or an HTML error
      # page saved as a binary asset all satisfy "size > 0" but
      # break the module at runtime. This step therefore
      # enforces a per-file MINIMUM SIZE that any legitimate
      # asset is expected to exceed by a wide margin.
      #
      # The minimums below are deliberately conservative — they
      # only catch genuinely broken files. A legitimate asset is
      # normally 5–100× the minimum.
      #
      #   Asset                       Typical     Minimum
      #   --------------------------- ----------- ---------
      #   index.html                  ~160 KB     10 KB
      #   dashboard.html              ~86 KB      10 KB
      #   manifest.json               ~3 KB       200 B
      #   sw.js                       ~24 KB      2 KB
      #   offline.html                ~18 KB      2 KB
      #   icon-192.svg                ~9 KB       500 B
      #   icon-512.svg                ~9 KB       500 B
      #   icon-192.png                ~14 KB      500 B
      #   icon-512.png                ~78 KB      1 KB
      #   apple-touch-icon.png        ~18 KB      500 B
      #   favicon-32x32.png           ~1.4 KB     200 B
      #   favicon-16x16.png           ~553 B      100 B
      #   favicon.ico                 ~4.7 KB     500 B
      #
      # Files not listed in the table are still checked for
      # non-emptiness. Adding a new required web asset to
      # main.go means adding it to the MANIFEST below.
      - name: Verify web asset files exist and have sane sizes
        run: |
          set -euo pipefail
          echo "::group::Verifying web assets referenced by main.go"

          # _require_min_size <path> <min_bytes> <label>
          #
          # Fails with a distinct error for each of the three
          # possible states:
          #   • missing
          #   • empty (0 bytes)
          #   • present but smaller than the required minimum
          _require_min_size() {
            local path="$1" min="$2" label="$3"

            if [ ! -e "$path" ]; then
              echo "::error::${label}: missing — $path"
              exit 1
            fi

            local size
            size=$(stat -c%s "$path" 2>/dev/null || echo 0)

            if [ "$size" -eq 0 ]; then
              echo "::error::${label}: empty (0 bytes) — $path"
              exit 1
            fi

            if [ "$size" -lt "$min" ]; then
              echo "::error::${label}: suspiciously small (${size} < ${min} bytes) — $path"
              echo "::error::  A file this small is likely a truncated download, a"
              echo "::error::  placeholder stub, or an HTML error page saved as a"
              echo "::error::  binary asset. Re-run the corresponding tool:"
              echo "::error::    • HTML/JS/JSON — verify your checkout (git status web/)"
              echo "::error::    • PNG/ICO      — ./scripts/generate-icons.sh --force"
              exit 1
            fi

            echo "  ✅ ${label} (${size} bytes)"
          }

          # --- Primary HTML ---
          _require_min_size "web/index.html"      10240 "index.html"
          _require_min_size "web/dashboard.html"  10240 "dashboard.html"

          # --- PWA assets ---
          _require_min_size "web/manifest.json"     200 "manifest.json"
          _require_min_size "web/sw.js"            2048 "sw.js"
          _require_min_size "web/offline.html"     2048 "offline.html"

          # --- SVG icons ---
          _require_min_size "web/icon-192.svg"      500 "icon-192.svg"
          _require_min_size "web/icon-512.svg"      500 "icon-512.svg"

          # --- PNG icons ---
          _require_min_size "web/icon-192.png"      500 "icon-192.png"
          _require_min_size "web/icon-512.png"     1024 "icon-512.png"
          _require_min_size "web/apple-touch-icon.png" 500 "apple-touch-icon.png"

          # --- Favicons ---
          _require_min_size "web/favicon-32x32.png" 200 "favicon-32x32.png"
          _require_min_size "web/favicon-16x16.png" 100 "favicon-16x16.png"
          _require_min_size "web/favicon.ico"       500 "favicon.ico"

          echo "::endgroup::"
          echo "✅ All web assets present and satisfy minimum size requirements"

      # ============================================================
      # Step 6 — Verify version consistency (5 files)
      # ============================================================
      - name: Verify version consistency
        run: |
          set -euo pipefail
          echo "::group::Verifying version consistency"

          if [ ! -s VERSION ]; then
            echo "  ❌ VERSION file is missing or empty"
            exit 1
          fi
          V="$(tr -d '\r\n' < VERSION | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "  VERSION file:           $V"
          V_NO_V="${V#v}"

          if [ ! -s module.prop ]; then
            echo "  ❌ module.prop is missing or empty"
            exit 1
          fi
          MP_V="$(grep '^version=' module.prop | head -n1 | cut -d= -f2- | tr -d '\r ')"
          if [ "$MP_V" = "$V" ]; then
            echo "  ✅ module.prop version:          $MP_V"
          else
            echo "  ❌ module.prop version mismatch"
            echo "     expected: $V"
            echo "     found:    $MP_V"
            exit 1
          fi

          if [ ! -s update.json ]; then
            echo "  ❌ update.json is missing or empty"
            exit 1
          fi
          UJ_V="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]*"' update.json \
                  | head -n1 | sed -E 's/.*"([^"]*)"$/\1/')"
          if [ "$UJ_V" = "$V" ]; then
            echo "  ✅ update.json version:          $UJ_V"
          else
            echo "  ❌ update.json version mismatch"
            echo "     expected: $V"
            echo "     found:    $UJ_V"
            exit 1
          fi

          if [ ! -s web/manifest.json ]; then
            echo "  ❌ web/manifest.json is missing or empty"
            exit 1
          fi
          MF_V="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]*"' web/manifest.json \
                  | head -n1 | sed -E 's/.*"([^"]*)"$/\1/')"
          if [ "$MF_V" = "$V_NO_V" ]; then
            echo "  ✅ web/manifest.json version:    $MF_V"
          else
            echo "  ❌ web/manifest.json version mismatch"
            echo "     expected (no v): $V_NO_V"
            echo "     found:           $MF_V"
            exit 1
          fi

          if [ ! -s web/sw.js ]; then
            echo "  ❌ web/sw.js is missing or empty"
            exit 1
          fi
          SW_V="$(grep -oE "CACHE_VERSION[[:space:]]*=[[:space:]]*['\"][^'\"]*['\"]" web/sw.js \
                  | head -n1 \
                  | sed -E "s/.*['\"]([^'\"]*)['\"]$/\1/")"
          if [ -z "$SW_V" ]; then
            echo "  ❌ could not extract CACHE_VERSION from web/sw.js"
            exit 1
          fi
          if [ "$SW_V" = "$V" ]; then
            echo "  ✅ web/sw.js CACHE_VERSION:      $SW_V"
          else
            echo "  ❌ web/sw.js CACHE_VERSION mismatch"
            echo "     expected: $V"
            echo "     found:    $SW_V"
            exit 1
          fi

          echo "::endgroup::"
          echo "✅ Version consistency verified across 5 files"

      # ============================================================
      # Step 7 — Verify companion app metadata
      # ============================================================
      - name: Verify companion app metadata
        run: |
          set -euo pipefail
          echo "::group::Verifying companion app metadata"

          if [ ! -s proxy/app-apk.version ]; then
            echo "  ⚠️  proxy/app-apk.version missing (companion app optional)"
          else
            APP_V="$(tr -d '\r\n' < proxy/app-apk.version | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if printf '%s' "$APP_V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "  ✅ proxy/app-apk.version:        $APP_V (valid format)"
            else
              echo "  ❌ proxy/app-apk.version format invalid"
              echo "     expected: X.Y.Z (e.g. 1.0.0)"
              echo "     found:    $APP_V"
              exit 1
            fi
          fi

          if [ -s scripts/fetch_app_apk.sh ]; then
            echo "  ✅ scripts/fetch_app_apk.sh present"
          else
            echo "  ⚠️  scripts/fetch_app_apk.sh missing (companion app optional)"
          fi

          echo "::endgroup::"
          echo "✅ Companion app metadata verified"

      # ============================================================
      # Step 8 — Verify companion install script
      # ============================================================
      - name: Verify companion install script
        run: |
          set -euo pipefail
          echo "::group::Verifying proxy/install_app.sh"

          if [ ! -s proxy/install_app.sh ]; then
            echo "::error::proxy/install_app.sh missing or empty"
            exit 1
          fi

          if [ ! -x proxy/install_app.sh ]; then
            echo "::warning::proxy/install_app.sh is not executable — fixing"
            chmod +x proxy/install_app.sh
          fi

          LINES="$(wc -l < proxy/install_app.sh | tr -d ' ')"
          echo "  ✓ present: proxy/install_app.sh (${LINES} lines)"

          # ---- Cascade markers (5 levels) ----
          echo ""
          echo "  Verifying cascade-level markers..."
          MARKERS=(
            "pm install -r --user 0|level 1"
            "pm install -r -i com.android.shell|level 2"
            "pm install-create|level 3"
            "magisk su|level 4"
            "cmd package install|level 5"
          )
          MISSING=0
          for entry in "${MARKERS[@]}"; do
            pattern="${entry%%|*}"
            label="${entry##*|}"
            if grep -q "$pattern" proxy/install_app.sh; then
              echo "    ✓ ${label}: ${pattern}"
            else
              echo "    ❌ ${label} missing: ${pattern}"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} cascade-level marker(s) missing"
            exit 1
          fi

          # ---- Cascade deadline ----
          echo ""
          if grep -q 'CASCADE_DEADLINE_SECONDS' proxy/install_app.sh; then
            echo "  ✓ cascade deadline: CASCADE_DEADLINE_SECONDS"
          else
            echo "::error::CASCADE_DEADLINE_SECONDS missing"
            exit 1
          fi

          # ---- Play Protect trap ----
          if grep -q 'package_verifier_enable' proxy/install_app.sh; then
            echo "  ✓ Play Protect trap: package_verifier_enable"
          else
            echo "::error::package_verifier_enable missing"
            exit 1
          fi

          # ---- SELinux staging path ----
          if grep -q '/data/local/tmp/dnscrypt-companion.apk' proxy/install_app.sh; then
            echo "  ✓ SELinux staging: /data/local/tmp/dnscrypt-companion.apk"
          else
            echo "::error::SELinux staging path missing"
            exit 1
          fi

          # ---- SELinux posture ----
          if grep -v '^[[:space:]]*#' proxy/install_app.sh \
               | grep -qE 'setenforce[[:space:]]+0'; then
            echo "::error::'setenforce 0' found in executable code"
            exit 1
          fi
          echo "  ✓ SELinux posture: no active 'setenforce 0'"

          # ---- CSH-22 integration ----
          echo ""
          echo "  Verifying CSH-22 integration..."

          if grep -q 'install_app.sh' proxy/customize.sh; then
            echo "    ✓ customize.sh references install_app.sh"
          else
            echo "::error::customize.sh does NOT reference install_app.sh"
            exit 1
          fi

          if grep -q 'INSTALL_SCRIPT_REL' proxy/main.go; then
            echo "    ✓ main.go declares INSTALL_SCRIPT_REL"
          else
            echo "::error::main.go does NOT declare INSTALL_SCRIPT_REL"
            exit 1
          fi

          echo "::endgroup::"
          echo "✅ Companion install script verified"

      # ============================================================
      # Step 9 — Verify boot-mini.sh integration (Layered Bootstrap)
      # ============================================================
      # Layer 0 / Layer 1 split:
      #   • boot-mini.sh defines the 5 primitives.
      #   • boot-mini.sh is the single source of truth for
      #     _MONITORING_UI_PORT.
      #   • functions.sh sources boot-mini.sh.
      #   • functions.sh does NOT redefine the 5 primitives.
      #
      # log_msg is checked differently: functions.sh may keep a
      # deprecated `log_fn` alias, but must not reimplement
      # `log_msg` itself.
      - name: Verify boot-mini.sh integration
        run: |
          set -euo pipefail
          echo "::group::Verifying boot-mini.sh integration"

          # ---- Presence ----
          if [ ! -s proxy/boot-mini.sh ]; then
            echo "::error::proxy/boot-mini.sh missing or empty"
            exit 1
          fi
          echo "  ✓ present: proxy/boot-mini.sh"

          # ---- 5 primitives ----
          for fn in log_msg get_run_dir read_conf is_port_open get_webui_port; do
            if grep -qE "^${fn}\(\)" proxy/boot-mini.sh; then
              echo "  ✓ primitive: $fn"
            else
              echo "::error::boot-mini.sh missing primitive: $fn"
              exit 1
            fi
          done

          # ---- _MONITORING_UI_PORT defined here ----
          if grep -q '^_MONITORING_UI_PORT=' proxy/boot-mini.sh; then
            echo "  ✓ _MONITORING_UI_PORT defined in boot-mini.sh"
          else
            echo "::error::_MONITORING_UI_PORT not defined in boot-mini.sh"
            exit 1
          fi

          # ---- functions.sh sources boot-mini.sh ----
          if grep -q 'boot-mini.sh' proxy/functions.sh; then
            echo "  ✓ functions.sh sources boot-mini.sh"
          else
            echo "::error::functions.sh does not source boot-mini.sh"
            exit 1
          fi

          # ---- functions.sh must NOT redefine Layer-0 primitives ----
          # Exception: log_msg may be aliased as log_fn, but not
          # reimplemented. The other four must be absent entirely.
          for fn in get_run_dir read_conf is_port_open get_webui_port; do
            if grep -qE "^${fn}[[:space:]]*\(\)" proxy/functions.sh; then
              echo "::error::functions.sh redefines Layer-0 primitive: $fn"
              exit 1
            fi
          done
          echo "  ✓ functions.sh does not redefine Layer-0 primitives"

          # ---- _MONITORING_UI_PORT must not be redefined ----
          if grep -qE '^_MONITORING_UI_PORT=' proxy/functions.sh; then
            echo "::error::functions.sh redefines _MONITORING_UI_PORT"
            exit 1
          fi
          echo "  ✓ functions.sh does not redefine _MONITORING_UI_PORT"

          echo "::endgroup::"
          echo "✅ boot-mini.sh integration verified"

      # ============================================================
      # Step 10 — Verify reserved-port constant sync
      # ============================================================
      # The reserved port (8080) appears in two places:
      #   • boot-mini.sh — _MONITORING_UI_PORT="8080"
      #   • main.go      — MONITORING_UI_PORT = "8080"
      #
      # Other scripts that need the constant MUST either:
      #   • inherit it from boot-mini.sh (via functions.sh), OR
      #   • use the fallback pattern ${_MONITORING_UI_PORT:-...},
      #   • OR leave it empty and finalize after sourcing.
      #
      # Any hardcoded numeric literal in a shell script other
      # than boot-mini.sh is a drift and fails the build.
      #
      # The accepted-pattern case below uses a trailing `"` in
      # the match — the actual scripts end their fallback lines
      # with `}"`, not just `}`. The pre-fix revision omitted
      # the trailing quote and therefore failed on every
      # script that used the accepted pattern.
      - name: Verify reserved-port constant sync
        run: |
          set -euo pipefail
          echo "::group::Verifying reserved-port constant sync"

          BOOT_VAL="$(grep '^_MONITORING_UI_PORT=' proxy/boot-mini.sh \
                      | head -n1 \
                      | sed -E 's/^_MONITORING_UI_PORT="?([^"]*)"?$/\1/' \
                      | tr -d '\r\n ')"
          if [ "$BOOT_VAL" != "8080" ]; then
            echo "::error::boot-mini.sh defines _MONITORING_UI_PORT='$BOOT_VAL' (expected '8080')"
            exit 1
          fi
          echo "  ✓ boot-mini.sh: _MONITORING_UI_PORT=\"8080\""

          GO_VAL="$(grep -E '^\s*MONITORING_UI_PORT\s*=' proxy/main.go \
                    | head -n1 \
                    | sed -E 's/.*=\s*"([^"]*)".*/\1/' \
                    | tr -d '\r\n ')"
          if [ "$GO_VAL" != "8080" ]; then
            echo "::error::main.go defines MONITORING_UI_PORT='$GO_VAL' (expected '8080')"
            exit 1
          fi
          echo "  ✓ main.go:      MONITORING_UI_PORT = \"8080\""

          echo ""
          echo "  Checking other shell scripts for hardcoded literals..."

          for f in \
            proxy/customize.sh \
            proxy/functions.sh \
            proxy/service.sh \
            proxy/action.sh \
            proxy/status.sh \
            proxy/uninstall.sh \
            proxy/post-fs-data.sh \
            proxy/watchdog.sh \
            proxy/install_app.sh; do

            [ -f "$f" ] || continue

            # Any line of the form `_MONITORING_UI_PORT=<value>`
            # is checked. Accepted forms:
            #   _MONITORING_UI_PORT=""                          (empty)
            #   _MONITORING_UI_PORT="${_MONITORING_UI_PORT:-...}" (fallback)
            # Anything else (a hardcoded literal like "8080" or
            # any other number) is drift.
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                '_MONITORING_UI_PORT=""')
                  echo "    ✓ $f — empty definition (finalized later)"
                  ;;
                '_MONITORING_UI_PORT="${_MONITORING_UI_PORT:-'*'}"')
                  echo "    ✓ $f — fallback pattern"
                  ;;
                *)
                  echo "::error::$f has an unsafe _MONITORING_UI_PORT definition:"
                  echo "::error::  $line"
                  echo "::error::Accepted: empty or \${_MONITORING_UI_PORT:-...} fallback"
                  exit 1
                  ;;
              esac
            done < <(grep -E '^_MONITORING_UI_PORT=' "$f" 2>/dev/null || true)
          done

          echo "::endgroup::"
          echo "✅ Reserved-port constant sync verified (shell ↔ Go)"
