# ============================================================
# DNSCrypt Smart Filter – CodeQL Workflow
# Version: v1.0.0
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Purpose:
#   Static Application Security Testing (SAST) using GitHub CodeQL.
#   Runs on every push/PR to main or develop + weekly on Monday 06:00 UTC.
#
# Steps:
#   • Checkout source
#   • Setup Go 1.22
#   • Initialize CodeQL (security-extended queries)
#   • Build the Go binary
#   • Perform the analysis
#
# Branch strategy:
#   • main    → stable releases (protected)
#   • develop → integration branch (features merged here first)
#
# Query suite:
#   • security-extended — broader security coverage than the
#     default queries, catching additional CWEs and potential
#     vulnerabilities.
# ============================================================

name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended

      - name: Build
        run: |
          cd proxy
          [ -f go.mod ] || go mod init dnscrypt-webui
          go build -buildvcs=false -trimpath -o /tmp/analyze main.go

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"