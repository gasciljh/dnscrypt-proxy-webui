#     • PWA install button  → web/index.html (client-side JS/HTML)
#     • Live status LED     → web/index.html (client-side CSS/JS)
#     • DNS auto-start fix  → proxy/service.sh (shell)
#
#   The v1.3.0 release ALSO refined snapshot-detection and
#   rotation semantics shared by every consumer of the
#   persistent backup directory (SNAP-MANIFEST, SNAP-MTIME,
#   ROT-MANIFEST, ROT-MTIME, ROT-PROTECT). Those refinements
#   touched main.go, functions.sh, service.sh, watchdog.sh,
#   status.sh, customize.sh, action.sh, and uninstall.sh.
#
#   However, this workflow (codeql.yml) was NOT modified in
#   v1.3.0. Its query suite, trigger matrix, `category` field,
#   build step, and action versions are all unchanged from
#   v1.2.0. CodeQL automatically analyzed the updated main.go
#   (SNAP-MANIFEST + SNAP-MTIME) on the next scheduled or
#   push-triggered run; the workflow did not need to know about
#   the semantic change.
#
#   ⚠️ CodeQL DID report 6 of the 8 original alerts during the
#      v1.3.0 development cycle, but those alerts were closed
#      by fixes in the Go source (main.go and, transitively,
#      the modules the affected code touched) — not by a change
#      to this workflow file.
#
#   For the full v1.3.0 story, see CHANGELOG.md [v1.3.0] and
#   docs/ARCHITECTURE.md §4.13.
# ============================================================
# v1.4.0 — Companion Android app integration + CodeQL closure
# ============================================================
#   🎯 CQ-V14-01 — The last 2 outstanding CodeQL alerts
#     (`go/path-injection` in `removeModule`, alerts #1 and #2)
#     were CLOSED in v1.4.0. The fix is in
#     `proxy/main.go::removeModule`:
#
#       • The caller-provided path is sanitized via
#         `filepath.Base()` before any path construction.
#       • The final path is rebuilt from the trusted
#         `MODULES_DIR` constant + the sanitized basename.
#       • No user-controlled data reaches any path expression.
#       • A defence-in-depth prefix check is retained as a
#         second layer (but does NOT participate in path
#         construction).
#
#     ⚠️ The fix is in the GO SOURCE, not in this workflow.
#        This workflow continues to analyze `proxy/main.go`
#        with the same `security-extended` query suite. The
#        alerts are now closed because the code no longer
#        contains the pattern CodeQL was flagging.
#
#   🎯 CQ-V14-02 — No change to this workflow's structure:
#     • Same `security-extended` query suite.
#     • Same trigger matrix (push, PR, weekly, manual).
#     • Same `category: "/language:go"`.
#     • Same build step (`go build ./...`).
#     • Same `github/codeql-action@v3`.
#
#   🎯 CQ-V14-03 — The companion Android app APK
#     (`web/app-debug.apk`) is NOT analyzed by this workflow.
#     It is a pre-built binary fetched from a separate
#     repository (gasciljh/dnscrypt-proxy-app). CodeQL for Go
#     has nothing to analyze in an APK.
#
# ============================================================
# Repository hygiene (HARD-CQ-08):
# ============================================================
#   The `.codeql-analyze` binary is a build artifact and MUST
#   NOT be committed. Two conditions must hold:
#
#     1. The Build step below removes the file on any exit
#        (success, failure, interrupt) via a `trap` handler.
#        This is the primary protection.
#
#     2. `.gitignore` contains an entry for
#        `proxy/.codeql-analyze` (or a glob that covers it).
#        This is the belt-and-suspenders protection that keeps
#        the file out of `git status` if a developer runs the
#        build manually and the trap fails to fire.
#
#   ⚠️ As of this revision, the second condition is NOT verified
#      by any check in the repository. If you are reviewing this
#      workflow as part of a security audit, confirm that
#      `.gitignore` contains the entry. The original audit
#      (H-02) flagged this as an open item.
#
#      v1.4.0 status: the entry IS present in the current
#      `.gitignore` (both `/.codeql-analyze` and
#      `proxy/.codeql-analyze`). The HARD-CQ-08 note is
#      retained as a reminder for future contributors.
# ============================================================

name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # HARD-CQ-03: caching re-enabled.
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          config-file: ./.github/codeql/codeql-config.yml

      # HARD-CQ-02: fail loudly if proxy/go.mod is missing.
      # HARD-CQ-05: build the whole package, not just main.go.
      # HARD-CQ-06: set -euo pipefail for full safety.
      # HARD-CQ-07 (== CQ-1): trap ensures cleanup on any exit.
      - name: Build
        run: |
          set -euo pipefail
          cd proxy

          if [ ! -s go.mod ]; then
            echo "::error file=proxy/go.mod::proxy/go.mod is missing or empty"
            echo "::error::This workflow requires proxy/go.mod to exist."
            echo "::error::If it was intentionally removed, update this"
            echo "::error::workflow to reflect the new module layout."
            exit 1
          fi

          # Ensure the artifact is removed on any exit path.
          trap 'rm -f ./.codeql-analyze' EXIT

          # Build the whole proxy package. CodeQL observes the
          # compilation and extracts the AST; the binary itself
          # is not consumed by the analysis.
          go build -buildvcs=false -trimpath -o ./.codeql-analyze ./...

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"