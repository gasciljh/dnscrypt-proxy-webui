# ============================================================
# DNSCrypt Smart Filter – CodeQL Workflow
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-19
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Static Application Security Testing (SAST) using GitHub
# CodeQL.
#
# Runs on:
#   • Every push/PR to main or develop
#   • Weekly scheduled scan (Monday 06:00 UTC)
#   • Manual workflow_dispatch
#
# Query suite — security-extended:
#   Broader than the default. Includes core security queries
#   plus additional CWE coverage. Chosen because this project
#   is security-sensitive (root module, handles credentials,
#   modifies firewall).
#
#   The default suite would miss classes of issues this
#   project cares about; security-and-quality is noisier than
#   needed.
#
# CodeQL for Go — build requirement:
#   CodeQL analyzes Go by observing an actual build. The
#   "Build" step below calls `go build` on the proxy package.
#   Without it, CodeQL cannot extract the AST and fails with
#   "no code found" for the language.
#
#   The build uses CGO_ENABLED=0 (default when no CC is set)
#   because CodeQL runs on ubuntu-22.04 without the Android
#   NDK. The analysis cares about source semantics, not the
#   target architecture.
#
# What CodeQL does NOT cover:
#   • Shell scripts (proxy/*.sh, scripts/*.sh)
#       → covered by ci.yml (bash -n + integration checks)
#   • YAML workflows (.github/workflows/*.yml)
#       → syntax covered by `check-yaml` in pre-commit
#   • Frontend JS (web/*.html, web/sw.js)
#       → covered by CSP + audit corrections
#   • TOML / JSON / Markdown
#       → covered by format checkers (pre-commit)
#
# Repository hygiene:
#   The build output is written to /tmp/codeql-out/ — OUTSIDE
#   the repository tree. This guarantees:
#     1. No stray binary can accidentally end up in git.
#     2. `go build -o <dir>/ ./...` works regardless of how
#        many packages `./...` matches (each main package gets
#        its own binary under the dir).
#
#   A `trap` on EXIT removes the temp directory on every path
#   (success, failure, interrupt).
# ============================================================

name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          config-file: ./.github/codeql/codeql-config.yml

      # Fail loudly if proxy/go.mod is missing — a silent
      # fallback would let the analysis run against an empty
      # module and report zero findings.
      #
      # Build the whole package (`./...`), not just main.go:
      # CodeQL extracts the AST from every compiled file.
      #
      # `trap` on EXIT ensures the output directory is removed
      # on every path (success, failure, interrupt).
      #
      # -buildvcs=false: no VCS stamping (deterministic).
      # -trimpath:       normalize paths for reproducibility
      #                  (matches proxy/build.sh's release
      #                  build flags).
      - name: Build
        run: |
          set -euo pipefail
          cd proxy

          if [ ! -s go.mod ]; then
            echo "::error file=proxy/go.mod::proxy/go.mod is missing or empty"
            echo "::error::This workflow requires proxy/go.mod to exist."
            echo "::error::If it was intentionally removed, update this"
            echo "::error::workflow to reflect the new module layout."
            exit 1
          fi

          # Ensure the output directory is removed on any exit path.
          # /tmp is outside the repo tree, so no stray binary can
          # accidentally end up in git regardless of trap success.
          OUT_DIR="/tmp/codeql-out"
          trap 'rm -rf "$OUT_DIR"' EXIT
          mkdir -p "$OUT_DIR"

          go build -buildvcs=false -trimpath -o "$OUT_DIR/" ./...

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"