# ============================================================
#   🛡️ HARD-CQ-01 — Action versions aligned with ci.yml and
#     release.yml (checkout@v4, setup-go@v5). The prior `@v7`
#     references were speculative.
#
#   🛡️ HARD-CQ-02 — Removed the `go mod init` fallback. If
#     `proxy/go.mod` is missing, the build now fails with a
#     clear error message instead of silently creating an
#     empty module file. Parity with the `package_module.sh`
#     discipline of failing loudly on missing required files.
#
#   🛡️ HARD-CQ-03 — `cache: true` for setup-go. The prior
#     `cache: false` disabled module caching and added ~20-40 s
