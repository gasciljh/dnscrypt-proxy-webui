#
#   🛡️ HARD-CQ-05 — `go build ./...` instead of
#     `go build main.go`. Robust to future refactors that add
#     more .go files to the proxy package.
#
#   🛡️ HARD-CQ-06 — `set -euo pipefail` on the Build step.
#     Parity with ci.yml and package_module.sh.
#
#   🛡️ HARD-CQ-07 — The Build step uses `trap` to remove
#     `proxy/.codeql-analyze` on any exit. Ensures that the
#     file does not linger when the build fails partway through
#     (the previous `rm -f` line never ran in that case).
#
#     ⚠️ HARD-CQ-07 and CQ-1 describe the SAME code change.
#     They are both documented because CQ-1 was written first
#     (post-audit section) and HARD-CQ-07 was added later
#     (Global Edition section) as part of the broader hardening
#     pass. See CQ-1's note above.
#
#   🛡️ HARD-CQ-08 — The header's "Repository hygiene" note now
#     explicitly states that the `.gitignore` entry for
#     `proxy/.codeql-analyze` MUST exist. If it is missing
#     (see H-02 in the original audit), running the build
#     locally will leave an untracked file in `git status`.
#     The fix belongs in `.gitignore`, not in this workflow.
#
