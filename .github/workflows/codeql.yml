# ============================================================
# DNSCrypt Smart Filter – CodeQL Workflow
# Version: v1.1.0
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Purpose:
#   Static Application Security Testing (SAST) using GitHub
#   CodeQL. Runs on every push/PR to main or develop, plus a
#   weekly scheduled scan on Monday at 06:00 UTC.
#
# Steps:
#   • Checkout source
#   • Setup Go 1.22
#   • Initialize CodeQL (security-extended queries)
#   • Build the Go binary
#   • Perform the analysis
#
# Branch strategy:
#   • main    → stable releases (protected)
#   • develop → integration branch (features merged here first)
#
# Query suite — security-extended:
#   CodeQL ships with multiple query suites. This workflow uses
#   `security-extended`, which is broader than the default:
#
#   ┌───────────────┬────────────────────────────────┐
#   │ Suite            │ Scope                               │
#   ├───────────────┼────────────────────────────────┤
#   │ default          │ Core security queries only          │
#   │ security-extended│ Core + additional CWEs (recommended │
#   │                  │ for security-sensitive projects)    │
#   │ security-and-    │ Above + quality/maintainability     │
#   │ quality          │ checks (noisier)                    │ 
#   └───────────────┴────────────────────────────────┘
#
#   This project is security-sensitive (root module, handles
#   credentials, modifies firewall), so security-extended is the
#   right trade-off: more findings without excessive noise.
#
# CodeQL for Go — build requirement:
#   CodeQL analyzes Go by observing an actual build. The "Build"
#   step below calls `go build` on main.go. This is required —
#   without it, CodeQL cannot extract the AST and would fail
#   with "no code found" for the language.
#
#   ⚠️ The build uses CGO_ENABLED=0 (default when no CC is set)
#   because CodeQL runs on ubuntu-22.04 without the Android NDK.
#   This is intentional: the analysis cares about source
#   semantics, not the target architecture.
#
# Trigger matrix:
#   ┌───────────────┬─────────┬───────────────────┐
#   │ Event            │ Branch   │ Notes                │
#   ├───────────────┼──────────┼──────────────────┤
#   │ push             │ main     │ full analysis        │
#   │ push             │ develop  │ full analysis        │
#   │ pull_request     │ main     │ full analysis        │
#   │ pull_request     │ develop  │ full analysis        │
#   │ schedule         │ —        │ weekly Mon 06:00 UTC │
#   │ workflow_dispatch│ any      │ manual               │
#   └───────────────┴─────────┴───────────────────┘
#
#   The weekly scheduled run catches new CVEs published against
#   the codebase even when no commits were pushed. CodeQL updates
#   its query database regularly; the schedule ensures the
#   project benefits from those updates.
#
# category field:
#   The `category: "/language:go"` field tags each analysis with
#   a stable identifier. This matters when a repository has
#   multiple languages — the category prevents analyses from
#   overwriting each other on the GitHub Security tab.
#
# ⚠️ Action versions:
#   This workflow uses github/codeql-action@v3, which is a
#   well-established release. The other actions
#   (actions/checkout, actions/setup-go) use the same versions
#   as ci.yml (v7) for consistency.
#
#   If any `uses:` line fails with "reference not found", see the
#   note in ci.yml — the resolution is the same (check the
#   action's releases page and update the version).
#
#   Dependabot tracks the github-actions ecosystem weekly and
#   will open PRs for updates automatically.
#
# v1.1.0 changes:
#   • Version bumped to v1.1.0 (documentation only — no behavior
#     changes since v1.0.0).
#   • Added the "Query suite" comparison table explaining why
#     security-extended is used.
#   • Added a note about CodeQL's Go build requirement (it must
#     observe an actual compile; skipping the build breaks the
#     analysis).
#   • Added a Trigger matrix table.
#   • Documented the `category` field's role in multi-language
#     repositories.
# ============================================================

name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended

      - name: Build
        run: |
          cd proxy
          [ -f go.mod ] || go mod init dnscrypt-webui
          go build -buildvcs=false -trimpath -o /tmp/analyze main.go

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"