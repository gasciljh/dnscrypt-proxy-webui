# ============================================================
# DNSCrypt Smart Filter – Release Workflow
# Version: v1.1.0
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Purpose:
#   Publishes a signed GitHub Release when a version tag is
#   pushed. Can also be triggered manually via workflow_dispatch.
#
# Release trigger:
#   Two paths lead to a release:
#
#   1. Tag push (automated, preferred)
#        Tag pattern: v<MAJOR>.<MINOR>.<PATCH>
#                     v<MAJOR>.<MINOR>.<PATCH>-<prerelease>
#        Created by:  scripts/release.sh
#                     scripts/release-patch.sh
#
#   2. workflow_dispatch (manual, emergency)
#        Triggered from: Actions → Release → Run workflow
#        Version source: VERSION file (not a tag)
#        Use when: fixing a broken release without a new commit
#
# Pipeline steps (11 + 1):
#   ┌───┬───────────────────────────┬────────────┐
#   │ #  │ Step                           │ Duration    │
#   ├───┼───────────────────────────┼────────────┤
#   │  1 │ Checkout (fetch-depth: 0)      │ ~5 s        │
#   │  2 │ Setup Go 1.22                  │ ~10 s       │
#   │  3 │ Setup Android NDK r26b         │ ~30 s       │
#   │  4 │ Determine version              │ ~2 s        │
#   │  5 │ Install packaging tools        │ ~15 s       │
#   │  6 │ Build WebUI binaries (4 arch)  │ ~60 s       │
#   │  7 │ Verify binaries (ELF + PIE)    │ ~5 s        │
#   │  8 │ Package Magisk module          │ ~30 s       │
#   │  9 │ Upload artifacts (backup)      │ ~20 s       │
#   │ 10 │ Create GitHub Release          │ ~10 s       │
#   │ 11 │ Sync main → develop           │ ~15 s       │
#   └───┴───────────────────────────┴────────────┘
#
#   Total: ~3–5 minutes (excluding runner setup).
#
# Artifacts produced:
#   Attached to the GitHub Release (6 files):
#     • dnscrypt-webui-<ver>-module.zip         (~12 MB)
#     • dnscrypt-webui-<ver>-module.zip.sha256  (~100 B)
#     • dnscrypt-webui-arm64                    (~8 MB)
#     • dnscrypt-webui-arm                      (~7 MB)
#     • dnscrypt-webui-amd64                    (~7.5 MB)
#     • dnscrypt-webui-386                      (~7 MB)
#
#   Also uploaded as a workflow artifact (backup, 30-day retention):
#     • dist/            (the ZIP + .sha256)
#     • proxy/build/     (the 4 binaries)
#
# Sync main → develop (step 11):
#   After the release is published, this workflow syncs main into
#   develop so the two branches do not drift apart.
#
#   Why this matters:
#     • Releases land on main first (via release/* or hotfix/*).
#     • Without a sync, develop lags behind main after every
#       release, and the next release/* PR would reintroduce
#       stale commits.
#
#   Behavior:
#     • Tries fast-forward merge first (preserves linear history).
#     • Falls back to a regular merge with a chore commit if
#       fast-forward is not possible.
#     • On conflict: aborts, logs a warning, exits 0.
#       Manual resolution required.
#
#   Safety:
#     • `continue-on-error: true` — a failed sync NEVER fails
#       the release. The release is already published at this
#       point; the sync is a follow-up convenience.
#     • `if: github.event_name == 'push'` — only runs on tag
#       pushes, not on workflow_dispatch.
#     • Uses GITHUB_TOKEN with `contents: write` (already
#       granted at the top of the workflow).
#
#   See docs/adr/0003-post-release-sync.md for the full rationale.
#
# ⚠️ Action versions:
#   This workflow references:
#     • actions/checkout@v7
#     • actions/setup-go@v7
#     • actions/upload-artifact@v7
#     • nttld/setup-ndk@v1
#     • softprops/action-gh-release@v3
#
#   If any `uses:` line fails with "reference not found", see the
#   note in ci.yml — the resolution is the same (check the
#   action's releases page and update the version).
#
#   Dependabot tracks the github-actions ecosystem weekly and
#   will open PRs for updates automatically.
#
# ⚠️ Permissions:
#   `contents: write` is required for:
#     • Creating the GitHub Release
#     • Pushing to develop in the sync step
#
#   Do not downgrade to `contents: read` — the release creation
#   step would fail with a 403.
#
# v1.1.0 changes:
#   • Version bumped to v1.1.0 (documentation only — no behavior
#     changes since v1.0.0).
#   • Added a "Pipeline steps" table with duration estimates.
#   • Added a "Sync main → develop" section explaining the
#     rationale and safety mechanisms, with a reference to
#     ADR-0003.
#   • Added a "Permissions" note explaining why contents: write
#     is required.
#   • Added an "Action versions" warning, consistent with
#     ci.yml and codeql.yml.
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.22'
  NDK_VERSION: 'r26b'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V=$(tr -d '\r\n' < VERSION)
          fi
          echo "value=$V" >> $GITHUB_OUTPUT
          echo "no_v=${V#v}" >> $GITHUB_OUTPUT
          echo "::notice::Version: $V"

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zip unzip jq curl ca-certificates

      - name: Build WebUI binaries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          PROJECT_URL: https://github.com/${{ github.repository }}
        run: |
          chmod +x proxy/build.sh
          cd proxy && ./build.sh --clean --parallel

      - name: Verify WebUI binaries
        run: |
          ls -la proxy/build/
          for arch in arm64 arm amd64 386; do
            f="proxy/build/dnscrypt-webui-$arch"
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
            file "$f" | grep -q "pie executable" || { echo "::error::$f not PIE"; exit 1; }
          done
          echo "::notice::All 4 WebUI binaries OK"

      - name: Package Magisk module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/package_module.sh scripts/fetch_dns_binaries.sh
          ./scripts/package_module.sh \
            --version "${{ steps.version.outputs.value }}" \
            --output-dir ./dist \
            --verbose

      - name: List final artifacts
        run: |
          echo "=== dist/ ==="
          ls -la dist/
          echo ""
          echo "=== proxy/build/ ==="
          ls -la proxy/build/

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.value }}
          path: |
            dist/
            proxy/build/dnscrypt-webui-*
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.value }}
          tag_name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          draft: false
          files: |
            dist/dnscrypt-webui-*-module.zip
            dist/dnscrypt-webui-*-module.zip.sha256
            proxy/build/dnscrypt-webui-arm64
            proxy/build/dnscrypt-webui-arm
            proxy/build/dnscrypt-webui-amd64
            proxy/build/dnscrypt-webui-386
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Post-release synchronization
      # ============================================================
      # Sync develop branch with main after a successful release.
      #
      # Rationale:
      #   • Tags are created on main (protected branch).
      #   • After the release, develop lags behind main.
      #   • This step keeps develop up to date so future feature
      #     branches start from the latest code.
      #
      # Safety:
      #   • Does NOT fail the release on conflict.
      #   • Only runs when a tag was pushed (not workflow_dispatch).
      #   • Uses GITHUB_TOKEN with contents: write permission.
      #
      # See docs/adr/0003-post-release-sync.md for full details.
      # ============================================================
      - name: Sync main → develop
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "::group::Configure git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "::endgroup::"

          echo "::group::Fetch branches"
          git fetch origin main
          git fetch origin develop
          echo "::endgroup::"

          # Check if develop branch exists
          if ! git rev-parse --verify origin/develop >/dev/null 2>&1; then
            echo "::warning::develop branch does not exist — skipping sync"
            exit 0
          fi

          echo "::group::Checkout develop"
          git checkout -B develop origin/develop
          echo "::endgroup::"

          echo "::group::Attempt merge main into develop"
          if git merge origin/main --no-edit --ff-only 2>/dev/null; then
            echo "::notice::Fast-forward merge succeeded"
          else
            echo "::warning::Fast-forward not possible — trying regular merge"
            if ! git merge origin/main --no-edit -m "chore: sync develop with main after ${{ steps.version.outputs.value }} release"; then
              echo "::warning::Merge conflict detected — manual resolution required"
              echo "::warning::develop will NOT be synced automatically"
              git merge --abort || true
              exit 0
            fi
          fi
          echo "::endgroup::"

          echo "::group::Push develop"
          if git push origin develop; then
            echo "::notice::Successfully synced develop with main"
          else
            echo "::warning::Failed to push develop — check branch protection rules"
          fi
          echo "::endgroup::"