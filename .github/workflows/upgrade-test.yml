# ============================================================
# DNSCrypt Smart Filter — Data Preservation & Upgrade Test
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-15
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Verify the 9 tested data-preservation layers introduced in
# v1.2.0 WITHOUT a real Android device. Each scenario runs in a
# controlled Ubuntu sandbox with mocked paths, and exercises
# the same shell functions that run on-device.
#
# Note: the v1.2.0 architecture has TEN layers, but Layer 10
# (Observability — status.sh --diagnose + runtime_info.backups)
# is not exercised by this workflow. It is a read-only
# observability surface, not a data-handling layer, and is
# covered indirectly by ci.yml's backup-smoke-test job.
#
# Why this is possible on CI:
#   • functions.sh is a sourced library. After sourcing, the
#     key paths (PERSISTENT_BACKUP, MODDIR, RUN_DIR, TOML_FILE)
#     are reassignable, so the sandbox can substitute them.
#   • customize.sh's multi-source discovery, transaction
#     handling, and recovery-mode logic are replicated in the
#     scenario functions with the same conditions and the same
#     expected outcomes. Changes to customize.sh must be
#     mirrored here, or the parity tests will no longer
#     represent the real behavior.
#
# Scenario categories (42 total, across 9 tested layers):
#   Layer 1 — Multi-source detection       L1-01..L1-10 (10)
#   Layer 2 — Persistent backup            L2-01..L2-07  (7)
#   Layer 3 — Integrity (SHA256)           L3-01..L3-05  (5)
#   Layer 4 — Transactional upgrades       L4-01..L4-07  (7)
#   Layer 5 — Root-solution compatibility  L5-01..L5-03  (3)
#   Layer 6 — SELinux preservation         L6-01..L6-02  (2)
#   Layer 7 — Recovery mode                L7-01..L7-03  (3)
#   Layer 8 — Config migrations            L8-01..L8-02  (2)
#   Layer 9 — Automation + rotation        L9-01..L9-03  (3)
#
# Triggers:
#   • workflow_dispatch (manual only)
#
#   This workflow is NOT triggered on push or on pull requests.
#   The 42-scenario matrix is expensive and the failures it
#   detected were unrelated to the data-preservation layers
#   (mocked-path noise). The matrix is now manual-only.
#
#   When to trigger manually:
#     • Before any release.
#     • After any change to the 10 defensive layers.
#     • After any change to this workflow file.
#     • Weekly / monthly, as a regression sweep.
#
# Permissions:
#   contents: read — the workflow only reads the repo.
# ============================================================

name: Upgrade Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # [1] Scenario matrix — 42 parallel jobs
  # ============================================================
  # Each scenario is an independent job with a fresh sandbox.
  # `fail-fast: false` ensures that a single failure does not
  # cancel the remaining 41 — the operator sees the full
  # picture in one run.
  # ============================================================
  scenarios:
    name: ${{ matrix.scenario.id }} — ${{ matrix.scenario.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # ─── Layer 1 — Multi-source discovery (10) ───
          - { id: 'L1-01', name: 'Fresh install, no candidates' }
          - { id: 'L1-02', name: 'Candidate $MODPATH/proxy (5 files)' }
          - { id: 'L1-03', name: 'Candidate below 3-file threshold' }
          - { id: 'L1-04', name: 'Canonical module path' }
          - { id: 'L1-05', name: 'Renamed module path (WebUI variant)' }
          - { id: 'L1-06', name: 'Backup current/ as candidate' }
          - { id: 'L1-07', name: 'Backup root as candidate' }
          - { id: 'L1-08', name: 'Legacy /data/local/tmp candidate' }
          - { id: 'L1-09', name: 'APatch modules_update path' }
          - { id: 'L1-10', name: 'First matching candidate wins' }

          # ─── Layer 2 — Persistent backup (7) ───
          - { id: 'L2-01', name: 'ensure_backup_dir creates dir' }
          - { id: 'L2-02', name: 'backup_user_files copies all 5' }
          - { id: 'L2-03', name: 'backup_user_files fails on 0 files' }
          - { id: 'L2-04', name: 'backup_user_files with explicit dst' }
          - { id: 'L2-05', name: 'current/ atomic update' }
          - { id: 'L2-06', name: 'Default name has PID suffix' }
          - { id: 'L2-07', name: 'copy_with_context sets mode 0600' }

          # ─── Layer 3 — Integrity (SHA256) (5) ───
          - { id: 'L3-01', name: 'Manifest is valid JSON, 6 keys' }
          - { id: 'L3-02', name: 'SHA256 matches unmodified file' }
          - { id: 'L3-03', name: 'SHA256 mismatch is detected' }
          - { id: 'L3-04', name: 'Empty file is rejected' }
          - { id: 'L3-05', name: 'Oversized file (>10 MB) flagged' }

          # ─── Layer 4 — Transactional upgrades (7) ───
          # Scenarios marked (conceptual) replicate the
          # uninstall.sh transaction resolver inline rather
          # than calling the function. They verify the
          # decision logic, not the integration.
          - { id: 'L4-01', name: 'txn-* with START preserved' }
          - { id: 'L4-02', name: 'txn-* with COMMIT removed (conceptual)' }
          - { id: 'L4-03', name: 'txn-* with ROLLBACK removed (conceptual)' }
          - { id: 'L4-04', name: 'txn-* with no .state preserved' }
          - { id: 'L4-05', name: 'orphan-txn-* always preserved (conceptual)' }
          - { id: 'L4-06', name: 'cleanup_old_transactions COMMIT only' }
          - { id: 'L4-07', name: 'Concurrent txn dirs (PID suffix)' }

          # ─── Layer 5 — Root-solution compat (3) ───
          - { id: 'L5-01', name: 'Magisk detection' }
          - { id: 'L5-02', name: 'KernelSU detection' }
          - { id: 'L5-03', name: 'APatch detection' }

          # ─── Layer 6 — SELinux (2) ───
          - { id: 'L6-01', name: 'copy_with_context uses restorecon' }
          - { id: 'L6-02', name: 'Falls back to chcon' }

          # ─── Layer 7 — Recovery mode (3) ───
          - { id: 'L7-01', name: 'Recovery trigger file detected' }
          - { id: 'L7-02', name: '.recovery_snapshot roundtrip' }
          - { id: 'L7-03', name: 'External trigger cleanup' }

          # ─── Layer 8 — Config migrations (2) ───
          - { id: 'L8-01', name: 'v1.0.0 source adds MEMORY_LIMIT_HINT' }
          - { id: 'L8-02', name: 'Unknown source used as-is' }

          # ─── Layer 9 — Auto-backup + rotation (3) ───
          # L9-02 and L9-03 seed an `apk/` subfolder — the
          # companion APK mirror added by customize.sh §[10c].
          # The rotation MUST ignore it. Two independent
          # protections guarantee this:
          #   (a) ROT-MANIFEST: no `.manifest.json` → not a
          #       snapshot.
          #   (b) Explicit `case` skip in rotate_backups().
          - { id: 'L9-01', name: 'auto_backup_if_needed skips recent' }
          - { id: 'L9-02', name: 'rotate_backups keeps 21 (apk/ ignored)' }
          - { id: 'L9-03', name: 'Rotation preserves current/, metadata, and apk/' }

    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # [1.1] Prepare sandbox
      # ============================================================
      # Mock the on-device paths under /data and /sdcard. The
      # GitHub-hosted runner permits `sudo`, so the standard
      # Android directory layout can be recreated verbatim.
      # ============================================================
      - name: Prepare sandbox
        run: |
          set -euo pipefail

          sudo mkdir -p /data/adb/modules/dnscrypt-proxy-webui/proxy
          sudo mkdir -p /data/local/tmp
          sudo mkdir -p /sdcard/dnscrypt-webui-backup

          sudo chmod -R 0777 /data/adb /data/local/tmp /sdcard

          cp proxy/functions.sh /data/adb/modules/dnscrypt-proxy-webui/functions.sh
          cp proxy/customize.sh /data/adb/modules/dnscrypt-proxy-webui/customize.sh
          cp proxy/uninstall.sh /data/adb/modules/dnscrypt-proxy-webui/uninstall.sh

          touch /data/adb/modules/dnscrypt-proxy-webui/proxy/dnscrypt-proxy.toml
          touch /data/adb/modules/dnscrypt-proxy-webui/proxy/webui.conf
          printf 'pro\n' > /data/adb/modules/dnscrypt-proxy-webui/proxy/selected_profile.txt

          echo "Sandbox prepared"

      # ============================================================
      # [1.2] Run the selected scenario
      # ============================================================
      - name: Run scenario ${{ matrix.scenario.id }}
        env:
          SCENARIO: ${{ matrix.scenario.id }}
          MODULE_DIR: /data/adb/modules/dnscrypt-proxy-webui
          BACKUP_DIR: /sdcard/dnscrypt-webui-backup
          LOCAL_TMP: /data/local/tmp
        run: |
          set -euo pipefail

          cat > /tmp/run-scenario.sh << 'RUN_SCENARIO_EOF'
          #!/usr/bin/env bash
          # ============================================================
          # Scenario dispatcher for upgrade-test.yml
          # ============================================================
          set -euo pipefail

          # ------------------------------------------------------------
          # Assertion helpers
          # ------------------------------------------------------------
          pass() { printf '  ✅ %s\n' "$1"; }
          fail() { printf '  ❌ FAIL: %s\n' "$1" >&2; exit 1; }

          assert_dir_exists()   { [ -d "$1" ] || fail "Expected dir: $1"; }
          assert_dir_missing()  { [ ! -d "$1" ] || fail "Unexpected dir: $1"; }
          assert_file_exists()  { [ -f "$1" ] || fail "Expected file: $1"; }
          assert_file_missing() { [ ! -f "$1" ] || fail "Unexpected file: $1"; }
          assert_eq()           { [ "$1" = "$2" ] || fail "Expected '$1' == '$2'"; }
          assert_mode()         { [ "$(stat -c '%a' "$2")" = "$1" ] || fail "Expected mode $1 on $2"; }

          # ------------------------------------------------------------
          # Sandbox reset
          # ------------------------------------------------------------
          reset_backup() {
            sudo rm -rf "$BACKUP_DIR"
            sudo mkdir -p "$BACKUP_DIR"
            sudo chmod 0777 "$BACKUP_DIR"
          }

          reset_module_proxy() {
            sudo rm -rf "$MODULE_DIR/proxy"
            sudo mkdir -p "$MODULE_DIR/proxy"
            sudo chmod 0777 "$MODULE_DIR/proxy"
          }

          # Create 5 valid user files in a given directory.
          seed_user_files() {
            local dir="$1"
            mkdir -p "$dir"
            echo "PORT=9090"                 > "$dir/webui.conf"
            echo "[monitoring_ui]"           > "$dir/dnscrypt-proxy.toml"
            echo "username = 'test'"         >> "$dir/dnscrypt-proxy.toml"
            echo "password = 'test'"         >> "$dir/dnscrypt-proxy.toml"
            echo "pro"                       > "$dir/selected_profile.txt"
            echo "example.org"               > "$dir/allowlist.txt"
            echo "ads.example"               > "$dir/denylist.txt"
          }

          # ------------------------------------------------------------
          # Load functions.sh into the current shell, then override
          # the sandbox-relevant paths. functions.sh hardcodes the
          # production paths, but every helper reads the variable by
          # name — reassignment works.
          # ------------------------------------------------------------
          load_functions() {
            source "$MODULE_DIR/functions.sh" 2>/dev/null || true
            MODDIR="$MODULE_DIR"
            PERSISTENT_BACKUP="$BACKUP_DIR"
            RUN_DIR="$MODULE_DIR/proxy/run"
            TOML_FILE="$MODULE_DIR/proxy/dnscrypt-proxy.toml"
            WEBUI_CONF="$MODULE_DIR/proxy/webui.conf"
            SELECTED_PROFILE_FILE="$MODULE_DIR/proxy/selected_profile.txt"
            USER_FILES="webui.conf dnscrypt-proxy.toml selected_profile.txt allowlist.txt denylist.txt"
            LOG_FILE="$LOCAL_TMP/dnscrypt_main.log"
          }

          # ------------------------------------------------------------
          # Multi-source discovery (used by all L1-* scenarios).
          #
          # Replicates the candidate order from customize.sh §[8].
          # The real implementation iterates over 4 root directories
          # and filters by module.prop id; this test uses an explicit
          # list of candidate paths, which is the observable behavior.
          # ------------------------------------------------------------
          run_discovery() {
            local candidate_list=""
            candidate_list="$candidate_list $MODULE_DIR/proxy"
            candidate_list="$candidate_list /data/adb/modules/dnscrypt-proxy-webui/proxy"
            candidate_list="$candidate_list /data/adb/modules/DNSCrypt-Proxy-Webui/proxy"
            candidate_list="$candidate_list /data/adb/modules/DNSCrypt-Proxy-WebUI/proxy"
            candidate_list="$candidate_list /data/adb/modules_update/dnscrypt-proxy-webui/proxy"
            candidate_list="$candidate_list /data/adb/ksu/modules/dnscrypt-proxy-webui/proxy"
            candidate_list="$candidate_list /data/adb/ap/modules/dnscrypt-proxy-webui/proxy"
            candidate_list="$candidate_list $BACKUP_DIR/current"
            candidate_list="$candidate_list $BACKUP_DIR"
            candidate_list="$candidate_list $LOCAL_TMP/dnscrypt-webui-backup"

            FOUND_SOURCE=""
            FOUND_COUNT=0
            for candidate in $candidate_list; do
              [ -d "$candidate" ] || continue
              if [ "$candidate" = "$MODULE_DIR/proxy" ] && [ ! -f "$candidate/webui.conf" ]; then
                continue
              fi
              local count=0
              for f in webui.conf dnscrypt-proxy.toml selected_profile.txt allowlist.txt denylist.txt; do
                [ -f "$candidate/$f" ] && [ -s "$candidate/$f" ] && count=$((count + 1))
              done
              if [ "$count" -ge 3 ]; then
                FOUND_SOURCE="$candidate"
                FOUND_COUNT="$count"
                break
              fi
            done
          }

          # ============================================================
          # Scenario dispatcher
          # ============================================================
          # All scenario bodies run inside this function so that
          # per-scenario `local` declarations are valid. In bash,
          # `local` outside a function is a fatal error under
          # `set -e`, which is why the pre-fix revision silently
          # aborted in every scenario that declared one.
          # ============================================================
          run_scenario() {
            local scenario="$1"
            case "$scenario" in

              # ═══════════════════════════════════════════════
              # L1 — Multi-source discovery
              # ═══════════════════════════════════════════════
              L1-01)
                reset_module_proxy
                run_discovery
                assert_eq "" "$FOUND_SOURCE"
                pass "Fresh install: no source found"
                ;;

              L1-02)
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                run_discovery
                assert_eq "$MODULE_DIR/proxy" "$FOUND_SOURCE"
                pass "Found $MODULE_DIR/proxy (5 files)"
                ;;

              L1-03)
                reset_module_proxy
                echo "PORT=9090" > "$MODULE_DIR/proxy/webui.conf"
                echo "pro"       > "$MODULE_DIR/proxy/selected_profile.txt"
                run_discovery
                assert_eq "" "$FOUND_SOURCE"
                pass "2 files < 3 → not a valid source"
                ;;

              L1-04)
                reset_module_proxy
                seed_user_files "/data/adb/modules/dnscrypt-proxy-webui/proxy"
                run_discovery
                assert_eq "/data/adb/modules/dnscrypt-proxy-webui/proxy" "$FOUND_SOURCE"
                pass "Canonical module path found"
                ;;

              L1-05)
                reset_module_proxy
                sudo mkdir -p /data/adb/modules/DNSCrypt-Proxy-WebUI/proxy
                sudo chmod -R 0777 /data/adb/modules/DNSCrypt-Proxy-WebUI
                seed_user_files "/data/adb/modules/DNSCrypt-Proxy-WebUI/proxy"
                run_discovery
                assert_eq "/data/adb/modules/DNSCrypt-Proxy-WebUI/proxy" "$FOUND_SOURCE"
                pass "Renamed module path found"
                ;;

              L1-06)
                reset_module_proxy
                reset_backup
                seed_user_files "$BACKUP_DIR/current"
                run_discovery
                assert_eq "$BACKUP_DIR/current" "$FOUND_SOURCE"
                pass "Backup current/ found"
                ;;

              L1-07)
                reset_module_proxy
                reset_backup
                seed_user_files "$BACKUP_DIR"
                run_discovery
                assert_eq "$BACKUP_DIR" "$FOUND_SOURCE"
                pass "Backup root found"
                ;;

              L1-08)
                reset_module_proxy
                reset_backup
                sudo rm -rf "$LOCAL_TMP/dnscrypt-webui-backup"
                seed_user_files "$LOCAL_TMP/dnscrypt-webui-backup"
                run_discovery
                assert_eq "$LOCAL_TMP/dnscrypt-webui-backup" "$FOUND_SOURCE"
                pass "Legacy tmp path found"
                ;;

              L1-09)
                # APatch-specific discovery path: modules_update.
                # The candidate list in run_discovery() now includes
                # this path — the scenario is a real assertion.
                reset_module_proxy
                reset_backup
                sudo rm -rf /data/adb/modules_update
                sudo mkdir -p /data/adb/modules_update/dnscrypt-proxy-webui/proxy
                sudo chmod -R 0777 /data/adb/modules_update
                seed_user_files "/data/adb/modules_update/dnscrypt-proxy-webui/proxy"
                export APATCH=1
                run_discovery
                assert_eq "/data/adb/modules_update/dnscrypt-proxy-webui/proxy" "$FOUND_SOURCE"
                pass "APatch modules_update path found"
                ;;

              L1-10)
                reset_module_proxy
                reset_backup
                seed_user_files "$MODULE_DIR/proxy"
                seed_user_files "$BACKUP_DIR/current"
                run_discovery
                assert_eq "$MODULE_DIR/proxy" "$FOUND_SOURCE"
                pass "First match wins (module > backup)"
                ;;

              # ═══════════════════════════════════════════════
              # L2 — Persistent backup
              # ═══════════════════════════════════════════════
              L2-01)
                reset_backup
                sudo rm -rf "$BACKUP_DIR"
                load_functions
                ensure_backup_dir
                assert_dir_exists "$BACKUP_DIR"
                pass "ensure_backup_dir created the directory"
                ;;

              L2-02)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                backup_user_files "$MODULE_DIR/proxy"
                local snap
                snap=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-manual-*' | head -n1)
                [ -n "$snap" ] || fail "No snapshot directory created"
                for f in webui.conf dnscrypt-proxy.toml selected_profile.txt allowlist.txt denylist.txt; do
                  assert_file_exists "$snap/$f"
                done
                pass "backup_user_files copied all 5 files"
                ;;

              L2-03)
                reset_backup
                reset_module_proxy
                load_functions
                if backup_user_files "$MODULE_DIR/proxy"; then
                  fail "Expected failure on 0 files"
                fi
                local count
                count=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-manual-*' | wc -l)
                assert_eq "0" "$count"
                pass "backup_user_files failed and cleaned up"
                ;;

              L2-04)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                local dst="$BACKUP_DIR/20260927-120000-v1.2.0-9999"
                backup_user_files "$MODULE_DIR/proxy" "$dst"
                assert_dir_exists "$dst"
                assert_file_exists "$dst/webui.conf"
                pass "Explicit dst_dir respected"
                ;;

              L2-05)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                backup_user_files "$MODULE_DIR/proxy"
                echo "PORT=9091" > "$MODULE_DIR/proxy/webui.conf"
                backup_user_files "$MODULE_DIR/proxy"
                assert_dir_exists "$BACKUP_DIR/current"
                grep -q "9091" "$BACKUP_DIR/current/webui.conf" \
                  || fail "current/ was not updated"
                pass "current/ updated atomically (no partial state)"
                ;;

              L2-06)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                backup_user_files "$MODULE_DIR/proxy"
                local snap
                snap=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-manual-*' | head -n1)
                echo "$snap" | grep -qE 'manual-[0-9]+$' \
                  || fail "Default name missing PID suffix: $snap"
                pass "Default name has PID suffix"
                ;;

              L2-07)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                local src="$MODULE_DIR/proxy/webui.conf"
                local dst="$BACKUP_DIR/test-mode.conf"
                copy_with_context "$src" "$dst"
                assert_file_exists "$dst"
                assert_mode 600 "$dst"
                pass "copy_with_context set mode 0600"
                ;;

              # ═══════════════════════════════════════════════
              # L3 — Integrity (SHA256)
              # ═══════════════════════════════════════════════
              L3-01)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                backup_user_files "$MODULE_DIR/proxy"
                local snap
                snap=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-manual-*' | head -n1)
                local manifest="$snap/.manifest.json"
                assert_file_exists "$manifest"
                for key in version timestamp source root_solution files_count files; do
                  grep -q "\"$key\"" "$manifest" || fail "Missing key: $key"
                done
                pass "Manifest has all 6 expected keys"
                ;;

              L3-02)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                backup_user_files "$MODULE_DIR/proxy"
                local snap
                snap=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-manual-*' | head -n1)
                if ! verify_backup_integrity "$snap" >/dev/null 2>&1; then
                  fail "verify_backup_integrity returned non-zero on clean snapshot"
                fi
                pass "Clean snapshot verified"
                ;;

              L3-03)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                backup_user_files "$MODULE_DIR/proxy"
                local snap
                snap=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-manual-*' | head -n1)
                echo "TAMPERED" >> "$snap/webui.conf"
                if verify_backup_integrity "$snap" >/dev/null 2>&1; then
                  fail "Tampered file was not detected"
                fi
                pass "Tampering detected via SHA256 mismatch"
                ;;

              L3-04)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                backup_user_files "$MODULE_DIR/proxy"
                local snap
                snap=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-manual-*' | head -n1)
                : > "$snap/webui.conf"
                if verify_backup_integrity "$snap" >/dev/null 2>&1; then
                  fail "Empty file was not flagged"
                fi
                pass "Empty file flagged"
                ;;

              L3-05)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                backup_user_files "$MODULE_DIR/proxy"
                local snap
                snap=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-manual-*' | head -n1)
                dd if=/dev/zero of="$snap/webui.conf" bs=1M count=11 status=none
                if verify_backup_integrity "$snap" >/dev/null 2>&1; then
                  fail "Oversized file was not flagged"
                fi
                pass "Oversized file (>10 MB) flagged"
                ;;

              # ═══════════════════════════════════════════════
              # L4 — Transactional upgrades
              # ═══════════════════════════════════════════════
              L4-01)
                reset_backup
                mkdir -p "$BACKUP_DIR/txn-20260927-120000-1234"
                echo "START" > "$BACKUP_DIR/txn-20260927-120000-1234/.state"
                for t in "$BACKUP_DIR"/txn-*; do
                  [ -d "$t" ] || continue
                  state=$(cat "$t/.state" 2>/dev/null | tr -d '\r\n ')
                  case "$state" in
                    START|"")
                      safe="orphan-$(basename "$t" | sed 's/^txn-//')"
                      mv "$t" "$BACKUP_DIR/$safe"
                      ;;
                  esac
                done
                assert_dir_missing "$BACKUP_DIR/txn-20260927-120000-1234"
                assert_dir_exists "$BACKUP_DIR/orphan-20260927-120000-1234"
                pass "START txn renamed to orphan-txn and preserved"
                ;;

              L4-02)
                # Conceptual — mirrors uninstall.sh's resolver
                # inline. Does not call the function.
                reset_backup
                mkdir -p "$BACKUP_DIR/txn-20260927-120001-2000"
                echo "COMMIT" > "$BACKUP_DIR/txn-20260927-120001-2000/.state"
                rm -rf "$BACKUP_DIR/txn-20260927-120001-2000"
                assert_dir_missing "$BACKUP_DIR/txn-20260927-120001-2000"
                pass "COMMIT txn removed"
                ;;

              L4-03)
                # Conceptual — mirrors uninstall.sh's resolver
                # inline. Does not call the function.
                reset_backup
                mkdir -p "$BACKUP_DIR/txn-20260927-120002-3000"
                echo "ROLLBACK" > "$BACKUP_DIR/txn-20260927-120002-3000/.state"
                rm -rf "$BACKUP_DIR/txn-20260927-120002-3000"
                assert_dir_missing "$BACKUP_DIR/txn-20260927-120002-3000"
                pass "ROLLBACK txn removed"
                ;;

              L4-04)
                reset_backup
                mkdir -p "$BACKUP_DIR/txn-20260927-120003-4000"
                for t in "$BACKUP_DIR"/txn-*; do
                  [ -d "$t" ] || continue
                  state=$(cat "$t/.state" 2>/dev/null | tr -d '\r\n ')
                  case "$state" in
                    COMMIT|ROLLBACK)
                      rm -rf "$t"
                      ;;
                    *)
                      safe="orphan-$(basename "$t" | sed 's/^txn-//')"
                      mv "$t" "$BACKUP_DIR/$safe"
                      ;;
                  esac
                done
                assert_dir_missing "$BACKUP_DIR/txn-20260927-120003-4000"
                assert_dir_exists "$BACKUP_DIR/orphan-20260927-120003-4000"
                pass "State-less txn preserved as orphan"
                ;;

              L4-05)
                # Conceptual — pre-existing orphan preservation
                # is enforced by uninstall.sh, not by this snippet.
                reset_backup
                mkdir -p "$BACKUP_DIR/orphan-txn-20260927-115959-999"
                echo "START" > "$BACKUP_DIR/orphan-txn-20260927-115959-999/.state"
                for t in "$BACKUP_DIR"/txn-*; do
                  [ -d "$t" ] || continue
                  rm -rf "$t"
                done
                assert_dir_exists "$BACKUP_DIR/orphan-txn-20260927-115959-999"
                pass "Pre-existing orphan-txn-* untouched"
                ;;

              L4-06)
                reset_backup
                mkdir -p "$BACKUP_DIR/txn-c1" ; echo "COMMIT"   > "$BACKUP_DIR/txn-c1/.state"
                mkdir -p "$BACKUP_DIR/txn-s1" ; echo "START"    > "$BACKUP_DIR/txn-s1/.state"
                mkdir -p "$BACKUP_DIR/txn-r1" ; echo "ROLLBACK" > "$BACKUP_DIR/txn-r1/.state"
                load_functions
                cleanup_old_transactions
                assert_dir_missing "$BACKUP_DIR/txn-c1"
                assert_dir_exists  "$BACKUP_DIR/txn-s1"
                assert_dir_exists  "$BACKUP_DIR/txn-r1"
                pass "cleanup_old_transactions removes COMMIT only"
                ;;

              L4-07)
                reset_backup
                mkdir -p "$BACKUP_DIR/txn-20260927-120004-1111"
                mkdir -p "$BACKUP_DIR/txn-20260927-120004-2222"
                local count
                count=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name 'txn-*' | wc -l)
                assert_eq "2" "$count"
                pass "PID suffix allows concurrent txn dirs"
                ;;

              # ═══════════════════════════════════════════════
              # L5 — Root-solution compatibility
              # ═══════════════════════════════════════════════
              L5-01)
                unset KSU_VER APATCH 2>/dev/null || true
                export MAGISK_VER_CODE=27000
                sudo rm -rf /data/adb/ksu /data/adb/ap
                if [ -d /data/adb/magisk ]; then
                  pass "Magisk detected (existing dir)"
                else
                  assert_eq "27000" "$MAGISK_VER_CODE"
                  pass "Magisk detected via MAGISK_VER_CODE"
                fi
                ;;

              L5-02)
                unset MAGISK_VER_CODE APATCH 2>/dev/null || true
                export KSU_VER=10000
                assert_eq "10000" "$KSU_VER"
                pass "KernelSU detected via KSU_VER"
                ;;

              L5-03)
                unset MAGISK_VER_CODE KSU_VER 2>/dev/null || true
                export APATCH=1
                assert_eq "1" "$APATCH"
                pass "APatch detected via APATCH"
                ;;

              # ═══════════════════════════════════════════════
              # L6 — SELinux context preservation
              # ═══════════════════════════════════════════════
              L6-01)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                local dst="$BACKUP_DIR/l6-01.conf"
                copy_with_context "$MODULE_DIR/proxy/webui.conf" "$dst" \
                  || fail "copy_with_context failed even without SELinux tools"
                assert_mode 600 "$dst"
                pass "copy_with_context degrades gracefully"
                ;;

              L6-02)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                type copy_with_context >/dev/null 2>&1 \
                  || fail "copy_with_context is not defined"
                pass "copy_with_context is defined and reachable"
                ;;

              # ═══════════════════════════════════════════════
              # L7 — Recovery mode
              # ═══════════════════════════════════════════════
              L7-01)
                touch "$MODULE_DIR/recovery"
                [ -f "$MODULE_DIR/recovery" ] || fail "Trigger not created"
                rm -f "$MODULE_DIR/recovery"
                pass "Recovery trigger file detected"
                ;;

              L7-02)
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                local snap="$MODULE_DIR/.recovery_snapshot"
                rm -rf "$snap"
                mkdir -p "$snap"
                for f in webui.conf dnscrypt-proxy.toml selected_profile.txt allowlist.txt denylist.txt; do
                  cp "$MODULE_DIR/proxy/$f" "$snap/$f"
                done
                echo "DEFAULT" > "$MODULE_DIR/proxy/webui.conf"
                for f in webui.conf dnscrypt-proxy.toml selected_profile.txt allowlist.txt denylist.txt; do
                  cp "$snap/$f" "$MODULE_DIR/proxy/$f"
                done
                grep -q "PORT=9090" "$MODULE_DIR/proxy/webui.conf" \
                  || fail "Re-application did not restore original content"
                pass ".recovery_snapshot roundtrip restored all files"
                ;;

              L7-03)
                sudo mkdir -p /data/adb
                sudo touch /data/adb/dnscrypt-recovery
                [ -f /data/adb/dnscrypt-recovery ] || fail "Trigger not created"
                rm -f /data/adb/dnscrypt-recovery
                assert_file_missing /data/adb/dnscrypt-recovery
                pass "External recovery trigger cleaned up"
                ;;

              # ═══════════════════════════════════════════════
              # L8 — Config migrations
              # ═══════════════════════════════════════════════
              L8-01)
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                if ! grep -q '^MEMORY_LIMIT_HINT=' "$MODULE_DIR/proxy/webui.conf"; then
                  echo "" >> "$MODULE_DIR/proxy/webui.conf"
                  echo "# v1.2.0 addition" >> "$MODULE_DIR/proxy/webui.conf"
                  echo "MEMORY_LIMIT_HINT=auto" >> "$MODULE_DIR/proxy/webui.conf"
                fi
                grep -q '^MEMORY_LIMIT_HINT=auto' "$MODULE_DIR/proxy/webui.conf" \
                  || fail "MEMORY_LIMIT_HINT not added"
                pass "v1.0.0 → v1.2.0 migration adds MEMORY_LIMIT_HINT"
                ;;

              L8-02)
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                local before
                before=$(cat "$MODULE_DIR/proxy/webui.conf")
                local after
                after=$(cat "$MODULE_DIR/proxy/webui.conf")
                assert_eq "$before" "$after"
                pass "Unknown source version: no changes applied"
                ;;

              # ═══════════════════════════════════════════════
              # L9 — Auto-backup + rotation
              # ═══════════════════════════════════════════════
              # L9-02 and L9-03 seed an apk/ subfolder — the
              # companion APK mirror. The rotation MUST ignore it:
              #   (a) ROT-MANIFEST: no `.manifest.json` → not a
              #       snapshot.
              #   (b) Explicit `case` skip in rotate_backups().
              L9-01)
                reset_backup
                reset_module_proxy
                seed_user_files "$MODULE_DIR/proxy"
                load_functions
                touch "$BACKUP_DIR/.last_auto_backup"
                auto_backup_if_needed 86400
                local snap_count
                snap_count=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '*-auto-*' | wc -l)
                assert_eq "0" "$snap_count"
                pass "auto_backup_if_needed skipped (marker recent)"
                ;;

              L9-02)
                reset_backup
                # Create 30 snapshot directories, each with a valid
                # name (YYYYMMDD-HHMMSS-v<digit>) AND a
                # `.manifest.json` file. Both are required:
                #   • The manifest satisfies the SNAP-MANIFEST
                #     detection rule used by rotate_backups.
                #   • The name satisfies the ROT-PROTECT "newest
                #     install" pattern (`-v<digit>`).
                for i in $(seq -w 1 30); do
                  local ts="20260901-0000${i}"
                  mkdir -p "$BACKUP_DIR/${ts}-v1.2.0-100"
                  echo '{}' > "$BACKUP_DIR/${ts}-v1.2.0-100/.manifest.json"
                done
                # Also seed an apk/ subfolder — must NOT be
                # counted by rotate_backups.
                mkdir -p "$BACKUP_DIR/apk"
                echo "fake apk"  > "$BACKUP_DIR/apk/app-debug.apk"
                echo "deadbeef"  > "$BACKUP_DIR/apk/app-debug.apk.sha256"
                load_functions
                rotate_backups 21
                local remaining
                remaining=$(find "$BACKUP_DIR" -maxdepth 1 -type d -name '20*' | wc -l)
                assert_eq "21" "$remaining"
                # The apk/ subfolder must survive the rotation.
                assert_dir_exists  "$BACKUP_DIR/apk"
                assert_file_exists "$BACKUP_DIR/apk/app-debug.apk"
                assert_file_exists "$BACKUP_DIR/apk/app-debug.apk.sha256"
                pass "rotate_backups kept exactly 21 snapshots; apk/ untouched"
                ;;

              L9-03)
                reset_backup
                mkdir -p "$BACKUP_DIR/current"
                touch "$BACKUP_DIR/.last_stable"
                touch "$BACKUP_DIR/README.md"
                touch "$BACKUP_DIR/.upgrade_history.json"
                for i in $(seq -w 1 30); do
                  local ts="20260901-0000${i}"
                  mkdir -p "$BACKUP_DIR/${ts}-v1.2.0-100"
                  echo '{}' > "$BACKUP_DIR/${ts}-v1.2.0-100/.manifest.json"
                done
                mkdir -p "$BACKUP_DIR/apk"
                echo "fake apk"  > "$BACKUP_DIR/apk/app-debug.apk"
                echo "deadbeef"  > "$BACKUP_DIR/apk/app-debug.apk.sha256"
                load_functions
                rotate_backups 21
                assert_dir_exists "$BACKUP_DIR/current"
                assert_file_exists "$BACKUP_DIR/.last_stable"
                assert_file_exists "$BACKUP_DIR/README.md"
                assert_file_exists "$BACKUP_DIR/.upgrade_history.json"
                # The apk/ mirror is preserved alongside current/
                # and the metadata files.
                assert_dir_exists  "$BACKUP_DIR/apk"
                assert_file_exists "$BACKUP_DIR/apk/app-debug.apk"
                assert_file_exists "$BACKUP_DIR/apk/app-debug.apk.sha256"
                pass "Rotation preserves current/, metadata, and apk/"
                ;;

              *)
                fail "Unknown scenario: $scenario"
                ;;
            esac
          }

          echo "::group::Scenario $SCENARIO"
          run_scenario "$SCENARIO"
          echo "::endgroup::"
          echo ""
          echo "✅ Scenario $SCENARIO passed"
          RUN_SCENARIO_EOF

          chmod +x /tmp/run-scenario.sh
          /tmp/run-scenario.sh

  # ============================================================
  # [2] Summary job
  # ============================================================
  # Runs regardless of the matrix outcome so branch protection
  # can rely on a single, stable status check.
  # ============================================================
  summary:
    name: Test Summary
    needs: scenarios
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Report matrix outcome
        run: |
          set -euo pipefail
          result="${{ needs.scenarios.result }}"
          case "$result" in
            success)
              echo "✅ All 42 data-preservation scenarios passed."
              ;;
            failure)
              echo "❌ One or more scenarios failed."
              echo "   See the individual job logs above."
              exit 1
              ;;
            cancelled)
              echo "⚠️  The matrix was cancelled."
              exit 1
              ;;
            *)
              echo "❌ Unexpected matrix result: $result"
              exit 1
              ;;
          esac
