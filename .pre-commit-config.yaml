# ============================================================
# Pre-commit Configuration for DNSCrypt Smart Filter
# Version: v1.2.0 (Global Edition)
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Purpose:
#   Runs automated checks before each commit to catch common
#   issues early (formatting, syntax, merge conflicts, shell
#   linting, docs presence, etc.).
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Manual run:
#   pre-commit run --all-files
#
# Skip a specific hook (temporarily):
#   SKIP=<hook-id> git commit -m "..."
#
# Examples:
#   SKIP=go-build-proxy git commit -m "wip"
#   SKIP=shellcheck git commit -m "wip"
#   SKIP=trailing-whitespace,end-of-file-fixer git commit -m "wip"
#
# Hooks included:
#
#   ─── pre-commit-hooks (official) — 9 hooks ───
#     • trailing-whitespace           — removes trailing whitespace
#     • end-of-file-fixer             — ensures a final newline
#     • check-yaml                    — validates YAML syntax
#     • check-json                    — validates JSON syntax
#     • check-toml                    — validates TOML syntax
#     • check-merge-conflict          — detects leftover <<<<<<< markers
#     • check-added-large-files       — rejects files > 500 KB
#     • mixed-line-ending             — normalizes to LF
#     • check-executables-have-shebangs — validates shell script shebangs
#
#   ─── shellcheck-py — 1 hook ───
#     • shellcheck                    — lints all shell scripts
#
#   ─── pre-commit-golang — 1 hook ───
#     • go-fmt                        — formats Go source
#
#   ─── local hooks — 2 hooks ───
#     • go-build-proxy                — compiles the Go package
#                                       (migrated from remote in v1.2.0)
#     • check-v120-docs               — verifies v1.2.0 documentation
#                                       (BACKUP.md, EMERGENCY.md, UPGRADE.md)
#
# ============================================================
# v1.1.0 notes (kept):
#   • Added the `shellcheck-py` hook. In v1.0.0, ShellCheck ran
#     only in CI (ci.yml), which meant contributors found issues
#     late. The hook now runs locally before each commit.
#   • `check-json` now excludes `.secrets.baseline` — the file
#     is generated by detect-secrets with its own formatting.
#   • `go-build` documented its `pass_filenames: false` and
#     `files` filter — the combination ensures the build runs
#     once per commit (not per file), only when `.go` files
#     changed.
#   • The hook list was reformatted with box-drawing headers
#     for consistency with the rest of the codebase.
#
# ============================================================
# v1.2.0 changes:
#   • Version bumped from v1.1.0 to v1.2.0.
#
#   • 🔧 FIX — `go-build` migrated from a remote hook
#     (pre-commit-golang) to a LOCAL hook (repo: local).
#
#     Previous setup (v1.1.0):
#
#       - repo: https://github.com/dnephin/pre-commit-golang
#         hooks:
#           - id: go-build
#             files: ^proxy/.*\.go$
#             pass_filenames: false
#             entry: bash -c 'cd proxy && go build ./...'
#
#     Problem:
#       The `entry` override for a remote hook depends on the
#       exact behavior of pre-commit's hook runner AND on how
#       the remote hook is defined. Across pre-commit versions
#       (3.5 → 3.7 → ...), this can silently fail or run in an
#       unexpected working directory. The failure mode is a
#       cryptic "go.mod file not found" error, with no clear
#       indication that the entry override was ignored.
#
#     Fix:
#       Move `go-build` to a local hook with `language: system`.
#       A local hook is fully explicit — pre-commit runs the
#       `entry` command in the repository root, and the `cd
#       proxy` inside the entry is guaranteed to work.
#
#     Result:
#       Reliable compilation check on every commit that touches
#       a `.go` file, with identical behavior across all
#       pre-commit versions >= 3.5.0.
#
#   • NEW — `check-v120-docs` local hook:
#       Verifies that the three v1.2.0 data-preservation
#       documentation files exist in the repository:
#         - docs/BACKUP.md       (backup system reference)
#         - docs/EMERGENCY.md    (emergency recovery guide)
#         - docs/UPGRADE.md      (version upgrade guide)
#
#       Rationale:
#         These files are critical for users who need to recover
#         from a data-loss scenario. Their accidental deletion
#         would break:
#           - The `make check-docs` target (in the Makefile).
#           - The `backup-smoke-test` job in ci.yml.
#           - The Data Guardian badge criteria (HALL_OF_FAME.md).
#
#       The hook runs on every commit (always_run: true) and is
#       fast (three file existence checks, < 5 ms).
#
#   • Cross-reference added to `.github/workflows/upgrade-test.yml`
#     (the 42-scenario data-preservation matrix introduced in
#     v1.2.0). It is covered by the existing `check-yaml` hook.
#
#   • No new remote hook was added. The v1.2.0 release is a
#     data-preservation release; all new logic lives inside
#     existing shell scripts (customize.sh, functions.sh,
#     service.sh, status.sh, uninstall.sh) and existing sections
#     of main.go. These files are already covered by:
#       - shellcheck    (shell scripts)
#       - go-fmt        (Go source)
#       - go-build-proxy (Go compilation)
#
#   • Global English edition: all comments are English-only.
#     No Arabic strings exist in this file.
#
# ============================================================
# Complementary validation layers (v1.2.0)
# ============================================================
# Pre-commit hooks are the fastest layer of validation, but
# they are not the only one. The following layers complement
# them, and each one covers a different concern:
#
#   ┌───┬─────────────────────────┬─────────────────────────┐
#   │ # │ Layer                   │ Coverage                │
#   ├───┼─────────────────────────┼─────────────────────────┤
#   │ 1 │ pre-commit hooks        │ Formatting, syntax,     │
#   │   │ (this file)             │ shebangs, large files,  │
#   │   │                         │ shellcheck, go-fmt,     │
#   │   │                         │ go-build, docs presence │
#   ├───┼─────────────────────────┼─────────────────────────┤
#   │ 2 │ make check-backup       │ Backup shell functions: │
#   │   │                         │ bash -n + shellcheck    │
#   ├───┼─────────────────────────┼─────────────────────────┤
#   │ 3 │ make check-docs         │ v1.2.0 documentation    │
#   │   │                         │ presence (redundant     │
#   │   │                         │ with hook #2 above,     │
#   │   │                         │ but explicit for CI)    │
#   ├───┼─────────────────────────┼─────────────────────────┤
#   │ 4 │ make check-all          │ All of (2) + (3) +      │
#   │   │                         │ bash -n + shellcheck +  │
#   │   │                         │ gofmt                   │
#   ├───┼─────────────────────────┼─────────────────────────┤
#   │ 5 │ ci.yml (push/PR)        │ (1) + (2) + (3) on      │
#   │   │                         │ Ubuntu, plus the        │
#   │   │                         │ backup-smoke-test job   │
#   ├───┼─────────────────────────┼─────────────────────────┤
#   │ 6 │ upgrade-test.yml        │ 42-scenario matrix      │
#   │   │ (manual + scheduled)    │ across 3 root solutions │
#   │   │                         │ × 2 source versions ×   │
#   │   │                         │ 7 scenarios             │
#   └───┴─────────────────────────┴─────────────────────────┘
#
# Cross-references (v1.2.0):
#   • Makefile            — `make check-backup`, `make check-all`,
#                           `make check-docs`, `make package`
#   • .github/workflows/ci.yml — `backup-smoke-test` job
#   • .github/workflows/upgrade-test.yml — 42-scenario matrix
#   • docs/BACKUP.md      — backup system reference
#   • docs/EMERGENCY.md   — emergency recovery guide
#   • docs/UPGRADE.md §3.1 — v1.1.0 → v1.2.0 upgrade path
# ============================================================

minimum_pre_commit_version: '3.5.0'

repos:
  # ============================================================
  # [1] Official pre-commit hooks
  # ============================================================
  # Repository: https://github.com/pre-commit/pre-commit-hooks
  #
  # These hooks are language-agnostic and cover the most common
  # file hygiene issues. All of them apply to every text file
  # unless a `files:` filter is specified.
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # --- [1.1] Whitespace and newlines ---
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '\.(svg|json)$'
        # SVG: rendered content, trailing whitespace is harmless
        #      and may be inside <text> nodes.
        # JSON: some tools preserve trailing whitespace in string
        #       values; auto-fixing could corrupt the file.

      # --- [1.2] Syntax validation ---
      - id: check-yaml
        args: ['--allow-multiple-documents', '--unsafe']
        # --allow-multiple-documents:
        #     Required if a workflow ever uses multi-doc syntax.
        # --unsafe:
        #     Required for GitHub Actions YAML because the
        #     default loader rejects the `on:` key (it is
        #     interpreted as a boolean `True` by PyYAML).
        #
        # v1.2.0 note: this hook covers .github/workflows/
        # upgrade-test.yml (the 42-scenario data-preservation
        # matrix) automatically.

      - id: check-json
        exclude: '^\.secrets\.baseline$'
        # .secrets.baseline is generated by detect-secrets with
        # its own formatting (sorted keys, specific indentation,
        # optional trailing whitespace inside strings).
        # check-json would report false positives.

      - id: check-toml
        # Validates proxy/dnscrypt-proxy.toml and any other .toml.

      # --- [1.3] Merge safety ---
      - id: check-merge-conflict
        # Detects leftover <<<<<<< / ======= / >>>>>>> markers.

      # --- [1.4] File size guard ---
      - id: check-added-large-files
        args: ['--maxkb=500']
        # Prevents accidentally committing a large binary.
        # The WebUI binaries (~8 MB) are already in .gitignore,
        # so this limit only guards against accidental additions.

      # --- [1.5] Line endings ---
      - id: mixed-line-ending
        args: ['--fix=lf']
        # Enforces LF everywhere (see .gitattributes).
        # --fix=lf makes the hook auto-fix instead of failing.

      # --- [1.6] Shebang validation ---
      - id: check-executables-have-shebangs
        # All .sh files in proxy/ and scripts/ must have a
        # shebang (#!/system/bin/sh or #!/usr/bin/env bash).
        # The module ships these to Android, where a missing
        # shebang breaks execution.

  # ============================================================
  # [2] ShellCheck (Python distribution)
  # ============================================================
  # Repository: https://github.com/shellcheck-py/shellcheck-py
  #
  # Why a Python distribution?
  #   The hook bundles a pre-compiled shellcheck binary, so
  #   contributors do not need to `apt install shellcheck`
  #   locally. This makes `pre-commit run --all-files` work
  #   out of the box on any platform.
  #
  # Coverage:
  #   • proxy/*.sh      — module shell scripts
  #   • scripts/*.sh    — build / release scripts
  #
  # v1.2.0 note:
  #   The v1.2.0 data-preservation layers are implemented
  #   inside the following shell scripts:
  #     - proxy/customize.sh   (Layers 1–8)
  #     - proxy/functions.sh   (backup helpers)
  #     - proxy/service.sh     (Layer 9 — periodic auto-backup)
  #     - proxy/status.sh      (Layer 10 — --diagnose)
  #     - proxy/uninstall.sh   (cleanup + orphan txn preservation)
  #
  #   All of these files are covered by this hook. No
  #   additional pre-commit configuration is required.
  #
  #   For a focused validation of the backup shell functions,
  #   use:
  #       make check-backup
  #   This is also what the `backup-smoke-test` job in ci.yml
  #   runs on every push / PR.
  #
  # Severity:
  #   Default is 'warning'. Matches the CI configuration in
  #   .github/workflows/ci.yml so local and remote checks agree.
  # ============================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # ============================================================
  # [3] Go formatting (remote hook)
  # ============================================================
  # Repository: https://github.com/dnephin/pre-commit-golang
  #
  # Only `go-fmt` is kept here — `go-build` was migrated to a
  # local hook (see [4] below) to guarantee the `cd proxy`
  # behavior across all pre-commit versions.
  #
  # v1.2.0 note:
  #   The v1.2.0 additions to main.go (createAutoBackup,
  #   checkPendingNotifications, cleanupOldTransactions,
  #   buildBackupInfo extension) use only the Go standard
  #   library. No new imports were added, so go.mod is
  #   unchanged from v1.1.0.
  #
  # Note: golangci-lint is NOT wired here. It runs in CI
  # (.github/workflows/ci.yml) and is available in the
  # devcontainer (.devcontainer/setup.sh). Running it as a
  # pre-commit hook would slow down every commit for no gain.
  # ============================================================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^proxy/.*\.go$
        # Applies only to Go files under proxy/.
        # `gofmt` is idempotent and fast.

  # ============================================================
  # [4] Local hooks (v1.2.0)
  # ============================================================
  # Local hooks are defined inline in this file and use
  # `language: system` — the command runs in the repository
  # root with the standard shell. This is the most portable
  # way to run project-specific checks.
  #
  # Two hooks are defined here:
  #
  #   • go-build-proxy
  #       Compiles the Go package to catch syntax and type
  #       errors before they reach CI. Migrated from
  #       pre-commit-golang in v1.2.0 to guarantee the `cd proxy`
  #       behavior (see the header for the full rationale).
  #
  #   • check-v120-docs
  #       Verifies the presence of the three v1.2.0
  #       data-preservation documentation files. Runs on every
  #       commit — very fast (< 5 ms).
  # ============================================================
  - repo: local
    hooks:
      # --- [4.1] Go compilation ---
      - id: go-build-proxy
        name: go build (proxy module)
        description: Compile the Go package under proxy/ to catch syntax and type errors early.
        entry: bash -c 'cd proxy && go build ./...'
        language: system
        files: ^proxy/.*\.go$
        pass_filenames: false
        # pass_filenames: false — the build runs once for the
        # whole package, not once per file. With the `files`
        # filter, the hook fires only when at least one .go file
        # changed.
        #
        # The entry runs `go build ./...` from the proxy/
        # directory, matching the CI command exactly.
        #
        # v1.2.0: migrated from pre-commit-golang (remote) to
        # a local hook. See the header for the rationale.

      # --- [4.2] v1.2.0 documentation presence ---
      - id: check-v120-docs
        name: check v1.2.0 docs (BACKUP, EMERGENCY, UPGRADE)
        description: Verify that the three v1.2.0 data-preservation documentation files exist.
        entry: >-
          bash -c '
            missing=0;
            for f in docs/BACKUP.md docs/EMERGENCY.md docs/UPGRADE.md; do
              if [ ! -f "$f" ]; then
                echo "Missing required v1.2.0 doc: $f";
                missing=$((missing + 1));
              fi;
            done;
            if [ "$missing" -gt 0 ]; then
              exit 1;
            fi
          '
        language: system
        pass_filenames: false
        always_run: true
        # always_run: true — this hook runs on every commit,
        # regardless of which files changed. It is fast
        # (three file existence checks, < 5 ms).
        #
        # Rationale:
        #   The three v1.2.0 documentation files are critical
        #   for users who need to recover from a data-loss
        #   scenario. Their accidental deletion would break:
        #     - The `make check-docs` target.
        #     - The `backup-smoke-test` job in ci.yml.
        #     - The Data Guardian badge criteria in HALL_OF_FAME.md.
        #
        #   Running this hook on every commit ensures that any
        #   accidental deletion is caught before it reaches CI.

# ============================================================
# v1.2.0 — Complementary validation layers (reference)
# ============================================================
# For a typical contribution:
#
#   1. Edit a shell script (e.g. proxy/customize.sh).
#   2. `git commit` → pre-commit runs the hooks in [1]–[4].
#   3. If any hook fails, fix the issue and re-commit.
#   4. Push → CI runs the full validation matrix.
#
# To run all pre-commit hooks manually:
#
#   pre-commit run --all-files
#
# To run the project-specific validation targets:
#
#   make check-backup    # backup shell functions
#   make check-docs      # v1.2.0 documentation
#   make check-all       # all of the above + shellcheck + gofmt
#
# If a hook is too strict for a specific commit (rare), skip
# it explicitly:
#
#   SKIP=go-build-proxy git commit -m "wip: temporary fix"
#
# But remember: the same check will run in CI, so the commit
# will not pass CI until the issue is fixed.
# ============================================================