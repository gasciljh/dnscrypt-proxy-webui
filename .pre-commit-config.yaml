# ============================================================
# Pre-commit Configuration for DNSCrypt Smart Filter
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-15
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Purpose:
#   Runs automated checks before each commit to catch common
#   issues early (formatting, syntax, merge conflicts, shell
#   linting, docs presence).
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Manual run:
#   pre-commit run --all-files
#
# Skip a hook (temporarily):
#   SKIP=<hook-id> git commit -m "..."
#
# Hooks:
#   [1] Official pre-commit-hooks           — 9 hooks
#   [2] shellcheck-py                       — 1 hook
#   [3] pre-commit-golang (go-fmt only)     — 1 hook
#   [4] Local hooks (repo: local)           — 4 hooks
# ============================================================

minimum_pre_commit_version: '3.5.0'

repos:
  # ============================================================
  # [1] Official pre-commit hooks
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # --- Whitespace and newlines ---
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '\.(svg|json|apk)$'

      # --- Syntax validation ---
      - id: check-yaml
        args: ['--allow-multiple-documents', '--unsafe']
      - id: check-json
        exclude: '^\.secrets\.baseline$'
      - id: check-toml

      # --- Merge safety ---
      - id: check-merge-conflict

      # --- File size guard (500 KB) ---
      # Companion APK (~3 MB) is excluded by .gitignore §[20];
      # this hook is a second safety net.
      - id: check-added-large-files
        args: ['--maxkb=500']

      # --- Line endings ---
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '\.(apk|png|ico)$'

      # --- Shebang validation ---
      - id: check-executables-have-shebangs

  # ============================================================
  # [2] ShellCheck (system binary)
  # ============================================================
  # Uses the system `shellcheck` instead of shellcheck-py.
  # Rationale: shellcheck-py does not ship binaries for
  # android/aarch64, so it cannot be installed on Termux.
  # The system binary is available via `pkg install shellcheck`
  # (currently v0.11.0 on Termux).
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck --severity=warning
        language: system
        types: [shell]

  # ============================================================
  # [3] Go formatting
  # ============================================================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^proxy/.*\.go$

  # ============================================================
  # [4] Local hooks
  # ============================================================
  - repo: local
    hooks:
      # --- [4.1] Go compilation ---
      - id: go-build-proxy
        name: go build (proxy module)
        description: Compile the Go package under proxy/ to catch syntax and type errors early.
        entry: bash -c 'cd proxy && go build ./...'
        language: system
        files: ^proxy/.*\.go$
        pass_filenames: false

      # --- [4.2] v1.2.0 documentation presence ---
      - id: check-v120-docs
        name: check v1.2.0 docs (BACKUP, EMERGENCY, UPGRADE)
        description: Verify that the three v1.2.0 data-preservation documentation files exist.
        entry: >-
          bash -c '
            missing=0;
            for f in docs/BACKUP.md docs/EMERGENCY.md docs/UPGRADE.md; do
              if [ ! -f "$f" ]; then
                echo "Missing required v1.2.0 doc: $f";
                missing=$((missing + 1));
              fi;
            done;
            if [ "$missing" -gt 0 ]; then
              exit 1;
            fi
          '
        language: system
        pass_filenames: false
        always_run: true

      # --- [4.3] v1.4.0 companion APK files presence + format ---
      - id: check-v140-apk
        name: check v1.4.0 companion APK files
        description: Verify the presence of the v1.4.0 companion app files and validate the version format.
        entry: >-
          bash -c '
            missing=0;
            for f in scripts/fetch_app_apk.sh proxy/app-apk.version; do
              if [ ! -f "$f" ]; then
                echo "Missing required v1.4.0 file: $f";
                missing=$((missing + 1));
              fi;
            done;
            if [ "$missing" -gt 0 ]; then
              exit 1;
            fi;
            APP_V=$(tr -d "\r\n" < proxy/app-apk.version | sed "s/^[[:space:]]*//;s/[[:space:]]*$//");
            if ! printf "%s" "$APP_V" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then
              echo "Invalid proxy/app-apk.version format: $APP_V";
              echo "Expected: X.Y.Z (e.g. 1.0.0)";
              exit 1;
            fi
          '
        language: system
        pass_filenames: false
        always_run: true

      # --- [4.4] v1.5.0 Layered Bootstrap files presence ---
      - id: check-v150-boot-mini
        name: check v1.5.0 Layered Bootstrap
        description: Verify boot-mini.sh and install_app.sh exist and contain the expected markers.
        entry: >-
          bash -c '
            missing=0;
            for f in proxy/boot-mini.sh proxy/install_app.sh; do
              if [ ! -f "$f" ]; then
                echo "Missing required v1.5.0 file: $f";
                missing=$((missing + 1));
              fi;
            done;
            if [ "$missing" -gt 0 ]; then
              exit 1;
            fi
          '
        language: system
        pass_filenames: false
        always_run: true
