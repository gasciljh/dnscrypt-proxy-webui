#     ROT-MTIME, ROT-PROTECT — see docs/ARCHITECTURE.md §4.13).
#
#   Why NO new hook was required for v1.3.0:
#     • The PWA install button and live status LED live in
#       `web/index.html`, which is not linted by pre-commit
#       hooks directly (no HTML linter is wired).
#     • The DNS auto-start fix lives in `proxy/service.sh`,
#       which is already covered by the `shellcheck` hook
#       (it matches `proxy/*.sh`).
#     • The server-side rotation refinements live in
#       `proxy/main.go` (Go, covered by `go-fmt` +
#       `go-build-proxy`) and in `proxy/functions.sh`,
#       `proxy/service.sh`, `proxy/status.sh`,
#       `proxy/watchdog.sh`, `proxy/customize.sh`,
#       `proxy/action.sh`, `proxy/uninstall.sh` (shell, all
#       covered by `shellcheck`).
#     • The rotation semantics are verified by CI
#       (`backup-smoke-test` in ci.yml) and by
#       `make check-backup`, NOT by a pre-commit hook.
#       The pre-commit layer is a fast, local sanity check;
#       it does not attempt to verify semantic invariants
#       across multiple files.
#     • Therefore the entire YAML body is byte-for-byte
#       identical between v1.2.0 and v1.3.0.
