# ============================================================
# DNSCrypt Smart Filter — Pre-commit Configuration
# Version: v1.6.0 (Global Edition)
# Last updated: 2026-11-13
# ============================================================
# Runs automated checks before each commit.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
#
# Skip a hook for one commit:
#   SKIP=<hook-id> git commit -m "..."
#
# Project-specific hooks delegate to Makefile targets so that
# there is exactly one source of truth for each validation.
# ============================================================

minimum_pre_commit_version: '3.5.0'

repos:
  # ────────────────────────────────────────────────────────────
  # [1] Standard hooks
  # ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '\.(svg|json|apk)$'
      - id: check-yaml
        args: ['--allow-multiple-documents', '--unsafe']
      - id: check-json
        exclude: '^\.secrets\.baseline$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '\.(apk|png|ico)$'
      - id: check-executables-have-shebangs

  # ────────────────────────────────────────────────────────────
  # [2] ShellCheck (includes lib/*.sh automatically)
  # ────────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # ────────────────────────────────────────────────────────────
  # [3] Go formatting
  # ────────────────────────────────────────────────────────────
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^proxy/.*\.go$

  # ────────────────────────────────────────────────────────────
  # [4] Project-specific hooks (delegated to Makefile)
  # ────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: go-build-proxy
        name: go build (proxy module)
        entry: bash -c 'cd proxy && go build ./...'
        language: system
        files: ^proxy/.*\.go$
        pass_filenames: false

      - id: check-docs
        name: docs consistency (presence + absence + ADRs)
        entry: make check-docs check-adr
        language: system
        pass_filenames: false
        always_run: true

      - id: check-apk
        name: companion APK version + install script
        entry: make check-app-version check-install-app
        language: system
        pass_filenames: false
        always_run: true

      - id: check-boot-mini
        name: Layered Bootstrap (lib/ + boot-mini + functions)
        entry: make check-boot-mini
        language: system
        pass_filenames: false
        always_run: true

      - id: check-consistency
        name: consistency sweep (no proxy/*.sh refs, correct boot-mini section)
        entry: make check-consistency
        language: system
        pass_filenames: false
        always_run: true