minimum_pre_commit_version: '3.5.0'

repos:
  # ============================================================
  # [1] Official pre-commit hooks
  # ============================================================
  # Repository: https://github.com/pre-commit/pre-commit-hooks
  #
  # These hooks are language-agnostic and cover the most common
  # file hygiene issues. All of them apply to every text file
  # unless a `files:` filter is specified.
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # --- [1.1] Whitespace and newlines ---
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '\.(svg|json|apk)$'
        # SVG: rendered content, trailing whitespace is harmless
        #      and may be inside <text> nodes.
        # JSON: some tools preserve trailing whitespace in string
        #       values; auto-fixing could corrupt the file.
        # APK (v1.4.0): binary Android package — the fixer would
        #      corrupt it if it ever touched it.

      # --- [1.2] Syntax validation ---
      - id: check-yaml
        args: ['--allow-multiple-documents', '--unsafe']
        # --allow-multiple-documents:
        #     Required if a workflow ever uses multi-doc syntax.
        # --unsafe:
        #     Required for GitHub Actions YAML because the
        #     default loader rejects the `on:` key.

      - id: check-json
        exclude: '^\.secrets\.baseline$'
        # .secrets.baseline is generated by detect-secrets with
        # its own formatting.

      - id: check-toml
        # Validates proxy/dnscrypt-proxy.toml and any other .toml.

      # --- [1.3] Merge safety ---
      - id: check-merge-conflict

      # --- [1.4] File size guard ---
      - id: check-added-large-files
        args: ['--maxkb=500']
        # Prevents accidentally committing a large binary.
        # Note (v1.4.0): the companion APK is typically ~3 MB,
        # which exceeds this limit. The APK is EXCLUDED by
        # .gitignore (§[20]), so it never reaches this hook.
        # If the .gitignore rule ever regresses, this hook is
        # a second safety net.

      # --- [1.5] Line endings ---
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '\.(apk|png|ico)$'
        # Binary files (v1.4.0): the APK must not have line
        # endings converted — that would corrupt the archive.

      # --- [1.6] Shebang validation ---
      - id: check-executables-have-shebangs
        # All .sh files in proxy/ and scripts/ must have a
        # shebang. This includes the v1.4.0
        # `scripts/fetch_app_apk.sh`.

  # ============================================================
  # [2] ShellCheck (Python distribution)
  # ============================================================
  # Repository: https://github.com/shellcheck-py/shellcheck-py
  #
  # Why a Python distribution?
  #   The hook bundles a pre-compiled shellcheck binary, so
  #   contributors do not need to `apt install shellcheck`
  #   locally.
  #
  # v1.3.0 note: `proxy/service.sh` (§[19] DNS auto-start) and
  #   `proxy/functions.sh` (`rotate_backups` ROT-* semantics)
  #   are both covered automatically by this hook — no config
  #   change was needed for the v1.3.0 server-side refinements.
  #
  # v1.4.0 note: `scripts/fetch_app_apk.sh` (new in v1.4.0) is
  #   covered automatically by this hook (it matches `scripts/*.sh`).
  #
  # Severity:
  #   Default is 'warning'. Matches the CI configuration.
  # ============================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # ============================================================
  # [3] Go formatting (remote hook)
  # ============================================================
  # Repository: https://github.com/dnephin/pre-commit-golang
  #
  # Only `go-fmt` is kept here — `go-build` was migrated to a
  # local hook (see [4] below) to guarantee the `cd proxy`
  # behavior across all pre-commit versions.
  #
  # Note: golangci-lint is NOT wired here. It runs in CI
  # (.github/workflows/ci.yml) and is available in the
  # devcontainer (.devcontainer/setup.sh).
  #
  # v1.3.0 note: `proxy/main.go` was modified in v1.3.0
  #   (`buildBackupInfo` — SNAP-MANIFEST + SNAP-MTIME) and in
  #   v1.4.0 (`removeModule` — CodeQL fix). Both changes are
  #   covered automatically by `go-fmt` + `go-build-proxy`.
  # ============================================================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^proxy/.*\.go$
        # Applies only to Go files under proxy/.
        # `gofmt` is idempotent and fast.

  # ============================================================
  # [4] Local hooks
  # ============================================================
  # Local hooks are defined inline in this file and use
  # `language: system` — the command runs in the repository
  # root with the standard shell.
  #
  # Three hooks are defined here:
  #
  #   • go-build-proxy       (v1.2.0)
  #       Compiles the Go package to catch syntax and type
  #       errors before they reach CI.
  #
  #   • check-v120-docs      (v1.2.0)
  #       Verifies the presence of the three v1.2.0
  #       data-preservation documentation files.
  #
  #   • check-v140-apk       (v1.4.0 — new)
  #       Verifies the presence of the v1.4.0 companion app
  #       files and validates the version format.
  # ============================================================
  - repo: local
    hooks:
      # --- [4.1] Go compilation (v1.2.0) ---
      - id: go-build-proxy
        name: go build (proxy module)
        description: Compile the Go package under proxy/ to catch syntax and type errors early.
        entry: bash -c 'cd proxy && go build ./...'
        language: system
        files: ^proxy/.*\.go$
        pass_filenames: false
        # pass_filenames: false — the build runs once for the
        # whole package, not once per file. With the `files`
        # filter, the hook fires only when at least one .go file
        # changed.

      # --- [4.2] v1.2.0 documentation presence ---
      - id: check-v120-docs
        name: check v1.2.0 docs (BACKUP, EMERGENCY, UPGRADE)
        description: Verify that the three v1.2.0 data-preservation documentation files exist.
        entry: >-
          bash -c '
            missing=0;
            for f in docs/BACKUP.md docs/EMERGENCY.md docs/UPGRADE.md; do
              if [ ! -f "$f" ]; then
                echo "Missing required v1.2.0 doc: $f";
                missing=$((missing + 1));
              fi;
            done;
            if [ "$missing" -gt 0 ]; then
              exit 1;
            fi
          '
        language: system
        pass_filenames: false
        always_run: true
        # always_run: true — this hook runs on every commit,
        # regardless of which files changed. It is fast.

      # --- [4.3] v1.4.0 companion APK files presence + format ---
      - id: check-v140-apk
        name: check v1.4.0 companion APK files
        description: Verify the presence of the v1.4.0 companion app files and validate the version format.
        entry: >-
          bash -c '
            missing=0;
            for f in scripts/fetch_app_apk.sh proxy/app-apk.version; do
              if [ ! -f "$f" ]; then
                echo "Missing required v1.4.0 file: $f";
                missing=$((missing + 1));
              fi;
            done;
            if [ "$missing" -gt 0 ]; then
              exit 1;
            fi;
            APP_V=$(tr -d "\r\n" < proxy/app-apk.version | sed "s/^[[:space:]]*//;s/[[:space:]]*$//");
            if ! printf "%s" "$APP_V" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then
              echo "Invalid proxy/app-apk.version format: $APP_V";
              echo "Expected: X.Y.Z (e.g. 1.0.0)";
              exit 1;
            fi
          '
        language: system
        pass_filenames: false
        always_run: true
        # always_run: true — this hook runs on every commit
        # regardless of which files changed. It is fast
        # (two file checks + one regex validation, < 5 ms).
        #
        # Rationale:
        #   The two files are critical for the v1.4.0 release
        #   pipeline. Their accidental deletion would break:
        #     - `.github/workflows/release.yml` (Fetch APK step)
        #     - `Makefile` targets `fetch-apk`, `check-app-version`
        #     - `.github/workflows/ci.yml`
        #       (`Verify companion app metadata` step)
        #
        #   Running this hook on every commit ensures that any
        #   accidental deletion or format regression is caught
        #   before it reaches CI.

# ============================================================
# Complementary validation layers (reference)
# ============================================================
# For a typical contribution:
#
#   1. Edit a file (shell, Go, docs, etc.).
#   2. `git commit` → pre-commit runs the hooks in [1]–[4].
#   3. If any hook fails, fix the issue and re-commit.
#   4. Push → CI runs the full validation matrix.
#
# To run all pre-commit hooks manually:
#
#   pre-commit run --all-files
#
# To run the project-specific validation targets:
#
#   make check-backup      # backup shell functions
#   make check-docs        # required documentation presence
#   make check-app-version # companion app version format
#   make check-all         # all of the above + shellcheck + gofmt
#
# If a hook is too strict for a specific commit (rare), skip
# it explicitly:
#
#   SKIP=go-build-proxy git commit -m "wip: temporary fix"
#
# But remember: the same check will run in CI, so the commit
# will not pass CI until the issue is fixed.
# ============================================================
# v1.3.0 rotation verification (informational)
# ============================================================
# The v1.3.0 server-side refinements (SNAP-MANIFEST, SNAP-MTIME,
# ROT-MANIFEST, ROT-MTIME, ROT-PROTECT) are NOT verified by any
# pre-commit hook. They are semantic invariants that span
# multiple files (main.go + functions.sh + 5 shell scripts).
#
# Pre-commit hooks are intentionally fast and local. Semantic
# cross-file verification is deferred to:
#
#   • `make check-backup`   — validates the shell syntax +
#                             function presence (via grep).
#                             Does NOT verify semantic
#                             consistency.
#   • `ci.yml` → `backup-smoke-test` — same scope as above,
#                             plus `bash -n` on every script.
#   • `docs/COMPATIBILITY.md` §10.3.5 — the on-device
#                             verification procedure for a
#                             real Android device. This is the
#                             only way to confirm that the
#                             rotation semantics are actually
#                             active at runtime.
#
# If a future PR introduces a lightweight, deterministic
# consistency check for the SNAP-*/ROT-* invariants, it can be
# added as a new local hook (with `pass_filenames: false` +
# `always_run: true`, or scoped to the relevant files).
# ============================================================