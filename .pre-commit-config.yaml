# ============================================================
# DNSCrypt Smart Filter — Pre-commit Configuration
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-19
# ============================================================
# Runs automated checks before each commit.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
#
# Skip a hook for one commit:
#   SKIP=<hook-id> git commit -m "..."
# ============================================================

minimum_pre_commit_version: '3.5.0'

repos:
  # ────────────────────────────────────────────────────────────
  # [1] Standard hooks
  # ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '\.(svg|json|apk)$'
      - id: check-yaml
        args: ['--allow-multiple-documents', '--unsafe']
      - id: check-json
        exclude: '^\.secrets\.baseline$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '\.(apk|png|ico)$'
      - id: check-executables-have-shebangs

  # ────────────────────────────────────────────────────────────
  # [2] ShellCheck
  # ────────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # ────────────────────────────────────────────────────────────
  # [3] Go formatting
  # ────────────────────────────────────────────────────────────
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^proxy/.*\.go$

  # ────────────────────────────────────────────────────────────
  # [4] Project-specific hooks
  # ────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      # --- [4.1] Go compilation ---
      - id: go-build-proxy
        name: go build (proxy module)
        entry: bash -c 'cd proxy && go build ./...'
        language: system
        files: ^proxy/.*\.go$
        pass_filenames: false

      # --- [4.2] Documentation consistency (per docs/MAP.md §1 + §5) ---
      # Positive: the 9 user-facing docs + 4 ADRs must exist.
      # Negative: the 26 removed docs must NOT exist.
      - id: check-docs
        name: docs consistency (presence + absence)
        entry: >-
          bash -c '
            miss=0;
            for f in docs/GUIDE.md docs/REFERENCE.md docs/CONTRIBUTING.md
                     docs/MAP.md docs/ROADMAP.md docs/adr/README.md
                     docs/adr/0001-release-workflow.md
                     docs/adr/0002-external-dependency.md
                     docs/adr/0003-layered-bootstrap.md; do
              [ -f "$f" ] || { echo "Missing doc: $f"; miss=$((miss+1)); }
            done;
            for f in docs/INSTALL.md docs/UPGRADE.md docs/TROUBLESHOOTING.md
                     docs/FAQ.md docs/EMERGENCY.md docs/API.md
                     docs/ARCHITECTURE.md docs/BACKUP.md docs/COMPATIBILITY.md
                     docs/DNS_BINARIES.md docs/MANIFEST_NOTES.md docs/GLOSSARY.md
                     docs/DEVELOPMENT.md docs/BRANCHING.md docs/RELEASE_PROCESS.md
                     docs/HALL_OF_FAME.md docs/SECURITY.md .github/SECURITY.md
                     docs/adr/0001-two-branch-model.md
                     docs/adr/0002-automated-releases.md
                     docs/adr/0003-post-release-sync.md
                     docs/adr/0004-unified-pr-template.md
                     docs/adr/0005-release-specific-pr-template.md
                     docs/adr/0006-rename-hotfix-to-release-patch.md
                     docs/adr/0007-external-dependency-securejoin.md
                     docs/adr/0008-layered-bootstrap.md
                     docs/adr/0009-documentation-budget.md; do
              [ -e "$f" ] && { echo "Must not exist: $f"; miss=$((miss+1)); }
            done;
            [ "$miss" -eq 0 ]
          '
        language: system
        pass_filenames: false
        always_run: true

      # --- [4.3] Companion APK files ---
      - id: check-apk
        name: companion APK files present and valid
        entry: >-
          bash -c '
            miss=0;
            for f in scripts/fetch_app_apk.sh proxy/app-apk.version; do
              [ -f "$f" ] || { echo "Missing: $f"; miss=$((miss+1)); }
            done;
            [ "$miss" -eq 0 ] || exit 1;
            v=$(tr -d "\r\n" < proxy/app-apk.version | sed "s/^[[:space:]]*//;s/[[:space:]]*$//");
            printf "%s" "$v" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$" || {
              echo "Invalid proxy/app-apk.version: $v"; exit 1;
            }
          '
        language: system
        pass_filenames: false
        always_run: true

      # --- [4.4] Layered Bootstrap files ---
      - id: check-boot-mini
        name: Layered Bootstrap files present
        entry: >-
          bash -c '
            miss=0;
            for f in proxy/boot-mini.sh proxy/install_app.sh; do
              [ -f "$f" ] || { echo "Missing: $f"; miss=$((miss+1)); }
            done;
            [ "$miss" -eq 0 ]
          '
        language: system
        pass_filenames: false
        always_run: true