# ============================================================
# DNSCrypt Smart Filter — dnscrypt-proxy.toml
# Version: v1.6.0 (Global Edition)
# Last updated: 2026-11-13
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Configuration for the DNSCrypt engine.
# This file is preserved across upgrades (one of the 5 user
# config files). Do NOT edit [monitoring_ui] by hand —
# credentials are generated by customize.sh at install time.
# ============================================================

# ============================================================
# [1] Listen settings
# ============================================================
# Engine listens on localhost only. Firewall redirects port 53.
listen_addresses = ['127.0.0.1:5354', '[::1]:5354']
max_clients = 250

# Ignore system DNS to avoid loops.
ignore_system_dns = true

# ============================================================
# [2] Server selection
# ============================================================
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = true
doh_servers = true
odoh_servers = false

require_dnssec = false
require_nolog = true
require_nofilter = true

disabled_server_names = []

# ============================================================
# [3] Network performance
# ============================================================
force_tcp = false

http3 = true
http3_probe = false

timeout = 5000
keepalive = 30

lb_strategy = 'wp2'
lb_estimator = true
timeout_load_reduction = 0.75

# enable_hot_reload: MUST stay false.
# main.go sends SIGHUP explicitly after every WebUI save.
enable_hot_reload = false

# ============================================================
# [4] Logging
# ============================================================
# log_level: 0=debug, 1=info, 2=notice, 3=warning, 4=error.
log_level = 2

log_file = '/data/local/tmp/dnscrypt-proxy.log'
log_file_latest = true

log_files_max_size = 6
log_files_max_age = 3
log_files_max_backups = 1

# ============================================================
# [5] Bootstrap resolvers
# ============================================================
# Used ONLY to download the server list (public-resolvers.md)
# at startup. Never used for user DNS traffic.
#
# Six IPs from three obscure, non-consumer EU providers:
#   • FDN (French Data Network)
#   • DNS.SB (Sweden)
#   • CZ.NIC ODVR (Czech)
bootstrap_resolvers = [
    '80.67.169.12:53',
    '80.67.169.40:53',
    '185.95.218.42:53',
    '185.95.218.43:53',
    '193.17.47.1:53',
    '185.43.135.1:53'
]

# netprobe: single IP probed for network readiness at startup.
netprobe_timeout = 120
netprobe_address = '9.9.9.9:53'

# ============================================================
# [6] DNSCrypt-level blocking
# ============================================================
block_ipv6 = true
block_unqualified = true
block_undelegated = true

reject_ttl = 10
blocked_query_response = 'refused'

# ============================================================
# [7] Cache
# ============================================================
cache = true
cache_size = 10240

cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

# ============================================================
# [8] DNSCrypt certificates and keys
# ============================================================
cert_refresh_delay = 240
cert_ignore_timestamp = false
dnscrypt_ephemeral_keys = false
pqdnscrypt = true
tls_disable_session_tickets = false

# ============================================================
# [9] Custom blocklists
# ============================================================
[blocked_names]
  blocked_names_file = 'blocklist.txt'
  log_file = '/data/local/tmp/dnscrypt-blocked.log'
  log_format = 'tsv'

[allowed_names]
  allowed_names_file = 'allowlist.txt'
  log_file = '/data/local/tmp/dnscrypt-allowed.log'
  log_format = 'tsv'

[blocked_ips]
  blocked_ips_file = 'blocked-ips.txt'
  log_file = '/data/local/tmp/dnscrypt-blocked-ips.log'

# ============================================================
# [10] Public blocklist sources
# ============================================================
[sources.public-resolvers]
  urls = [
    'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
    'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md',
    'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/public-resolvers.md'
  ]
  cache_file = 'public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 73
  prefix = ''

# ============================================================
# [11] Broken servers (excluded)
# ============================================================
[broken_implementations]
  fragments_blocked = [
    'cisco', 'cisco-ipv6', 'cisco-familyshield', 'cisco-familyshield-ipv6',
    'cisco-sandbox', 'cleanbrowsing-adult', 'cleanbrowsing-adult-ipv6',
    'cleanbrowsing-family', 'cleanbrowsing-family-ipv6',
    'cleanbrowsing-security', 'cleanbrowsing-security-ipv6'
  ]

# ============================================================
# [12] Query log (feeds Dashboard)
# ============================================================
[query_log]
  file = '/data/local/tmp/dnscrypt-query.log'
  format = 'tsv'

# ============================================================
# [13] Monitoring UI
# ============================================================
# Internal port 8080, reserved. Every component rejects this
# port for WebUI/Dashboard (main.go, customize.sh, functions.sh,
# action.sh, service.sh, status.sh, watchdog.sh).
#
# Credentials below are the SINGLE source for:
#   main.go, functions.sh, watchdog.sh, customize.sh
# Reading is restricted to [monitoring_ui] only.
#
# Empty values are deliberate: main.go refuses to start with
# empty credentials, forcing customize.sh to generate strong
# values before first boot.
[monitoring_ui]
  enabled = true
  listen_address = '127.0.0.1:8080'
  username = ''
  password = ''

  enable_query_log = true
  privacy_level = 1