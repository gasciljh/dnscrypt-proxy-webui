# ============================================================
# DNSCrypt Smart Filter — dnscrypt-proxy.toml
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-19
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Configuration for the DNSCrypt engine (launched by the WebUI
# via main.go's startService()).
#
# ⚠️ Two independent version numbers coexist:
#     • DNS engine version  — proxy/dnscrypt-proxy.version
#     • Module version      — VERSION
#
# ⚠️ Do not edit [monitoring_ui] manually. Credentials are
#    generated automatically by customize.sh during install.
#
# ⚠️ This file is preserved across upgrades (one of the 5 user
#    config files).
# ============================================================

# ============================================================
# [1] Listen settings
# ============================================================
# The engine listens on localhost only — the firewall (iptables
# or nftables) redirects DNS queries here.
#
# Port 5354 is bound to both 127.0.0.1 and [::1] on purpose,
# so IPv4 and IPv6 DNS queries are both served locally.
#
# ⚠️ Do not change these addresses unless you know what you are
#    doing. Changing to 0.0.0.0 exposes the engine to the
#    network.
listen_addresses = ['127.0.0.1:5354', '[::1]:5354']
max_clients = 250

# Ignore the system DNS to avoid infinite loops.
ignore_system_dns = true

# ============================================================
# [2] Server selection
# ============================================================
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = true
doh_servers = true
odoh_servers = false

# require_dnssec:
#   false = do not require DNSSEC (broader compatibility)
#   true  = require DNSSEC certificate (slower, more secure)
#
#   ⚠️ Enabling this reduces the number of available servers.
require_dnssec = false

# require_nolog / require_nofilter:
#   true = select only servers that do not log or filter.
#
#   ⚠️ true here means higher privacy — there is no reason to
#      change it.
require_nolog = true
require_nofilter = true

# disabled_server_names: exact names as they appear in
# public-resolvers.md (case-sensitive).
#
#   Example: disabled_server_names = ['cloudflare', 'google']
#
#   Leave empty to use all servers compatible with require_*.
disabled_server_names = []

# ============================================================
# [3] Network performance
# ============================================================
force_tcp = false

# http3:
#   true = enable QUIC (faster on 4G/5G networks).
#
# http3_probe:
#   false = do not probe HTTP/3 before use (faster start).
#
#   ⚠️ On Android mobile networks, UDP on port 443 may be
#      blocked, so http3_probe = false gives a better
#      experience.
http3 = true
http3_probe = false

# timeout: milliseconds. 5000 = 5 seconds.
#   • Less than 3000: may fail on slow networks.
#   • Greater than 8000: noticeable delay when a server fails.
timeout = 5000
keepalive = 30

# lb_strategy:
#   'wp2'          = Weighted Power of Two (recommended)
#   'p2'           = Power of Two
#   'ph'           = Consistent Hashing
#   'fastest'      = Always pick the fastest (may cause load
#                    concentration)
#   'random'       = Random (not recommended)
lb_strategy = 'wp2'

# lb_estimator:
#   true = dynamic estimation of response time (better
#          distribution).
lb_estimator = true

# timeout_load_reduction:
#   When a server's timeout ratio (0.0-1.0) is exceeded, the
#   engine stops sending requests to that server.
#
#   0.75 = stop sending when 75% of requests time out.
#
#   Recommended default: 0.75.
timeout_load_reduction = 0.75

# enable_hot_reload:
#   true = automatically reload blocklists when they change.
#
#   ⚠️ The WebUI uses SIGHUP instead (ensures instant updates).
enable_hot_reload = true

# ============================================================
# [4] Logging
# ============================================================
# log_level: 0 = debug, 1 = info, 2 = notice, 3 = warning,
#            4 = error.
#
# We use 2 (notice) to reduce log size while keeping important
# info.
#
# ⚠️ This is NOT the same as LOG_LEVEL in webui.conf:
#    • LOG_LEVEL (textual)  → main.go (WebUI log)
#    • log_level (numeric)  → this file (DNS engine log)
log_level = 2

log_file = '/data/local/tmp/dnscrypt-proxy.log'
log_file_latest = true

# DNSCrypt-proxy log rotation:
#   max_size    = 6 MB (file size before rotation)
#   max_age     = 3 days
#   max_backups = 1 backup copy
#
#   Values tuned for memory-constrained Android devices.
log_files_max_size = 6
log_files_max_age = 3
log_files_max_backups = 1

# ============================================================
# [5] Bootstrap resolvers
# ============================================================
# Public DNS servers used only to download the server list
# (public-resolvers.md) — after download, they are not used.
#
# ⚠️ The four IPs below are a SUBSET of the legacy cleanup list
#    used by customize.sh / post-fs-data.sh / uninstall.sh.
#    Those three scripts additionally try to remove RETURN
#    rules for three historical IPs (8.8.4.4,
#    208.67.222.222, 208.67.220.220) used by older versions.
#
#    ⚠️ If you change the list here, also update those three
#       scripts so the legacy cleanup stays in sync.
bootstrap_resolvers = ['9.9.9.9:53', '8.8.8.8:53', '1.1.1.1:53', '1.0.0.1:53']

# netprobe_timeout:
#   Seconds. Maximum time to wait for the network before
#   starting. 120 seconds is enough for phones that boot
#   slowly (Android on 4G).
netprobe_timeout = 120
netprobe_address = '9.9.9.9:53'

# ============================================================
# [6] DNSCrypt-level blocking
# ============================================================
# block_ipv6:
#   true = reject AAAA (IPv6) requests with an immediate empty
#          reply.
#
#   ⚠️ Does not cause a timeout — returns an immediate empty
#      reply. The goal: prevent ad leakage over IPv6 that
#      might bypass the firewall.
block_ipv6 = true

# block_unqualified:
#   true = block unqualified requests (no dot), such as
#          "router". Prevents DNS leaks via NetBIOS/mDNS.
block_unqualified = true

# block_undelegated:
#   true = block undelegated domains (such as .local,
#          .localhost). Prevents DNS leaks via internal domains.
block_undelegated = true

# reject_ttl:
#   TTL for rejected replies (seconds). 10 = short for quick
#   updates.
reject_ttl = 10

# blocked_query_response:
#   'refused'   = RFC-compliant reply (recommended)
#   'hinfo'     = reply with host information
#   'a:0.0.0.0' = reply with an empty IPv4 address
#   'nxdomain'  = domain does not exist
blocked_query_response = 'refused'

# ============================================================
# [7] Cache
# ============================================================
cache = true

# cache_size: number of entries.
#
#   Recommendations by device memory:
#     1 GB RAM  → 2048
#     2 GB RAM  → 4096
#     3 GB RAM  → 6144
#     4 GB+ RAM → 10240 (default)
#
#   ⚠️ Each entry consumes roughly 200 bytes on average.
cache_size = 10240

# Cache TTL: in seconds.
#   min_ttl     = 2400 (40 minutes) — minimum for any entry
#   max_ttl     = 86400 (24 hours) — maximum
#   neg_min_ttl = 60 (1 minute) — for negative errors
#   neg_max_ttl = 600 (10 minutes) — for negative errors
cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

# ============================================================
# [8] DNSCrypt certificates and keys
# ============================================================
# cert_refresh_delay: in minutes. 240 = 4 hours (default).
cert_refresh_delay = 240

# cert_ignore_timestamp:
#   false = verify certificate validity (secure).
#   true  = ignore timestamp (use only for diagnostics).
cert_ignore_timestamp = false

# dnscrypt_ephemeral_keys:
#   false = use a fixed key per session (faster).
#   true  = new key per query (slower, more private).
dnscrypt_ephemeral_keys = false

# pqdnscrypt:
#   true = support Post-Quantum DNSCrypt (future-proof).
#   No impact on performance today.
pqdnscrypt = true

# tls_disable_session_tickets:
#   false = enable session tickets (faster).
#   true  = disable them (higher privacy, lower performance).
tls_disable_session_tickets = false

# ============================================================
# [9] Custom blocklists
# ============================================================
# Do not edit these files manually. Use the WebUI at
# http://127.0.0.1:9090 — the WebUI updates them atomically
# with conflict detection.
#
# File structure:
#   blocklist.raw → Fixed source (downloaded from the internet)
#   blocklist.txt → Final output (after applying Allow/Deny)
#                   This is what dnscrypt-proxy actually reads
#
# ⚠️ These files are preserved across upgrades.
#
# ⚠️ No trailing comment on value lines.
[blocked_names]
  blocked_names_file = 'blocklist.txt'
  log_file = '/data/local/tmp/dnscrypt-blocked.log'
  log_format = 'tsv'

[allowed_names]
  allowed_names_file = 'allowlist.txt'
  log_file = '/data/local/tmp/dnscrypt-allowed.log'
  log_format = 'tsv'

[blocked_ips]
  blocked_ips_file = 'blocked-ips.txt'
  log_file = '/data/local/tmp/dnscrypt-blocked-ips.log'

# ============================================================
# [10] Public blocklist sources
# ============================================================
[sources.public-resolvers]
  urls = [
    'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
    'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md',
    'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/public-resolvers.md'
  ]
  cache_file = 'public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 73
  prefix = ''

# ============================================================
# [11] Broken servers (excluded)
# ============================================================
# These servers do not work reliably with DNSCrypt on Android
# due to non-standard server-side implementation.
[broken_implementations]
  fragments_blocked = [
    'cisco', 'cisco-ipv6', 'cisco-familyshield', 'cisco-familyshield-ipv6',
    'cisco-sandbox', 'cleanbrowsing-adult', 'cleanbrowsing-adult-ipv6',
    'cleanbrowsing-family', 'cleanbrowsing-family-ipv6',
    'cleanbrowsing-security', 'cleanbrowsing-security-ipv6'
  ]

# ============================================================
# [12] Query log (for Dashboard)
# ============================================================
[query_log]
  file = '/data/local/tmp/dnscrypt-query.log'
  format = 'tsv'

# ============================================================
# [13] Monitoring UI (monitoring_ui)
# ============================================================
# ⚠️ This UI runs on an internal port (8080), separate from:
#   • WebUI     → 9090 (default, in webui.conf)
#   • Dashboard → 9091 (default, in webui.conf)
#
#   Do not expose this port externally — it is for local use
#   only, queried via an internal proxy in main.go.
#
# ⚠️ Port 8080 is RESERVED for monitoring_ui. Every component
#    in the project agrees on this:
#      • main.go refuses to start if PORT=8080 or
#        DASHBOARD_PORT=8080.
#      • customize.sh refuses to write such values.
#      • functions.sh rejects them in get_webui_port and
#        get_dashboard_port.
#      • action.sh, service.sh, status.sh, watchdog.sh all
#        check for 8080 before using any configured port.
#
# ⚠️ The username and password below are the sole source for:
#      • main.go        → getMonitoringAuth (section-restricted)
#      • functions.sh   → read_toml_credentials (section-restricted)
#      • watchdog.sh    → credentials reading
#      • customize.sh   → read_toml_credentials
#
#    Reading is restricted to [monitoring_ui] only — no linear
#    scan. Any other section containing username/password is
#    ignored.
#
# ------------------------------------------------------------
# Credentials:
#   Generated automatically by customize.sh.
#
#   ⚠️ Default values are empty ('') instead of admin/admin.
#   main.go refuses to enable [monitoring_ui] if values are
#   empty, and requires customize.sh to generate secure
#   credentials.
#
#   If you use this file manually without customize.sh:
#     1. Change the values below to a strong username and
#        password, OR
#     2. Leave them empty if you don't need the Dashboard.
# ============================================================
[monitoring_ui]
  enabled = true

  # Reserved. Do not change — main.go refuses to start if
  # PORT/DASHBOARD_PORT conflicts with it.
  listen_address = '127.0.0.1:8080'

  # Read from [monitoring_ui] only (section-restricted). Must
  # be filled by customize.sh before startup. If left empty,
  # the Dashboard will not work (but the WebUI will).
  username = ''
  password = ''

  # enable_query_log:
  #   true = log every query to dnscrypt-query.log.
  #   Required for Dashboard: recent_queries, top_domains.
  enable_query_log = true

  # privacy_level:
  #   1 = log domain names (required for Dashboard).
  #   2 = log IP addresses only (no domains).
  #   3 = log nothing (disables Dashboard).
  privacy_level = 1