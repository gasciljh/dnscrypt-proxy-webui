# ============================================================
# [8] Known Issues & Migration Notes
# ============================================================
# CONF-1 (this revision): new section.
#
# This section documents design decisions that are not obvious
# from the surrounding comments, and that must be understood
# before customizing the file in non-default ways.
#
# ------------------------------------------------------------
# [8.1] Why is BIND_ADDR enforced in main.go and not here?
# ------------------------------------------------------------
#
#   webui.conf is a text file. Any user with root access can
#   edit it. If BIND_ADDR validation lived only here, a user
#   could set BIND_ADDR=0.0.0.0 without credentials and expose
#   the WebUI to the LAN unintentionally.
#
#   main.go therefore performs the check at startup:
#     1. Read BIND_ADDR from webui.conf.
#     2. If it is exposed (not 127.0.0.1 / ::1 / localhost),
#        require non-empty [monitoring_ui] username + password.
#     3. If credentials are missing, refuse to start with a
#        FATAL message.
#
#   This is defense-in-depth: the config file documents the
#   intent, and the Go binary enforces it.
#
# ------------------------------------------------------------
# [8.2] Why doesn't main.go read AUTO_RESTART_* ?
# ------------------------------------------------------------
#
#   AUTO_RESTART_* is a property of the watchdog, not of the
#   WebUI. The watchdog is a separate shell process managed by
#   service.sh. Coupling the WebUI startup to shell-level
#   options would introduce a second source of truth and make
#   the startup order fragile.
#
#   Concretely:
#     • service.sh reads AUTO_RESTART_* and passes them to
#       watchdog.sh as positional arguments.
#     • watchdog.sh uses them to decide whether to attempt a
#       restart when it detects a down service.
#     • main.go never reads webui.conf for these keys.
#
#   If you want to disable automatic restarts, edit this file
#   and reboot. A WebUI restart alone is NOT sufficient.
#
# ------------------------------------------------------------
# [8.3] Migration from v1.1.0 to v1.2.0
# ------------------------------------------------------------
#
#   No action required. The v1.2.0 installer will:
#     1. Detect your existing webui.conf (multi-source scan).
#     2. Back it up to /sdcard/dnscrypt-webui-backup/current/.
#     3. Restore it in place (byte-for-byte).
#     4. Verify SHA256 integrity against the manifest.
#
#   If the restore fails for any reason, the installer will
#   roll back to the previous module state via the transactional
#   upgrade system (customize.sh Layer 4).
#
#   The only fields that may be added by a future version are
#   new OPTIONAL keys. Existing keys are never reordered,
#   renamed, or removed by an upgrade.
#
# ------------------------------------------------------------
# [8.4] Migration from v1.0.0 to v1.2.0
# ------------------------------------------------------------
#
#   customize.sh applies a targeted migration
#   (migrate_v1_0_0_to_v1_2_0):
#     • Adds MEMORY_LIMIT_HINT=auto if it is missing.
#     • Does NOT change any existing key.
#
#   All other v1.0.0 → v1.2.0 changes are handled transparently
#   by the installer. See docs/UPGRADE.md §3 for details.
#
# ------------------------------------------------------------
# [8.5] What if I edit this file while the module is running?
# ------------------------------------------------------------
#
#   Edits to webui.conf take effect only after the WebUI process
#   restarts. The running instance reads the file ONCE at
#   startup (main.go:initPaths → getBindAddr, getWebUIPort,
#   getDashboardPort, loadLogLevel).
#
#   To apply changes:
#     • Reboot the device, OR
#     • From the WebUI: stop then start the service, OR
#     • From a root shell:
#         su -c "sh /data/adb/modules/dnscrypt-proxy-webui/action.sh --restart"
#
#   The watchdog will NOT pick up the new values on its own.
#   It receives AUTO_RESTART_* and PORT as command-line
#   arguments from service.sh at boot time; those arguments are
#   fixed for the lifetime of the watchdog process.
#
# ------------------------------------------------------------
# [8.6] What if two config keys look identical?
# ------------------------------------------------------------
#
#   This file is parsed by main.go using a simple line-oriented
#   reader (readConfValue). The FIRST matching line wins. If
#   you accidentally leave two `PORT=` lines, the first one is
#   used, and the second is silently ignored.
#
#   To verify which value is in effect:
#     curl -s http://127.0.0.1:9090/api?action=runtime_info \
#         | jq '{webui_port, dashboard_port, bind_addr}'
#
#   Duplicated keys are not an error, but they are a common
#   source of confusion. Keep one of each.
#
# ------------------------------------------------------------
# [8.7] Can I use webui.conf to change monitoring_ui credentials?
# ------------------------------------------------------------
#
#   No. The [monitoring_ui] username and password live in
#   dnscrypt-proxy.toml, not here. main.go reads them from
#   there (readMonitoringAuthFromFile, section-scoped to
#   [monitoring_ui]).
#
#   customize.sh generates strong random credentials for
#   [monitoring_ui] on install if the defaults (admin/admin)
#   are detected. The credentials are written to:
#     /data/local/tmp/dnscrypt_credentials.txt
#
#   See §3 for the security implication when BIND_ADDR is
#   exposed.
#
# ============================================================