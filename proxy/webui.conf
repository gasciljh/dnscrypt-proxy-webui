# ============================================================
# [3] Bind Address (BIND_ADDR)
# ============================================================
# ⚠️ This option is enforced in main.go.
#
# It controls the listening address for both servers
# (WebUI + Dashboard).
#
# Recommended values:
#   BIND_ADDR=127.0.0.1   ← Default (safe, local only, IPv4)
#   BIND_ADDR=::1         ← IPv6 loopback (safe, local only)
#   BIND_ADDR=0.0.0.0     ← ⚠️ Exposes service to the entire network (IPv4)
#   BIND_ADDR=::          ← ⚠️ Exposes service to the entire network (IPv6 + IPv4)
#
# ------------------------------------------------------------
# 🔒 Security enforcement:
#   • main.go checks BIND_ADDR on startup
#   • If BIND_ADDR exposes the service (anything other than
#     127.0.0.1/::1/localhost), main.go refuses to start unless
#     credentials are set in:
#         dnscrypt-proxy.toml → [monitoring_ui] → username + password
#   • customize.sh generates credentials automatically on
#     installation
#
# ------------------------------------------------------------
# ⚠️ Security warnings when using 0.0.0.0 or ::
#   1. The service will be reachable from every device on your LAN
#   2. Ensure strong credentials are set
#   3. Ensure proper firewall rules are in place
#   4. CSP prevents access from external domains, but does not
#      protect against direct access
#   5. Watchdog calls ensure_running from localhost — always works
#
# ------------------------------------------------------------
# ⚠️ CONF-5 (this revision) — IPv6 wildcard `::` dual-stack:
#
#   On Android (and Linux in general), `net.ipv6.bindv6only`
#   defaults to 0, which means a socket bound to `::` ALSO
#   accepts IPv4 connections (mapped addresses, e.g.
#   ::ffff:192.168.1.5). This is easy to overlook:
#
#     • Users often pick `::` expecting "IPv6-only, localhost-only".
#     • What they actually get is "both families, all interfaces".
#
#   If you want IPv6-only behavior, you must set:
#       sysctl -w net.ipv6.bindv6only=1
#   …which is NOT persistent across reboots on most Android
#   builds, so it is not recommended.
#
#   For a LAN-exposed IPv6-only setup, prefer binding to a
#   specific IPv6 address of the interface (e.g.
#   `BIND_ADDR=fe80::1%wlan0` or a global unicast address)
#   rather than to `::`.
#
#   Recommended practice on Android: use `127.0.0.1` (default)
#   or `0.0.0.0` (with credentials + firewall). Use `::1` only
#   if you specifically need IPv6 loopback and know your client
#   stack supports it. Avoid `::` unless you have read the
#   paragraph above carefully.
#
# ------------------------------------------------------------
# 💡 Use cases:
#   • Personal phone (normal)    → BIND_ADDR=127.0.0.1 (default)
#   • IPv6 loopback only         → BIND_ADDR=::1
#   • Monitor from home PC       → BIND_ADDR=0.0.0.0 (with credentials)
#   • Dedicated server/device    → BIND_ADDR=0.0.0.0 (with firewall)
#
# Default: 127.0.0.1
# ============================================================
BIND_ADDR=127.0.0.1


# ============================================================
# [4] Auto-Restart Options
# ============================================================
#
# Important: these options are enforced by the Watchdog in
# service.sh every 30 seconds. They do NOT override a manual
# stop from the WebUI.
# If you stop the service manually (⏹️ button), the Watchdog
# will not restart it, even if AUTO_RESTART_DNS=1.
#
# ✅ These values are read only by service.sh.
#    main.go does not read them (the Watchdog is a Shell
#    component, not a Go one). This is intentional to reduce
#    coupling between components.
#
# ------------------------------------------------------------
# [4.1] AUTO_RESTART_DNS — automatic DNS engine restart
# ------------------------------------------------------------
#
#   1 = if the DNS engine (5354/UDP) stops unexpectedly,
#       the Watchdog will restart it within 30-60 seconds
#
#   0 = no automatic restart — user is responsible for starting it
#
# Recommended scenarios:
#   • Personal phone (normal)   → 1 (maximum stability)
#   • Test/dev device           → 0 (avoid interfering with tests)
#   • Battery-constrained phone → 0 (save power)
#   • Critical usage            → 1 (DNS continuity)
#
# v1.1.0+ note:
#   This option is orthogonal to the memory limit (MEM-1).
#   The DNS engine is a separate process with its own memory
#   footprint — the WebUI's soft memory limit does not affect it.
#   See §6.1 for recommended RAM tiers per profile.
#
# Default: 1
# ============================================================
AUTO_RESTART_DNS=1


# ------------------------------------------------------------
# [4.2] AUTO_RESTART_WEBUI — automatic WebUI restart
# ------------------------------------------------------------
#
#   1 = if the WebUI stops (port not open),
#       the Watchdog will restart it within 30-60 seconds
#
#   0 = no automatic restart — requires manual intervention
#       (Action button)
#
# Recommended scenarios:
#   • Personal phone (normal)   → 1 (accessibility)
#   • Test/dev device           → 0 (avoid interfering)
#   • Maximum power saving      → 0
#   • Remote management         → 1 (availability)
#
# Default: 1
# ============================================================
AUTO_RESTART_WEBUI=1


# ============================================================
# [5] Log verbosity level
# ============================================================
#
# Controls the verbosity level of the log file at:
#   /data/local/tmp/dnscrypt_main.log
#
# Available values:
#   error = errors only (less noise)
#   warn  = errors + warnings
#   info  = errors + warnings + info (recommended) ← default
#   debug = everything (for diagnostics only, consumes more space)
#
# ⚠️ Do not use debug in daily usage — it consumes a lot of space
#
# ------------------------------------------------------------
# ⚠️ CONF-6 (this revision) — LOG_LEVEL vs log_level:
#
#   The module has TWO independent log-verbosity settings that
#   share a similar name. They are NOT interchangeable. This
#   is a frequent source of confusion, so the comparison is
#   presented as a table below.
#
#   ┌────────────────────┬─────────────────────────┬───────────────────────────┐
#   │ Aspect                │ LOG_LEVEL (this file)    │ log_level (in TOML)         │
#   ├────────────────────┼─────────────────────────┼───────────────────────────┤
#   │ Belongs to            │ WebUI (main.go)          │ DNS engine (dnscrypt-proxy) │
#   │ File it lives in      │ webui.conf               │ dnscrypt-proxy.toml         │
#   │ Value type            │ Textual keyword          │ Integer 0-4                 │
#   │ Accepted values       │ error | warn | info      │ 0 = debug                   │
#   │                       │ | debug                  │ 1 = info                    │
#   │                       │                          │ 2 = notice                  │
#   │                       │                          │ 3 = warning                 │
#   │                       │                          │ 4 = error                   │
#   │ Default               │ info                     │ 2 (notice)                  │
#   │ Log file it writes    │ /data/local/tmp/         │ /data/local/tmp/            │
#   │                       │ dnscrypt_main.log        │ dnscrypt-proxy.log          │
#   │ Read by               │ main.go at startup       │ dnscrypt-proxy at startup   │
#   │ Requires restart?     │ Yes — WebUI restart      │ Yes — DNS engine restart    │
#   │ Common mistake        │ Setting it to "2"        │ Setting it to "warn"        │
#   └────────────────────┴─────────────────────────┴───────────────────────────┘
#
#   Concrete example:
#     • You want to see memory-limit transitions in the WebUI
#       log → set LOG_LEVEL=info (this file).
#     • You want to see DNSCrypt handshake failures in the DNS
#       engine log → set log_level=2 or 3 (TOML).
#     • The two settings have NOTHING to do with each other.
#
#   See docs/COMPATIBILITY.md §5.2 for the full cross-reference
#   matrix and for troubleshooting recipes.
#
# ------------------------------------------------------------
# v1.1.0+ note:
#   With LOG_LEVEL=info or debug, the WebUI log includes the
#   memory-limit transitions emitted by applyMemoryLimit():
#       "memory limit adjusted: 80 MB → 120 MB (profile=pro, ...)"
#   With LOG_LEVEL=warn or error, these lines are suppressed.
#
# Default: info
# ============================================================
LOG_LEVEL=info


