# ============================================================
# DNSCrypt WebUI & Dashboard — webui.conf
# Version: v1.5.0 (Global Edition)
# Last updated: 2026-10-19
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
# Configuration for the WebUI (main.go) and Dashboard.
#
# ⚠️ Strict rules when editing:
#
#   1. No spaces around "="
#      ✅ PORT=9090
#      ❌ PORT = 9090
#
#   2. No trailing comment at end of line
#      ✅ PORT=9090
#      ❌ PORT=9090  # my port
#
#   3. Use numbers only for ports (1024-65535)
#
#   4. PORT and DASHBOARD_PORT must be different
#      (main.go refuses to start if they are equal)
#
#   5. Do not use CRLF (Windows line endings)
#
#   6. Valid values for AUTO_RESTART_*: 0 or 1 only
# ============================================================


# ============================================================
# [1] WebUI port
# ============================================================
# Main interface: start/stop button, blocklist selection,
# custom rules editor, runtime info, log viewer, live status
# via SSE, companion-app install button.
#
# Default: 9090
#
# ⚠️ Avoid 8080 — reserved for monitoring_ui (in
#    dnscrypt-proxy.toml).
PORT=9090


# ============================================================
# [2] Dashboard port
# ============================================================
# Monitoring panel: query statistics, cache performance,
# resolver health, top domains, recent queries.
#
# Default: 9091
#
# ⚠️ Must be different from PORT.
DASHBOARD_PORT=9091


# ============================================================
# [3] Bind address (enforced by main.go)
# ============================================================
# Controls the listening address for both servers.
#
# Recommended values:
#   127.0.0.1  ← Default (safe, local only, IPv4)
#   ::1        ← IPv6 loopback (safe, local only)
#   0.0.0.0    ← ⚠️ Exposes to the entire network (IPv4)
#   ::         ← ⚠️ Exposes to the entire network (IPv6 + IPv4)
#
# 🔒 Security enforcement:
#   • main.go checks BIND_ADDR on startup.
#   • If the address exposes the service, main.go refuses to
#     start unless credentials are set in dnscrypt-proxy.toml
#     → [monitoring_ui] → username + password.
#
# ⚠️ IPv6 wildcard `::` on Android defaults to dual-stack
#    (accepts IPv4 connections too). Use a specific IPv6
#    address or 127.0.0.1 unless you have a reason.
#
# Default: 127.0.0.1
BIND_ADDR=127.0.0.1


# ============================================================
# [4] Auto-restart options
# ============================================================
# Read ONLY by service.sh (the Watchdog is a shell component,
# not a Go one). They do NOT override a manual stop from the
# WebUI.
#
# AUTO_RESTART_DNS:
#   1 = restart DNS engine if it stops unexpectedly
#   0 = no automatic restart
#
# AUTO_RESTART_WEBUI:
#   1 = restart WebUI if it stops unexpectedly
#   0 = no automatic restart
#
# Defaults: 1 / 1
AUTO_RESTART_DNS=1
AUTO_RESTART_WEBUI=1


# ============================================================
# [5] Log verbosity level
# ============================================================
# Controls the WebUI log file at /data/local/tmp/dnscrypt_main.log.
#
# Values:
#   error = errors only
#   warn  = errors + warnings
#   info  = errors + warnings + info (recommended, default)
#   debug = everything (diagnostics only — consumes more space)
#
# ⚠️ Two DIFFERENT log-level settings exist:
#     • LOG_LEVEL (this file, textual) → WebUI log
#     • log_level (dnscrypt-proxy.toml, numeric 0-4) → DNS log
#   They are independent. See docs/REFERENCE.md §5 for the
#   full matrix.
#
# Default: info
LOG_LEVEL=info