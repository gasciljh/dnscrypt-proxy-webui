#
# ⚠️ Strict rules to follow when editing:
#
#   1. No spaces around "="
#      ✅ Correct: PORT=9090
#      ❌ Wrong:   PORT = 9090
#
#   2. No trailing comment at the end of a line
#      ✅ Correct: PORT=9090
#      ❌ Wrong:   PORT=9090  # my port
#
#      Technical note: main.go supports inline comments, but we
#      recommend avoiding them for broader tool compatibility.
#
#   3. Use numbers only for ports (1024-65535)
#      ❌ Forbidden: "9090" (with quotes)
#
#   4. PORT and DASHBOARD_PORT must be different
#      ⚠️ main.go refuses to start if they are equal.
#
#   5. Do not use CRLF (Windows line endings)
#      A simple text editor on Android is enough (MiXplorer /
#      MT Manager)
#
#   6. Valid values for AUTO_RESTART_*: 0 or 1 only
#
#   7. LOG_LEVEL: error | warn | info | debug
#
# ------------------------------------------------------------
