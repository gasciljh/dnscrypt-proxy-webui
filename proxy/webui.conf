# ------------------------------------------------------------
# [6.1] Recommended RAM tier by profile (v1.1.0+ — informational)
# ------------------------------------------------------------
#
# The WebUI sets the Go runtime soft memory limit based on the
# active blocklist profile (MEM-1). This is managed by main.go
# and is NOT configurable from webui.conf.
#
# This table helps you choose a profile that matches your device.
# See docs/COMPATIBILITY.md §5.4 for the full rationale.
#
# ┌──────────────┬─────────────────┬──────────────┬───────────────┐
# │ Profile        │ WebUI soft limit   │ Typical use     │ ~Filtered        │
# ├──────────────┼─────────────────┼──────────────┼───────────────┤
# │ light          │  80 MB             │ 1 GB RAM        │ ~40,000 entries  │
# │ normal         │ 100 MB             │ 2 GB RAM        │ ~120,000 entries │
# │ pro (default)  │ 120 MB             │ 3 GB RAM        │ ~250,000 entries │
# │ proplus        │ 160 MB             │ 4 GB RAM        │ ~350,000 entries │
# │ ultimate       │ 220 MB             │ 6 GB+ RAM       │ ~500,000 entries │
# └──────────────┴─────────────────┴──────────────┴───────────────┘
#
# The profile is selected via the WebUI (not this file) and is
# stored in:
#     proxy/selected_profile.txt
#
# Verify the effective limit at runtime:
#     curl -s http://127.0.0.1:9090/api?action=runtime_info \
#         | jq '{profile_key, memory_limit_mb}'
# ------------------------------------------------------------


# ------------------------------------------------------------
# [6.2] Data preservation (v1.2.0+ — informational)
# ------------------------------------------------------------
#
# Starting with v1.2.0, the module preserves 5 user config files
# across every upgrade, rename, reinstall, and uninstall. This
# file (webui.conf) is one of them.
#
# The 5 preserved files:
#   • webui.conf             ← THIS FILE
#   • dnscrypt-proxy.toml
#   • selected_profile.txt
#   • allowlist.txt
#   • denylist.txt
#
# Where they are backed up:
#   /sdcard/dnscrypt-webui-backup/
#
# Directory structure (CONF-7 corrected — every snapshot name
# carries a PID suffix; the main.go variant adds a random suffix):
#
#   current/                              — live snapshot, always up to date
#   <timestamp>-<version>-<pid>/          — historical snapshot per upgrade
#                                           (customize.sh — BUG-CS-C fix)
#   <timestamp>-auto-<pid>/               — periodic auto-backup
#                                           (service.sh via functions.sh — FSH-10)
#   <timestamp>-manual-<pid>/             — manual backup from action.sh
#                                           (action.sh --backup — ACT-5)
#   <timestamp>-manual-<pid>-<rand4>/     — pre-critical snapshot from main.go
#                                           (createAutoBackup — BUG-E)
#   txn-<timestamp>-<pid>/                — in-flight transaction
#                                           (customize.sh during install)
#   orphan-txn-<timestamp>-<pid>/         — preserved interrupted install
#                                           (renamed by uninstall.sh)
#
#   .last_stable            — pointer to last known good snapshot
#   .last_auto_backup       — marker for the periodic auto-backup
#                             (mtime only; CONF-4)
#   .pending_notification   — transient message from installer,
#                             read+deleted by main.go at startup
#   .upgrade_history.json   — full upgrade log (when `jq` exists)
#   .upgrade_history.txt    — plain-text fallback (when `jq` is
#                             missing; CONF-3)
#   README.md               — user-facing guide (from customize.sh)
#
# Each snapshot directory also contains a `.manifest.json` file
# with per-file SHA256 hashes. See docs/BACKUP.md §5.1 for the
# exact schema.
#
# ⚠️ Snapshot detection (v1.3.0 — SNAP-MANIFEST):
#    A directory is treated as a snapshot **iff** it contains a
#    `.manifest.json` file. The name pattern is no longer the
#    primary detection rule.
#
# ⚠️ Rotation semantics (v1.3.0 — CONF-9):
#
#   Retention: 21 snapshots maximum.
#
#   The rotation is performed by `functions.sh:rotate_backups`
#   with three identifiers (see docs/ARCHITECTURE.md §4.13.2):
#
#     • ROT-MANIFEST — snapshot detection is manifest-based
#       (same rule as SNAP-MANIFEST above). A directory without
#       a manifest is ignored by rotation, even if its name
#       matches the timestamp pattern.
#
#     • ROT-MTIME — candidates are sorted by **mtime**
#       (descending), not by lexicographic directory name.
#       This is robust against clock drift and manual renames.
#
#     • ROT-PROTECT — two additional targets are preserved on
#       top of the 21-newest window:
#         - the `.last_stable` recovery pointer;
#         - the newest install snapshot (name matching
#           `-v<digit>`).
#       Without these protections, the 21-newest window could
#       silently evict the exact snapshot that recovery mode
#       or rollback depends on.
#
#   ⚠️ Historical note (v1.2.0): The v1.2.0 rotation used a
#      directory-name sort and a name-pattern detection rule.
#      Both were superseded in v1.3.0. See CHANGELOG.md [v1.3.0]
#      and docs/ARCHITECTURE.md §4.13.2.
#
# What happens on uninstall:
#   The backup directory is PRESERVED. If you reinstall the
#   module later, your settings are restored automatically
#   (via the multi-source detection in customize.sh).
#
# Manual backup:
#   su -c "sh /data/adb/modules/dnscrypt-proxy-webui/action.sh --backup"
#
# Full reference:
#   docs/BACKUP.md      (backup system reference)
#   docs/EMERGENCY.md   (recovery procedures)
# ------------------------------------------------------------


# ------------------------------------------------------------
# [6.3] Companion Android app (v1.4.0 — informational)
# ------------------------------------------------------------
#
# Starting with v1.4.0, the module ZIP may optionally ship a
# companion Android app (a WebView wrapper for the WebUI):
#
#   web/app-debug.apk     — the companion app binary
#
# Behavior:
#   • If the APK is present in the ZIP, it is served by main.go
#     at: GET /app-debug.apk
#   • If the APK is absent (local developer builds, or a release
#     where the fetch step failed), the route returns HTTP 404.
#     This is intentional — the APK is an OPTIONAL asset.
#
# Configuration:
#   • NOTHING in this file controls the APK.
#   • The APK is not referenced by any webui.conf setting.
#   • The APK is not one of the 5 preserved files.
#   • The APK is not stored in the persistent backup directory.
#
# The version of the companion app is defined in a separate
# file: `proxy/app-apk.version` (single source of truth).
# See docs/BACKUP.md §2.1 (companion APK is NOT preserved) and
# proxy/main.go (§[35] serveStaticAssets, APK route).
# ------------------------------------------------------------


