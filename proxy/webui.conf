# ============================================================
# DNSCrypt WebUI & Dashboard — webui.conf
# Version: v1.0.0
# Author: gasciljh
# Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
# ============================================================
#
# ⚠️ Strict rules to follow when editing:
#
#   1. No spaces around "="
#      ✅ Correct: PORT=9090
#      ❌ Wrong:   PORT = 9090
#
#   2. No trailing comment at the end of a line
#      ✅ Correct: PORT=9090
#      ❌ Wrong:   PORT=9090  # my port
#
#      Technical note: main.go supports inline comments, but we
#      recommend avoiding them for broader tool compatibility.
#
#   3. Use numbers only for ports (1024-65535)
#      ❌ Forbidden: "9090" (with quotes)
#
#   4. PORT and DASHBOARD_PORT must be different
#      ⚠️ main.go refuses to start if they are equal.
#
#   5. Do not use CRLF (Windows line endings)
#      A simple text editor on Android is enough (MiXplorer / MT Manager)
#
#   6. Valid values for AUTO_RESTART_*: 0 or 1 only
#
#   7. LOG_LEVEL: error | warn | info | debug
#
# ------------------------------------------------------------
# Notes:
#   • BIND_ADDR is enforced in main.go (not documentation-only).
#   • Port 8080 is reserved (monitoring_ui) — it is rejected.
#   • main.go supports inline comments in config values.
#   • LOG_LEVEL (here) controls the WebUI log (main.go) — textual.
#     It is separate from `log_level` in dnscrypt-proxy.toml, which
#     controls the DNS engine log — numeric (0-4).
#   • AUTO_RESTART_* settings are read only by service.sh (the
#     Watchdog is a shell component, not a Go one).
# ------------------------------------------------------------
# ============================================================


# ============================================================
# [1] WebUI Port (main interface)
# ============================================================
# The main interface contains:
#   • Service start/stop button
#   • Blocklist selection (Light/Normal/PRO/PRO++/Ultimate)
#   • Custom rules (Allowlist / Denylist)
#   • System info (Runtime Info)
#   • Log viewer
#   • Live status via SSE
#
# Default: 9090
# Recommended range: 1024-65535 (avoid reserved ports)
#
# ⚠️ Avoid 8080 — reserved for monitoring_ui in dnscrypt-proxy.toml
# ============================================================
PORT=9090


# ============================================================
# [2] Dashboard Port (separate monitoring panel)
# ============================================================
# The separate monitoring panel displays:
#   • Query statistics (total / blocked)
#   • Cache performance (hit ratio, entries, TTL)
#   • Resolver health
#   • Top domains
#   • Source refresh status
#   • Last 30 queries (recent queries)
#   • Runtime Info
#
# Default: 9091
#
# ⚠️ Must be different from PORT (main.go refuses to start otherwise)
# ============================================================
DASHBOARD_PORT=9091


# ============================================================
# [3] Bind Address (BIND_ADDR)
# ============================================================
# ⚠️ This option is enforced in main.go.
#
# It controls the listening address for both servers
# (WebUI + Dashboard).
#
# Recommended values:
#   BIND_ADDR=127.0.0.1   ← Default (safe, local only)
#   BIND_ADDR=::1         ← IPv6 loopback (safe, local only)
#   BIND_ADDR=0.0.0.0     ← ⚠️ Exposes service to the entire network (IPv4)
#   BIND_ADDR=::          ← ⚠️ Exposes service to the entire network (IPv6 + IPv4)
#
# ------------------------------------------------------------
# 🔒 Security enforcement:
#   • main.go checks BIND_ADDR on startup
#   • If BIND_ADDR exposes the service (anything other than
#     127.0.0.1/::1/localhost), main.go refuses to start unless
#     credentials are set in:
#         dnscrypt-proxy.toml → [monitoring_ui] → username + password
#   • customize.sh generates credentials automatically on installation
#
# ------------------------------------------------------------
# ⚠️ Security warnings when using 0.0.0.0 or ::
#   1. The service will be reachable from every device on your LAN
#   2. Ensure strong credentials are set
#   3. Ensure proper firewall rules are in place
#   4. CSP prevents access from external domains, but does not
#      protect against direct access
#   5. Watchdog calls ensure_running from localhost — always works
#
# ------------------------------------------------------------
# 💡 Use cases:
#   • Personal phone (normal)    → BIND_ADDR=127.0.0.1 (default)
#   • Monitor from home PC       → BIND_ADDR=0.0.0.0 (with credentials)
#   • Dedicated server/device    → BIND_ADDR=0.0.0.0 (with firewall)
#
# Default: 127.0.0.1
# ============================================================
BIND_ADDR=127.0.0.1


# ============================================================
# [4] Auto-Restart Options
# ============================================================
#
# Important: these options are enforced by the Watchdog in
# service.sh every 30 seconds. They do NOT override a manual
# stop from the WebUI.
# If you stop the service manually (⏹️ button), the Watchdog
# will not restart it, even if AUTO_RESTART_DNS=1.
#
# ✅ These values are read only by service.sh.
#    main.go does not read them (the Watchdog is a Shell
#    component, not a Go one). This is intentional to reduce
#    coupling between components.
#
# ------------------------------------------------------------
# [4.1] AUTO_RESTART_DNS — automatic DNS engine restart
# ------------------------------------------------------------
#
#   1 = if the DNS engine (5354/UDP) stops unexpectedly,
#       the Watchdog will restart it within 30-60 seconds
#
#   0 = no automatic restart — user is responsible for starting it
#
# Recommended scenarios:
#   • Personal phone (normal)   → 1 (maximum stability)
#   • Test/dev device           → 0 (avoid interfering with tests)
#   • Battery-constrained phone → 0 (save power)
#   • Critical usage            → 1 (DNS continuity)
#
# Default: 1
# ============================================================
AUTO_RESTART_DNS=1


# ------------------------------------------------------------
# [4.2] AUTO_RESTART_WEBUI — automatic WebUI restart
# ------------------------------------------------------------
#
#   1 = if the WebUI stops (port not open),
#       the Watchdog will restart it within 30-60 seconds
#
#   0 = no automatic restart — requires manual intervention
#       (Action button)
#
# Recommended scenarios:
#   • Personal phone (normal)   → 1 (accessibility)
#   • Test/dev device           → 0 (avoid interfering)
#   • Maximum power saving      → 0
#   • Remote management         → 1 (availability)
#
# Default: 1
# ============================================================
AUTO_RESTART_WEBUI=1


# ============================================================
# [5] Log verbosity level
# ============================================================
#
# Controls the verbosity level of the log file at:
#   /data/local/tmp/dnscrypt_main.log
#
# Available values:
#   error = errors only (less noise)
#   warn  = errors + warnings
#   info  = errors + warnings + info (recommended) ← default
#   debug = everything (for diagnostics only, consumes more space)
#
# ⚠️ Do not use debug in daily usage — it consumes a lot of space
#
# ⚠️ This setting is different from `log_level` in dnscrypt-proxy.toml:
#   • LOG_LEVEL (here)         → WebUI log (main.go) — textual
#   • log_level (in toml)      → DNSCrypt engine log — numeric (0-4)
#
#   The two operate independently. Do not try to unify them.
#
# Note: this setting is read by the WebUI (main.go) on startup.
#       Any change requires a WebUI restart.
#
# Default: info
# ============================================================
LOG_LEVEL=info


# ============================================================
# [6] Recommended settings by device type
# ============================================================
#
# ┌──────────────────────────┬──────┬─────────────────┬───────────┬───────────┬───────────┐
# │ Device type              │ PORT │ DASHBOARD_PORT  │ BIND_ADDR │ LOG_LEVEL │ AUTO_*    │
# ├──────────────────────────┼──────┼─────────────────┼───────────┼───────────┼───────────┤
# │ Personal phone (stable)  │ 9090 │ 9091            │ 127.0.0.1 │ info      │ 1 / 1     │
# │ Test/dev device          │ 9090 │ 9091            │ 127.0.0.1 │ debug     │ 0 / 0     │
# │ Battery-constrained      │ 9090 │ 9091            │ 127.0.0.1 │ warn      │ 0 / 0     │
# │ Monitor from LAN ⚠️      │ 9090 │ 9091            │ 0.0.0.0   │ info      │ 1 / 1     │
# │ Advanced usage           │ 9080 │ 9081            │ 127.0.0.1 │ info      │ 1 / 1     │
# └──────────────────────────┴──────┴─────────────────┴───────────┴───────────┴───────────┘
#
# ⚠️ Warnings:
#   1. Do not use 8080 or 8081 — reserved for monitoring_ui.
#   2. Changing ports requires restarting the module.
#   3. main.go refuses to start if PORT and DASHBOARD_PORT are equal.
#   4. BIND_ADDR=0.0.0.0 requires credentials (mandatory).
# ============================================================


# ============================================================
# [7] Technical notes
# ============================================================
#
# 📁 Runtime files:
#   • DNSCrypt PID:   proxy/run/dnscrypt.pid
#   • WebUI PID:      proxy/run/webui.pid
#   • Watchdog PID:   proxy/run/watchdog.pid
#   • Status File:    proxy/run/dnscrypt.status
#   • Progress File:  proxy/run/update_progress.txt
#   • Main Log:       /data/local/tmp/dnscrypt_main.log
#
# 🔄 Fallback:
#   If proxy/run/ is not writable (SELinux, permissions),
#   alternate paths in /data/local/tmp/ are used automatically.
#
# 🧠 Memory usage:
#   • Idle WebUI:          ~15 MB
#   • rebuildBlocklist:    ~2 MB peak
#
# 📝 Log rotation:
#   • main.go (WebUI):     Sole manager of orderly rotation at 1 MB
#                          Produces .<timestamp>.old + .gz files
#   • functions.sh:        Emergency-only at 50 MB
#                          Produces .emergency.<timestamp> files
#   • dnscrypt-proxy:      Rotates dnscrypt-proxy.log at 6 MB (from toml)
#
# 🔒 Security:
#   • CSP + X-Frame-Options + nosniff on all HTTP responses
#   • handleLogin uses subtle.ConstantTimeCompare
#   • handleAPI limits POST body to 5 MB
#   • /healthz + /readyz for quick checks
#   • BIND_ADDR=0.0.0.0 requires credentials (mandatory)
#   • STATUS_FILE = User Intent (read-only status functions)
#   • Custom Chains: DNSCRYPT_OUT / DNSCRYPT_OUT6 (no orphans)
#   • IPv6-safe rate limiting (getClientIP)
#   • Port Guard 8080 (main.go + 6 shell scripts)
#   • Section-Restricted TOML (read from [monitoring_ui] only)
#   • Login POST-only (CSRF protection)
#   • /readyz localhost-only (info leak prevention)
#   • shellQuote() injection protection
#   • rebuildMu mutex (RACE-1 — BLOCKLIST consistency)
#   • runtime_info dynamic ports (PORT-2)
#   • Auth cache 60 s (reduces file I/O)
#
# 🔍 Diagnostics:
#   curl http://127.0.0.1:9090/healthz
#   curl http://127.0.0.1:9090/readyz
#   curl http://127.0.0.1:9090/api?action=runtime_info
#
# ⚠️ Full port constraints:
#   • PORT (here)                → 9090 default
#   • DASHBOARD_PORT (here)      → 9091 default
#   • monitoring_ui (in toml)    → 8080 (must not conflict!)
#   • listen_addresses (in toml) → 5354 (must not conflict!)
#
# ============================================================