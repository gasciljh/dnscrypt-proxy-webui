# ------------------------------------------------------------
# [6.1] Recommended RAM tier by profile (v1.1.0+ — informational)
# ------------------------------------------------------------
#
# The WebUI sets the Go runtime soft memory limit based on the
# active blocklist profile (MEM-1). This is managed by main.go
# and is NOT configurable from webui.conf.
#
# This table helps you choose a profile that matches your device.
# See docs/COMPATIBILITY.md §5.4 for the full rationale.
#
# ┌──────────────┬─────────────────┬──────────────┬───────────────┐
# │ Profile        │ WebUI soft limit   │ Typical use     │ ~Filtered        │
# ├──────────────┼─────────────────┼──────────────┼───────────────┤
# │ light          │  80 MB             │ 1 GB RAM        │ ~40,000 entries  │
# │ normal         │ 100 MB             │ 2 GB RAM        │ ~120,000 entries │
# │ pro (default)  │ 120 MB             │ 3 GB RAM        │ ~250,000 entries │
# │ proplus        │ 160 MB             │ 4 GB RAM        │ ~350,000 entries │
# │ ultimate       │ 220 MB             │ 6 GB+ RAM       │ ~500,000 entries │
# └──────────────┴─────────────────┴──────────────┴───────────────┘
#
# The profile is selected via the WebUI (not this file) and is
# stored in:
#     proxy/selected_profile.txt
#
# Verify the effective limit at runtime:
#     curl -s http://127.0.0.1:9090/api?action=runtime_info \
#         | jq '{profile_key, memory_limit_mb}'
# ------------------------------------------------------------


# ------------------------------------------------------------
# [6.2] Data preservation (v1.2.0 — informational)
# ------------------------------------------------------------
#
# Starting with v1.2.0, the module preserves 5 user config files
# across every upgrade, rename, reinstall, and uninstall. This
# file (webui.conf) is one of them.
#
# The 5 preserved files:
#   • webui.conf             ← THIS FILE
#   • dnscrypt-proxy.toml
#   • selected_profile.txt
#   • allowlist.txt
#   • denylist.txt
#
# Where they are backed up:
#   /sdcard/dnscrypt-webui-backup/
#
# Directory structure:
#   current/                — live snapshot, always up to date
#   <timestamp>-<version>/  — historical snapshot per upgrade
#   <timestamp>-auto-$$/    — periodic auto-backup (service.sh)
#   <timestamp>-manual-$$/  — pre-critical snapshot (main.go)
#   txn-<timestamp>-<pid>/  — in-flight transaction (customize.sh)
#   orphan-txn-*            — preserved interrupted install
#
#   .last_stable            — pointer to last known good snapshot
#   .last_auto_backup       — marker for the periodic auto-backup
#                             (CONF-4: added in this revision)
#   .pending_notification   — transient message from installer,
#                             read+deleted by main.go at startup
#   .upgrade_history.json   — full upgrade log (when `jq` exists)
#   .upgrade_history.txt    — plain-text fallback (when `jq` is
#                             missing)
#                             (CONF-3: added in this revision)
#   README.md               — user-facing guide (from customize.sh)
#
# Retention:
#   Rotation keeps at most 21 snapshots. Old snapshots are
#   pruned automatically after every successful backup.
#
# What happens on uninstall:
#   The backup directory is PRESERVED. If you reinstall the
#   module later, your settings are restored automatically
#   (via the multi-source detection in customize.sh).
#
# Manual backup:
#   su -c "sh /data/adb/modules/dnscrypt-proxy-webui/action.sh --backup"
#
# Full reference:
#   docs/BACKUP.md      (backup system reference)
#   docs/EMERGENCY.md   (recovery procedures)
# ------------------------------------------------------------


# ============================================================
# [7] Technical notes
# ============================================================
#
# 📁 Runtime files:
#   • DNSCrypt PID:   proxy/run/dnscrypt.pid
#   • WebUI PID:      proxy/run/webui.pid
#   • Watchdog PID:   proxy/run/watchdog.pid
#   • Status File:    proxy/run/dnscrypt.status
#   • Progress File:  proxy/run/update_progress.txt
#   • Watchdog Token: proxy/run/.watchdog_token (0600)
#   • Main Log:       /data/local/tmp/dnscrypt_main.log
#
# 💾 Persistent backup (v1.2.0):
#   • Root directory: /sdcard/dnscrypt-webui-backup/
#   • Live snapshot:  /sdcard/dnscrypt-webui-backup/current/
#   • Latest pointer: /sdcard/dnscrypt-webui-backup/.last_stable
#   • Upgrade log:    /sdcard/dnscrypt-webui-backup/.upgrade_history.json
#                     (or .upgrade_history.txt if jq is unavailable)
#
# 🔄 Fallback:
#   If proxy/run/ is not writable (SELinux, permissions),
#   alternate paths in /data/local/tmp/ are used automatically.
#
# 🧠 Memory usage (v1.1.0+ — MEM-1):
#
#   Two layers of memory exist in the module:
#
#   ┌───────────────┬────────────────────┬───────────────────┐
#   │ Process          │ Managed by            │ Typical footprint     │
#   ├───────────────┼────────────────────┼───────────────────┤
#   │ dnscrypt-webui   │ main.go               │ ~15 MB idle           │
#   │ (this WebUI)     │ (soft limit, MEM-1)   │ ~25-60 MB peak        │
#   ├───────────────┼────────────────────┼───────────────────┤
#   │ dnscrypt-proxy   │ dnscrypt-proxy.toml   │ ~5-20 MB              │
#   │ (DNS engine)     │ (cache_size, etc.)    │ (independent)         │
#   └───────────────┴────────────────────┴───────────────────┘
#
#   The v1.1.0 soft memory limit applies only to the WebUI process.
#   It is a *soft* limit — the Go runtime prefers running GC more
#   aggressively over OOMing. See §6.1 for the per-profile values.
#
# 📝 Log rotation:
#   • main.go (WebUI):     Sole manager of orderly rotation at 1 MB
#                          Produces .<timestamp>.old + .gz files
#   • functions.sh:        Emergency-only at 50 MB
#                          Produces .emergency.<timestamp> files
#   • dnscrypt-proxy:      Rotates dnscrypt-proxy.log at 6 MB (from toml)
#
# 🔒 Security:
#   • CSP + X-Frame-Options + nosniff on all HTTP responses
#   • handleLogin uses subtle.ConstantTimeCompare
#   • handleAPI limits POST body to 5 MB
#   • /healthz + /readyz for quick checks
#   • BIND_ADDR=0.0.0.0 requires credentials (mandatory)
#   • STATUS_FILE = User Intent (read-only status functions)
#   • Custom Chains: DNSCRYPT_OUT / DNSCRYPT_OUT6 (no orphans)
#   • IPv6-safe rate limiting (getClientIP)
#   • Port Guard 8080 (main.go + 6 shell scripts)
#   • Section-Restricted TOML (read from [monitoring_ui] only)
#   • Login POST-only (CSRF protection)
#   • /readyz localhost-only (info leak prevention)
#   • shellQuote() injection protection
#   • rebuildMu mutex (RACE-1 — BLOCKLIST consistency)
#   • runtime_info dynamic ports (PORT-2)
#   • Auth cache 60 s (reduces file I/O)
#   • MEM-1: Dynamic per-profile memory limit (v1.1.0)
#   • MEM-2: Extended shellQuote charset (v1.1.0)
#   • MEM-3: MONITORING_UI_PORT constant in metrics handler
#            (v1.1.0)
#   • Watchdog token: X-Watchdog-Token header, constant-time
#     compare in main.go, localhost-scoped (v1.2.0)
#   • Data preservation: 10 defensive layers (v1.2.0)
#       - Multi-source detection
#       - Persistent /sdcard backup
#       - SHA256 integrity verification
#       - Transactional atomic upgrades with rollback
#       - Root-solution compatibility (Magisk/KernelSU/APatch)
#       - SELinux context preservation (restorecon / chcon)
#       - Recovery mode via trigger file
#       - Version-aware config migrations
#       - Auto-backup + rotation (capped at 21 snapshots)
#       - Observability (upgrade history + CLI diagnose)
#
# 🔍 Diagnostics:
#   # HTTP probes (localhost only)
#   curl http://127.0.0.1:9090/healthz
#   curl http://127.0.0.1:9090/readyz
#   curl http://127.0.0.1:9090/api?action=runtime_info
#   curl http://127.0.0.1:9090/api?action=runtime_info \
#       | jq '{profile_key, memory_limit_mb}'    # v1.1.0
#   curl http://127.0.0.1:9090/api?action=runtime_info \
#       | jq '.backups'                          # v1.2.0
#
#   # CLI helpers (require root)
#   su -c "sh /data/adb/modules/dnscrypt-proxy-webui/status.sh"
#   su -c "sh /data/adb/modules/dnscrypt-proxy-webui/status.sh --json"
#   su -c "sh /data/adb/modules/dnscrypt-proxy-webui/status.sh --diagnose"
#   su -c "sh /data/adb/modules/dnscrypt-proxy-webui/action.sh --check"
#   su -c "sh /data/adb/modules/dnscrypt-proxy-webui/action.sh --backup"
#
#   # CONF-2 (this revision): the two `--json` and `--check`
#   # variants above were missing from the previous revision.
#   # The list now matches the shipped CLI surface. See
#   # status.sh --help and action.sh --help for the full set.
