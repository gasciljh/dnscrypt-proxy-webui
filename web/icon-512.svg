<?xml version="1.0" encoding="UTF-8"?>
<!-- ============================================================
     DNSCrypt Smart Filter - PWA Icon (512x512)
     Version: v1.5.0 (Global Edition)
     Last updated: 2026-10-19
     Author: gasciljh
     Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
     ============================================================
     Large SVG icon for modern browsers. Rendered at 512x512 in
     web/manifest.json icons[3] (purpose: any).

     Design:
       * Blue gradient background (full-bleed, no rounded corners)
       * Shield with subtle inner highlight edge
       * "DNS" bold label
       * Green status dot with Gaussian glow

     Role in the icon pipeline (scripts/generate-icons.sh):
       This SVG is the SOURCE for FOUR generated files:
         * icon-512.png         (512x512)
         * apple-touch-icon.png (180x180)
         * favicon-32x32.png    (32x32)
         * favicon-16x16.png    (16x16)

       It is NOT the source for icon-192.png - that PNG comes
       from icon-192.svg.

     Purpose in manifest.json:
       * This SVG: declared as "purpose": "any".
       * icon-512.png (derived from this SVG): declared in the
         manifest with BOTH "any" (icons[2]) and "maskable"
         (icons[4]) as two separate entries - the spec requires
         one entry per purpose.

     Maskable safe zone (W3C spec):
       The safe zone is a CIRCLE whose diameter is 80% of the
       icon's smallest dimension. For 512x512:
         radius = (512 x 0.8) / 2 = 204.8 px
         centered at (256, 256)
       Test: (x - 256)^2 + (y - 256)^2 <= 41943

       Every control point of the shield path fits inside this
       circle with a comfortable margin:
         (256,  60): 196.0 px  ->  margin  8.8 px
         (416, 142): 196.5 px  ->  margin  8.3 px  (shoulder)
         (416, 256): 160.0 px  ->  margin 44.8 px
         (256, 448): 192.0 px  ->  margin 12.8 px
         (96,  142): 196.5 px  ->  margin  8.3 px  (shoulder)
         (96,  256): 160.0 px  ->  margin 44.8 px

       Result: no clipping on launchers that apply a 40%
       circular mask (Pixel Launcher, most AOSP). On OEM
       launchers with 45%+ masks, the shoulders may clip by a
       few pixels - inherent to a shield-shaped icon at this
       size.

     Do NOT edit this SVG without regenerating the 4 PNGs.
     Use: scripts/generate-icons.sh -f
     Do NOT round the corners of the background rect - it is
     deliberately square (see "Design" above).
     Do NOT move the shield without re-checking the safe-
     circle test above.

     XML note: the W3C XML specification (section 2.5) forbids
     the sequence of two consecutive hyphens inside a comment.
     This header therefore writes script flags in short form
     only (for example, `-f`).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DNSCrypt Smart Filter">
    <title>DNSCrypt Smart Filter</title>
    <desc>Shield icon with DNS label and green status dot</desc>

    <defs>
        <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3a7bd5"/>
            <stop offset="100%" stop-color="#1e5bb8"/>
        </linearGradient>
        <linearGradient id="shieldGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4a7fc7"/>
            <stop offset="100%" stop-color="#3a6fb0"/>
        </linearGradient>
        <radialGradient id="dotGrad512" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#5ee06b"/>
            <stop offset="100%" stop-color="#2eb841"/>
        </radialGradient>
        <filter id="dotGlow512" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad512)"/>

    <path d="M 256 60 L 416 142 L 416 256 Q 416 374 256 448 Q 96 374 96 256 L 96 142 Z"
          fill="url(#shieldGrad512)" stroke="#2d5a94" stroke-width="5" stroke-linejoin="round"/>

    <path d="M 256 76 L 400 146 L 400 256 Q 400 362 256 428 Q 112 362 112 256 L 112 146 Z"
          fill="none" stroke="#5a8fd4" stroke-width="2" opacity="0.6"/>

    <text x="256" y="312"
          font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="160" font-weight="900" fill="#0d1117"
          text-anchor="middle" letter-spacing="3">DNS</text>

    <circle cx="256" cy="376" r="24" fill="url(#dotGrad512)" filter="url(#dotGlow512)"/>
    <circle cx="256" cy="376" r="34" fill="none" stroke="#5ee06b" stroke-width="3" opacity="0.55"/>
    <circle cx="256" cy="376" r="44" fill="none" stroke="#5ee06b" stroke-width="2" opacity="0.25"/>
</svg>