<?xml version="1.0" encoding="UTF-8"?>
<!-- ============================================================
     DNSCrypt Smart Filter — PWA Icon (512×512)
     Version: v1.1.0
     Author: gasciljh
     Repository: https://github.com/gasciljh/dnscrypt-proxy-webui
     ============================================================
     Large SVG icon for modern browsers. Rendered at 512×512 in
     web/manifest.json → icons[3] (purpose: any).

     Design:
       • Blue gradient background (full-bleed, no rounded corners)
       • Shield with subtle inner highlight edge
       • "DNS" bold label
       • Green status dot with Gaussian glow

     Role in the icon pipeline (verified against
     scripts/generate-icons.sh):

       SVG source           → Generated PNG
       ─────────────────────────────────────────────
       icon-192.svg         → icon-192.png        (192×192)
       icon-512.svg         → icon-512.png        (512×512)
       icon-512.svg         → apple-touch-icon.png (180×180)
       icon-512.svg         → favicon-32x32.png   (32×32)
       icon-512.svg         → favicon-16x16.png   (16×16)

     ⚠️ This SVG is NOT the source for icon-192.png. That PNG is
        generated from icon-192.svg (see the previous file).
        Prior documentation claimed otherwise — corrected here.

     Purpose in manifest.json:
       • This SVG: declared as `"purpose": "any"`.
       • icon-512.png (derived from this SVG): declared as
         `"purpose": "maskable"`.

     ⚠️ Maskable-safe zone — honest assessment:
       The maskable safe zone is a circle of radius 40% of the
       canvas (≈205 px in a 512 canvas, i.e. from 51.2 to 460.8
       on each axis).

       The shield currently extends from y=52 to y=448 — that is
       right at the top boundary (52 vs 51.2). Horizontal extent
       (x=96 to x=416) is safely inside.

       Result: on the majority of Android launchers the icon
       renders fine, but on devices that apply an aggressive
       circular mask (e.g. some OEM launchers at 45%+), the top
       of the shield may be clipped by a few pixels.

       A future release may ship a dedicated maskable variant
       with a wider safe-zone margin. Until then, the manifest
       accepts this trade-off rather than shipping a shrunk,
       visually-weaker icon.

     v1.1.0 note:
       • Version bumped from v1.0.0 to v1.1.0 to match the module
         release. No design changes were made.
       • Corrected the "source for all PNGs" claim — the 192 PNG
         comes from icon-192.svg, not from this file.
       • Corrected the "maskable icon" claim — this SVG is
         declared `any` in manifest.json. Only the PNG carries
         the maskable purpose.
       • Replaced the unsupported "40% safe circle" claim with an
         honest assessment of the current safe-zone situation.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DNSCrypt Smart Filter">
    <title>DNSCrypt Smart Filter</title>
    <desc>Shield-shaped icon with DNS label and green status indicator</desc>

    <defs>
        <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3a7bd5"/>
            <stop offset="100%" stop-color="#1e5bb8"/>
        </linearGradient>
        <linearGradient id="shieldGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4a7fc7"/>
            <stop offset="100%" stop-color="#3a6fb0"/>
        </linearGradient>
        <radialGradient id="dotGrad512" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#5ee06b"/>
            <stop offset="100%" stop-color="#2eb841"/>
        </radialGradient>
        <filter id="dotGlow512" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background (full-bleed for maskable compatibility) -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad512)"/>

    <!-- Shield shape -->
    <path d="M 256 52
             L 416 116
             L 416 256
             Q 416 374 256 448
             Q 96 374 96 256
             L 96 116 Z"
          fill="url(#shieldGrad512)"
          stroke="#2d5a94"
          stroke-width="5"
          stroke-linejoin="round"/>

    <!-- Inner highlight edge -->
    <path d="M 256 68
             L 400 126
             L 400 256
             Q 400 362 256 428
             Q 112 362 112 256
             L 112 126 Z"
          fill="none"
          stroke="#5a8fd4"
          stroke-width="2"
          opacity="0.6"/>

    <!-- "DNS" text -->
    <text x="256" y="312"
          font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="160"
          font-weight="900"
          fill="#0d1117"
          text-anchor="middle"
          letter-spacing="3">DNS</text>

    <!-- Green status dot with glow -->
    <circle cx="256" cy="376" r="24" fill="url(#dotGrad512)" filter="url(#dotGlow512)"/>
    <circle cx="256" cy="376" r="34" fill="none" stroke="#5ee06b" stroke-width="3" opacity="0.55"/>
    <circle cx="256" cy="376" r="44" fill="none" stroke="#5ee06b" stroke-width="2" opacity="0.25"/>
</svg>